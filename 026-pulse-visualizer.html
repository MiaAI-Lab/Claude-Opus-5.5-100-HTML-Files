<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PULSE — Generative Audio Visualizer</title>
<meta name="description" content="PULSE: a generative electronic track synthesized live with the Web Audio API — kick, noise hi-hats, bassline and an arpeggiated pad in A minor at 110 BPM — driving a radial frequency bloom, a rushing tunnel and a mirrored horizon.">
<meta name="theme-color" content="#0c0612">
<style>
:root{
  --bg:#0c0612;
  --c1:#ff9a3c;
  --c2:#ff3c78;
  --c3:#7b2ff7;
  --c4:#16d9e3;
  --ink:#f4ecff;
  --ink2:rgba(244,236,255,.62);
  --ink3:rgba(244,236,255,.38);
  --panel:rgba(24,11,36,.58);
  --line:rgba(244,236,255,.11);
  --grad:linear-gradient(90deg,#ff9a3c,#ff3c78 36%,#7b2ff7 68%,#16d9e3);
  --wide:"Avenir Next","Futura","Century Gothic","URW Gothic","Montserrat","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono","Nimbus Mono PS",monospace;
  --pad:clamp(16px,2.6vw,36px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 var(--wide);overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c4);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.veil{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 46%,transparent 52%,rgba(6,2,10,.55) 82%,rgba(4,1,7,.9) 100%),
    linear-gradient(180deg,rgba(12,6,18,.55),transparent 22%,transparent 72%,rgba(12,6,18,.75));}
.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:repeating-conic-gradient(rgba(255,255,255,.9) 0 .5deg,transparent .5deg 1.2deg);background-size:7px 7px;animation:grain 1.2s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-1%,-2%)}100%{transform:translate(0,0)}}

/* ---------- brand ---------- */
.brand{position:fixed;left:var(--pad);top:var(--pad);pointer-events:none;max-width:60vw}
.title{margin:0;font:300 clamp(34px,4.6vw,64px)/1 var(--wide);letter-spacing:.62em;text-transform:uppercase;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.1em;
  filter:drop-shadow(0 0 22px rgba(255,60,120,.28))}
.sub{margin:14px 0 0;font:500 11px/1.5 var(--wide);letter-spacing:.42em;text-transform:uppercase;color:var(--ink2)}
.sub b{font-weight:600;color:var(--ink)}

/* ---------- readout ---------- */
.readout{position:fixed;right:var(--pad);top:var(--pad);display:flex;gap:18px;align-items:stretch;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.readout dl{margin:0;display:grid;grid-template-columns:auto auto;gap:7px 14px;align-content:center}
.readout dt{color:var(--ink3)}
.readout dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums;min-width:11ch}
.readout dd.hot{color:var(--c1)}
.meters{display:flex;gap:6px;align-items:flex-end;padding-left:16px;border-left:1px solid var(--line)}
.meter{display:flex;flex-direction:column;align-items:center;gap:6px}
.meter .tube{width:8px;height:62px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.meter .tube i{position:absolute;left:0;right:0;bottom:0;height:100%;border-radius:5px;transform-origin:50% 100%;transform:scaleY(.05)}
.meter:nth-child(1) i{background:linear-gradient(0deg,#ff9a3c,#ff3c78)}
.meter:nth-child(2) i{background:linear-gradient(0deg,#ff3c78,#7b2ff7)}
.meter:nth-child(3) i{background:linear-gradient(0deg,#7b2ff7,#16d9e3)}
.meter span{font-size:9px;color:var(--ink3);letter-spacing:.1em}
.beat{width:8px;height:8px;border-radius:50%;background:var(--c2);box-shadow:0 0 0 0 rgba(255,60,120,.6);opacity:.25;transition:opacity .25s}

/* ---------- prompt ---------- */
.prompt{position:fixed;left:50%;bottom:calc(var(--pad) + 104px);transform:translateX(-50%);display:flex;align-items:center;gap:14px;pointer-events:none;text-align:left;transition:opacity .6s ease,transform .6s ease}
.prompt.gone{opacity:0;transform:translate(-50%,14px)}
.prompt .ring{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(244,236,255,.5);position:relative;flex:none}
.prompt .ring::before{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid var(--c2);animation:ping 2.2s cubic-bezier(.2,.6,.3,1) infinite}
.prompt .ring::after{content:"";position:absolute;left:14px;top:11px;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent var(--ink)}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.prompt p{margin:0;font:500 12px/1.5 var(--wide);letter-spacing:.34em;text-transform:uppercase}
.prompt small{display:block;font:400 10.5px/1.5 var(--mono);letter-spacing:.12em;color:var(--ink3);margin-top:3px}

/* ---------- timeline ---------- */
.timeline{position:fixed;left:var(--pad);bottom:calc(var(--pad) + 6px);display:flex;flex-direction:column;gap:9px;font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);pointer-events:none}
.segs{display:flex;gap:4px}
.seg{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.seg i{position:absolute;inset:0;background:var(--grad);transform-origin:0 50%;transform:scaleX(0)}
.seg.done i{transform:scaleX(1);opacity:.45}
.seg.on{box-shadow:0 0 12px rgba(255,60,120,.5)}
.tl-name{color:var(--ink);letter-spacing:.3em}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:var(--pad);transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.play{width:56px;height:56px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;display:grid;place-items:center;background:conic-gradient(from 200deg,#ff9a3c,#ff3c78,#7b2ff7,#16d9e3,#ff9a3c);box-shadow:0 0 26px rgba(255,60,120,.35);transition:transform .18s ease}
.play::before{content:"";position:absolute;inset:2px;border-radius:50%;background:#170a22}
.play:hover{transform:scale(1.05)}
.play:active{transform:scale(.95)}
.play svg{position:relative;width:22px;height:22px}
.play .i-pause{display:none}
.play[aria-pressed="true"] .i-play{display:none}
.play[aria-pressed="true"] .i-pause{display:block}
.modes{position:relative;display:flex;padding:4px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06)}
.modes .pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:linear-gradient(90deg,rgba(255,154,60,.9),rgba(255,60,120,.9));box-shadow:0 0 18px rgba(255,60,120,.45);transition:transform .38s cubic-bezier(.3,1.3,.5,1),width .38s,background .38s}
.modes button{position:relative;z-index:1;border:0;background:none;cursor:pointer;padding:10px 16px;border-radius:999px;font:600 11px/1 var(--wide);letter-spacing:.24em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px;transition:color .2s}
.modes button[aria-checked="true"]{color:#12061b}
.modes button svg{width:14px;height:14px;flex:none}
.vol{display:flex;align-items:center;gap:10px;padding:0 4px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;display:grid;place-items:center;padding:0;transition:background-color .2s,border-color .2s,color .2s}
.icon-btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22)}
.icon-btn svg{width:18px;height:18px}
.icon-btn[aria-pressed="true"]{background:rgba(22,217,227,.16);border-color:rgba(22,217,227,.6);color:#bff9fc}
#mute[aria-pressed="true"]{background:rgba(255,60,120,.16);border-color:rgba(255,60,120,.6);color:#ffd0df}
#mute .x{display:none}
#mute[aria-pressed="true"] .x{display:block}
#mute[aria-pressed="true"] .w{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:22px;background:transparent;cursor:pointer;--v:70%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#ff9a3c,#ff3c78 50%,#7b2ff7) 0 0/var(--v) 100% no-repeat,rgba(255,255,255,.12)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:linear-gradient(90deg,#ff9a3c,#ff3c78,#7b2ff7)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;margin-top:-6px;background:#fff;box-shadow:0 0 0 4px rgba(255,60,120,.25),0 0 14px rgba(255,60,120,.7)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,60,120,.25),0 0 14px rgba(255,60,120,.7)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--c4),0 0 14px rgba(22,217,227,.8)}
.divider{width:1px;height:30px;background:var(--line)}
.keys{position:fixed;right:var(--pad);bottom:calc(var(--pad) + 6px);margin:0;font:500 10px/1.8 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);text-align:right;pointer-events:none}
.keys kbd{font:inherit;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin:0 2px}

.toast{position:fixed;left:50%;top:calc(var(--pad) + 4px);transform:translate(-50%,-16px);opacity:0;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(20,8,30,.82);font:500 11px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);pointer-events:none;transition:opacity .3s,transform .3s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){
  .keys{display:none}
}
@media (max-width:820px){
  .timeline{display:none}
  .readout{left:var(--pad);right:auto;top:auto;bottom:calc(var(--pad) + 150px);padding:10px 12px;gap:12px}
  .readout dl{grid-template-columns:auto auto auto auto;gap:6px 10px}
  .readout dd{min-width:0}
  .meters{padding-left:12px}
  .meter .tube{height:38px;width:6px}
  .dock{flex-wrap:wrap;justify-content:center;width:calc(100vw - 2 * var(--pad));border-radius:24px;gap:10px;padding:10px}
  .prompt{bottom:auto;top:calc(var(--pad) + 108px);left:var(--pad);transform:none}
  .prompt.gone{transform:translateY(10px)}
}
@media (max-width:520px){
  .title{letter-spacing:.5em;font-size:34px}
  .sub{letter-spacing:.3em;font-size:10px;margin-top:10px}
  .readout{font-size:10px;letter-spacing:.1em;right:var(--pad)}
  .readout dl{grid-template-columns:auto 1fr auto 1fr}
  .modes button{padding:10px 11px;letter-spacing:.14em;font-size:10.5px}
  .modes button svg{display:none}
  .dock .divider{display:none}
  input[type=range]{width:96px}
  .play{width:52px;height:52px}
}
@media (prefers-reduced-motion:reduce){
  .grain,.prompt .ring::before{animation:none}
  .modes .pill{transition:none}
}
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="Audio-reactive visual: a radial bloom of 128 frequency bars, a rushing tunnel of rings or a mirrored horizon landscape, depending on the selected mode"></canvas>
<div class="veil" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="brand">
  <h1 class="title">Pulse</h1>
  <p class="sub">Generative audio visualizer · <b>A minor</b> · synthesized live</p>
</header>

<section class="readout" aria-label="Track readout">
  <dl>
    <dt>BPM</dt><dd id="r-bpm">110</dd>
    <dt>Bar</dt><dd id="r-bar">000</dd>
    <dt>Section</dt><dd id="r-sec" class="hot">Standby</dd>
    <dt>Source</dt><dd id="r-src">Idle</dd>
  </dl>
  <div class="meters" aria-hidden="true">
    <div class="meter"><div class="tube"><i id="m-lo"></i></div><span>LO</span></div>
    <div class="meter"><div class="tube"><i id="m-mi"></i></div><span>MID</span></div>
    <div class="meter"><div class="tube"><i id="m-hi"></i></div><span>HI</span></div>
  </div>
</section>

<div class="prompt" id="prompt" aria-hidden="true">
  <span class="ring"></span>
  <p>Click anywhere to ignite<small>kick · noise hats · bass · arpeggiated pad — evolving every 8 bars</small></p>
</div>

<nav class="timeline" aria-label="Track sections">
  <span>Section <span class="tl-name" id="tl-name">—</span></span>
  <div class="segs" id="segs"></div>
</nav>

<div class="dock" role="toolbar" aria-label="Player controls">
  <button type="button" class="play" id="play" aria-pressed="false" aria-label="Play">
    <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="#fff"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="#fff"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="#fff"/></svg>
  </button>
  <div class="modes" role="radiogroup" aria-label="Visual mode" id="modes">
    <span class="pill" aria-hidden="true"></span>
    <button type="button" role="radio" aria-checked="true" data-mode="0"><svg viewBox="0 0 16 16" aria-hidden="true"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 1v3M8 12v3M1 8h3M12 8h3M3 3l2 2M11 11l2 2M13 3l-2 2M5 11l-2 2"/></g><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>Bloom</button>
    <button type="button" role="radio" aria-checked="false" data-mode="1" tabindex="-1"><svg viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><circle cx="8" cy="8" r="4"/><circle cx="8" cy="8" r="1.6"/></g></svg>Tunnel</button>
    <button type="button" role="radio" aria-checked="false" data-mode="2" tabindex="-1"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8h14M1 11l3-2 3 1.5 3-3 2 2 3-1.5M1 5l3 2 3-1.5 3 3 2-2 3 1.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Horizon</button>
  </div>
  <span class="divider" aria-hidden="true"></span>
  <div class="vol">
    <button type="button" class="icon-btn" id="mute" aria-pressed="false" aria-label="Mute">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3.2L11 3.8v12.4L6.2 12.5H3z" fill="currentColor"/><path class="w" d="M13.6 7c1.3 1.7 1.3 4.3 0 6M15.8 5c2.3 2.9 2.3 7.1 0 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path class="x" d="M13.5 7.5l5 5M18.5 7.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <label class="sr" for="volume">Volume</label>
    <input type="range" id="volume" min="0" max="100" value="70" aria-valuetext="70 percent">
  </div>
  <span class="divider" aria-hidden="true"></span>
  <button type="button" class="icon-btn" id="mic" aria-pressed="false" aria-label="Use microphone">
    <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.8M7 17.8h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <button type="button" class="icon-btn" id="fs" aria-label="Toggle fullscreen">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5V3h4.5M12.5 3H17v4.5M17 12.5V17h-4.5M7.5 17H3v-4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
</div>

<p class="keys" aria-hidden="true"><kbd>Space</kbd> play · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> mode<br><kbd>M</kbd> mute · <kbd>↑</kbd><kbd>↓</kbd> volume</p>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  };

  /* ====================== PALETTE ====================== */
  const STOPS = [[255, 154, 60], [255, 60, 120], [123, 47, 247], [22, 217, 227]];
  function grad(t) {
    t = Math.min(1, Math.max(0, t)) * 3;
    const i = Math.min(2, Math.floor(t)), f = t - i, a = STOPS[i], b = STOPS[i + 1];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }
  const LUT = [], LUTC = [];
  for (let i = 0; i < 256; i++) {
    const c = grad(i / 255); LUTC.push(c);
    LUT.push(`rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`);
  }
  // looping LUT (orange→pink→violet→cyan→back) for cycling hues in the tunnel
  const LOOP = [];
  for (let i = 0; i < 256; i++) { const t = i < 128 ? i / 127 : (255 - i) / 127; LOOP.push(LUT[Math.round(t * 255)]); }

  /* ====================== CANVAS ====================== */
  const cv = $('#cv'), ctx = cv.getContext('2d', { alpha: false });
  const buf = document.createElement('canvas'), bctx = buf.getContext('2d', { alpha: false });
  let W = 0, H = 0, S = 0, cx = 0, cy = 0, scale = 1, cw = 0, ch = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    scale = Math.min(dpr, Math.sqrt(2400000 / Math.max(1, W * H)));
    cw = Math.max(1, Math.round(W * scale)); ch = Math.max(1, Math.round(H * scale));
    cv.width = cw; cv.height = ch; buf.width = cw; buf.height = ch;
    S = Math.min(W, H * (W < 820 ? 1 : 1.08));
    cx = W / 2; cy = H * (W < 820 ? .44 : .5);
    ctx.fillStyle = '#0c0612'; ctx.fillRect(0, 0, cw, ch);
    buildSun();
  }

  /* glow sprites: 16 tints along the gradient + a white core */
  function sprite(size, rgb, core) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), r = size / 2, gr = g.createRadialGradient(r, r, 0, r, r, r);
    if (core) {
      gr.addColorStop(0, 'rgba(255,248,240,1)');
      gr.addColorStop(.09, 'rgba(255,214,170,.95)');
      gr.addColorStop(.26, 'rgba(255,60,120,.6)');
      gr.addColorStop(.55, 'rgba(123,47,247,.2)');
      gr.addColorStop(1, 'rgba(123,47,247,0)');
    } else {
      gr.addColorStop(0, 'rgba(255,255,255,1)');
      gr.addColorStop(.22, `rgba(${rgb[0] | 0},${rgb[1] | 0},${rgb[2] | 0},.9)`);
      gr.addColorStop(1, `rgba(${rgb[0] | 0},${rgb[1] | 0},${rgb[2] | 0},0)`);
    }
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
    return c;
  }
  const SPR = []; for (let i = 0; i < 16; i++) SPR.push(sprite(32, grad(i / 15)));
  const CORE = sprite(256, null, true);

  let SUN = null;
  function buildSun() {
    const r = Math.round(S * .17 * scale) || 10, c = document.createElement('canvas');
    c.width = c.height = r * 2;
    const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, r * 2);
    gr.addColorStop(0, '#ffd08a'); gr.addColorStop(.3, '#ff9a3c'); gr.addColorStop(.62, '#ff3c78'); gr.addColorStop(1, '#7b2ff7');
    g.fillStyle = gr; g.beginPath(); g.arc(r, r, r, 0, Math.PI * 2); g.fill();
    g.globalCompositeOperation = 'destination-out';
    for (let k = 0; k < 7; k++) { const y = r * (1.02 + k * .14), hgt = r * (.018 + k * .016); g.fillRect(0, y, r * 2, hgt); }
    SUN = c;
  }

  /* ====================== SPECTRUM STATE ====================== */
  const N = 64;
  const spec = new Float32Array(N), liveT = new Float32Array(N), idle = new Float32Array(N);

  const HR = 34, HIST = new Float32Array(HR * N);
  let histHead = 0, histAcc = 0;
  const HIST_DT = .07;

  /* ====================== FRAME ====================== */
  let last = performance.now(), T = 0, spin = 0;
  const mLo = $('#m-lo'), mMi = $('#m-mi'), mHi = $('#m-hi');
  let meterTick = 0, pk = 0, lastBass = 0, bassAvg = 0, micKickT = 0;

  function readSpectrum(dt) {
    const an = micOn && micAn ? micAn : (AC && (state === 'playing') ? analyser : null);
    const target = an ? 1 : 0;
    live += (target - live) * Math.min(1, dt * 2.2);
    if (an && fbin) {
      an.getByteFrequencyData(fbin);
      for (let j = 0; j < N; j++) {
        let m = 0; const a = RANGES[j * 2], b = RANGES[j * 2 + 1];
        for (let k = a; k < b; k++) if (fbin[k] > m) m = fbin[k];
        let v = m / 255; v = Math.max(0, (v - .12) / .88); v = Math.pow(v, 1.35) * (1 + j / N * .9);
        liveT[j] = Math.min(1.2, v);
      }
    } else for (let j = 0; j < N; j++) liveT[j] *= .9;
    // idle breathing spectrum
    const br = .72 + .28 * Math.sin(T * 1.05);
    for (let j = 0; j < N; j++) {
      const x = j / (N - 1);
      idle[j] = Math.max(.02, (.3 + .17 * Math.sin(T * 1.25 + j * .21) + .11 * Math.sin(T * .47 - j * .13) + .06 * Math.sin(T * 2.3 + j * .9)) * (1 - x * .5) * br);
    }
    let lo = 0, mi = 0, hi = 0;
    for (let j = 0; j < N; j++) {
      const tv = idle[j] * (1 - live) + liveT[j] * live;
      spec[j] += (tv - spec[j]) * (tv > spec[j] ? .55 : .14);
      if (j < 7) lo += spec[j]; else if (j < 30) mi += spec[j]; else hi += spec[j];
    }
    bass = lo / 7; mid = mi / 23; high = hi / 34;
    // kicks: engine events, mic onset detection, or idle heartbeat
    if (AC && state === 'playing' && !micOn) {
      const now = AC.currentTime;
      while (evR < evW && EV[evR % 128].t <= now) {
        const e = EV[evR % 128]; evR++;
        if (e.kick) { kick = 1; pk = 1; }
        showBar(e.bar, e.step);
      }
    } else if (micOn) {
      bassAvg += (bass - bassAvg) * .05;
      if (bass > bassAvg * 1.3 && bass > .32 && bass - lastBass > .04 && T - micKickT > .22) { kick = 1; pk = 1; micKickT = T; }
    } else {
      const hb = (T * .9) % 1;
      if (hb < dt * .9) pk = .55;
    }
    lastBass = bass;
    kick *= Math.exp(-dt * 7.5);
    pk *= Math.exp(-dt * 5);
  }

  function feedback(zoom, rot, fade, dy) {
    bctx.globalCompositeOperation = 'copy';
    bctx.drawImage(cv, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#0c0612'; ctx.fillRect(0, 0, cw, ch);
    ctx.globalAlpha = fade;
    const px = cx * scale, py = cy * scale;
    ctx.translate(px, py + (dy || 0) * scale); ctx.rotate(rot); ctx.scale(zoom, zoom); ctx.translate(-px, -py);
    ctx.drawImage(buf, 0, 0);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.globalAlpha = 1;
  }

  function drawBloom(dt) {
    const k = kick * (1 - live * .15) + pk * .5 * (1 - live);
    const z = reduce ? 1.004 : 1.011 + bass * .01 + kick * .006;
    feedback(z, reduce ? 0 : (.0022 + high * .006) * (dt * 60), .84, 0);
    spin += dt * (.05 + high * .25);
    const R0 = S * (.145 + k * .018 + bass * .012), L = S * .235;
    // damp the feedback inside the ring so the core stays a core, not a blown-out disc
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = .6; ctx.fillStyle = '#0c0612';
    ctx.beginPath(); ctx.arc(cx, cy, R0 * 1.02, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    // particles
    for (let i = 0; i < PN; i++) {
      const p = P[i];
      p.a += p.dir * p.w * (.3 + high * 7 + kick * 1.5) * dt;
      const rr = S * p.r * (1 + bass * .14 + Math.sin(T * .7 + p.ph) * .03) + R0 * .6;
      const x = cx + Math.cos(p.a) * rr, y = cy + Math.sin(p.a) * rr * p.e;
      const sz = p.s * (.7 + high * .8);
      ctx.globalAlpha = .24 + high * .26;
      ctx.drawImage(SPR[p.c], x - sz, y - sz, sz * 2, sz * 2);
    }
    // bars: crisp, drawn over the smoke (source-over), so colour never saturates to white
    const bw = Math.max(1.4, (Math.PI * 2 * R0 / 128) * .52);
    ctx.lineCap = 'round'; ctx.lineWidth = bw;
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 128; i++) {
      const j = i < 64 ? i : 127 - i, v = spec[j];
      const a = -Math.PI / 2 + ((i + .5) / 128) * Math.PI * 2 + spin;
      const ca = Math.cos(a), sa = Math.sin(a), r1 = R0 + 4, r2 = r1 + 2 + v * L * (1 + k * .25);
      ctx.strokeStyle = LUT[Math.min(255, (j / 63 * 240 + v * 14) | 0)];
      ctx.globalAlpha = .62 + Math.min(.38, v * .5);
      ctx.beginPath(); ctx.moveTo(cx + ca * r1, cy + sa * r1); ctx.lineTo(cx + ca * r2, cy + sa * r2); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 128; i++) {
      const j = i < 64 ? i : 127 - i, v = spec[j];
      const a = -Math.PI / 2 + ((i + .5) / 128) * Math.PI * 2 + spin;
      const ca = Math.cos(a), sa = Math.sin(a);
      // inward reflection
      const r3 = R0 - 4 - v * R0 * .4;
      ctx.strokeStyle = LUT[Math.min(255, (j / 63 * 240) | 0)];
      ctx.globalAlpha = .16;
      ctx.beginPath(); ctx.moveTo(cx + ca * (R0 - 3), cy + sa * (R0 - 3)); ctx.lineTo(cx + ca * r3, cy + sa * r3); ctx.stroke();
      if (v > .5 && (i & 1)) {
        const r2 = R0 + 6 + v * L * (1 + k * .25), s = 2.5 + v * 6;
        ctx.globalAlpha = Math.min(.9, (v - .45) * 1.6);
        ctx.drawImage(SPR[(j / 4.2) | 0], cx + ca * (r2 + 5) - s, cy + sa * (r2 + 5) - s, s * 2, s * 2);
      }
    }
    // rings
    ctx.globalAlpha = .45; ctx.lineWidth = 1.2; ctx.strokeStyle = LUT[80];
    ctx.beginPath(); ctx.arc(cx, cy, R0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = .12 + k * .35; ctx.strokeStyle = LUT[200];
    ctx.beginPath(); ctx.arc(cx, cy, R0 + L * (.55 + mid * .6), 0, Math.PI * 2); ctx.stroke();
    // core
    const cr = R0 * (.86 + k * .5 + bass * .22);
    ctx.globalAlpha = .55 + k * .35;
    ctx.drawImage(CORE, cx - cr, cy - cr, cr * 2, cr * 2);
    ctx.globalAlpha = 1;
  }

  function drawTunnel(dt) {
    feedback(reduce ? 1.006 : 1.034 + bass * .02, reduce ? 0 : .004 * (dt * 60), .8, 0);
    ctx.globalCompositeOperation = 'lighter';
    const spd = (.2 + bass * .75 + kick * .55) * (reduce ? .5 : 1), base = S * .045, diag = Math.hypot(W, H) * .75;
    // streaks
    ctx.lineCap = 'round';
    for (let i = 0; i < PN; i += 2) {
      const p = P[i];
      p.z -= dt * spd * 1.4 * (.6 + p.w * 2);
      if (p.z <= .03) { p.z += 1; p.a = Math.random() * Math.PI * 2; }
      const r1 = base / p.z, r2 = base / Math.max(.02, p.z - .025 * (1 + high * 3));
      if (r1 > diag) continue;
      ctx.globalAlpha = Math.min(1, (1 - p.z) * 1.4) * (.35 + high * .7);
      ctx.strokeStyle = LUT[(p.c * 16) & 255]; ctx.lineWidth = Math.max(.6, 1.6 / p.z * .12);
      const ca = Math.cos(p.a), sa = Math.sin(p.a);
      ctx.beginPath(); ctx.moveTo(cx + ca * r1, cy + sa * r1); ctx.lineTo(cx + ca * r2, cy + sa * r2); ctx.stroke();
    }
    // rings
    for (let i = 0; i < RN; i++) {
      const g = RINGS[i];
      g.z -= dt * spd * .55;
      if (g.z <= .035) { g.z += 1; g.c = (g.c + 41) & 255; g.tw = Math.random() * 6.28; g.w = kick > .6 ? 2.4 : 1; }
      const r = base / g.z;
      if (r > diag) continue;
      const fadeIn = Math.min(1, (1 - g.z) * 2.2), fadeOut = Math.min(1, g.z * 7);
      ctx.globalAlpha = fadeIn * fadeOut * (.5 + mid * .7);
      ctx.strokeStyle = LOOP[(g.c + ((1 - g.z) * 90 | 0)) & 255];
      ctx.lineWidth = Math.max(.7, (g.w * 2.4) / g.z * .16);
      ctx.beginPath();
      for (let k = 0; k <= 64; k++) {
        const j = k < 32 ? k * 2 : (64 - k) * 2, v = spec[Math.min(63, j)];
        const a = g.tw + (k / 64) * Math.PI * 2 + T * .08;
        const rr = r * (1 + v * .22 * (1 - g.z * .6));
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // vanishing point glow
    const cr = S * (.09 + kick * .07 + bass * .04) * (1 + (1 - live) * pk * .4);
    ctx.globalAlpha = .6; ctx.drawImage(CORE, cx - cr, cy - cr, cr * 2, cr * 2);
    ctx.globalAlpha = 1;
  }

  function drawHorizon(dt) {
    feedback(1, 0, reduce ? .25 : .36, -.45);
    const y0 = cy, D = H - y0, top = y0;
    // history push
    histAcc += dt;
    while (histAcc >= HIST_DT) {
      histAcc -= HIST_DT; histHead = (histHead + 1) % HR;
      const o = histHead * N; for (let j = 0; j < N; j++) HIST[o + j] = spec[j];
    }
    const frac = histAcc / HIST_DT;
    // sun
    ctx.globalCompositeOperation = 'source-over';
    const sr = S * .17 * (1 + kick * .05 + pk * .03 * (1 - live));
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, y0); ctx.clip();
    ctx.globalAlpha = 1; ctx.drawImage(SUN, cx - sr, y0 - sr * 1.3, sr * 2, sr * 2);
    ctx.restore();
    ctx.globalCompositeOperation = 'lighter';
    const hr = S * .55; ctx.globalAlpha = .2 + kick * .25; ctx.drawImage(CORE, cx - hr, y0 - hr * .4, hr * 2, hr * .8);
    // perspective guides
    ctx.globalAlpha = .1; ctx.strokeStyle = LUT[150]; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = -10; k <= 10; k++) { const xb = cx + k * W * .12; ctx.moveTo(cx + k * 6, y0); ctx.lineTo(xb, H); ctx.moveTo(cx + k * 6, y0); ctx.lineTo(xb, 0); }
    ctx.stroke();
    // landscape rows far → near, mirrored
    const half = W * .5;
    for (let a = 0; a < HR; a++) {
      const row = (histHead - a + HR) % HR, o = row * N;
      const p = (a + frac) / HR; // 0 = horizon, 1 = viewer
      const persp = p * p;
      const yb = y0 + D * (.015 + persp * .98), ym = y0 - (yb - y0) * .62;
      const spread = half * (.28 + persp * 1.25), amp = H * .24 * (.12 + persp * .95);
      const ci = Math.min(255, (40 + (1 - p) * 215) | 0);
      for (let side = 0; side < 2; side++) {
        const base = side ? ym : yb, dir = side ? 1 : -1;
        ctx.beginPath();
        for (let b = 0; b <= 48; b++) {
          const xn = b / 24 - 1, j = Math.min(63, Math.round(Math.abs(xn) * 55));
          const win = Math.pow(Math.cos(xn * Math.PI / 2), 1.3);
          const v = HIST[o + j] * win;
          const x = cx + xn * spread, y = base + dir * v * amp * (side ? .62 : 1);
          if (b === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.lineTo(cx + spread, base); ctx.lineTo(cx - spread, base); ctx.closePath();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = side ? .3 : .92; ctx.fillStyle = '#0c0612'; ctx.fill();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = (side ? .3 * (1 - persp * .7) : .85) * Math.min(1, p * 3 + .15);
        ctx.strokeStyle = LUT[ci]; ctx.lineWidth = .8 + persp * 1.8; ctx.stroke();
      }
    }
    // horizon waveform
    let an = micOn && micAn ? micAn : (AC && state === 'playing' ? analyser : null);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1.6; ctx.strokeStyle = LUT[30]; ctx.globalAlpha = .9;
    ctx.beginPath();
    if (an && tbin) {
      an.getByteTimeDomainData(tbin);
      const n = 220, stepS = Math.floor(tbin.length / n);
      for (let i = 0; i <= n; i++) { const v = (tbin[Math.min(tbin.length - 1, i * stepS)] - 128) / 128; const x = (i / n) * W, y = y0 + v * H * .07 * (1 - Math.abs(i / n - .5) * 1.2); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    } else {
      for (let i = 0; i <= 120; i++) { const u = i / 120, x = u * W, y = y0 + Math.sin(u * 22 + T * 2.2) * Math.sin(u * Math.PI) * 6 * (.6 + pk); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    }
    ctx.stroke();
    ctx.globalAlpha = .5; ctx.strokeStyle = '#fff'; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawShocks(dt) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 6; i++) {
      const s = SHOCK[i]; if (s.a <= 0) continue;
      s.r += dt * S * .9; s.a -= dt * 1.1;
      ctx.globalAlpha = Math.max(0, s.a) * .8; ctx.strokeStyle = LUT[(i * 60) & 255]; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
    }
    if (modeFlash > 0) {
      ctx.globalAlpha = modeFlash * .35; ctx.fillStyle = LUT[(mode * 110) & 255]; ctx.fillRect(0, 0, W, H);
      modeFlash = Math.max(0, modeFlash - dt * 3);
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    const dt = Math.min(.05, Math.max(.001, (now - last) / 1000)); last = now; T += dt;
    readSpectrum(dt);
    if (mode === 0) drawBloom(dt); else if (mode === 1) drawTunnel(dt); else drawHorizon(dt);
    drawShocks(dt);
    if (++meterTick % 2 === 0) {
      mLo.style.transform = `scaleY(${Math.min(1, .04 + bass * 1.1).toFixed(3)})`;
      mMi.style.transform = `scaleY(${Math.min(1, .04 + mid * 1.3).toFixed(3)})`;
      mHi.style.transform = `scaleY(${Math.min(1, .04 + high * 1.8).toFixed(3)})`;
    }
    requestAnimationFrame(frame);
  }

  let rz = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { resize(); placePill(); }); });
  resize();
  setMode(mode);
  modeFlash = 0;
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placePill);
})();
</script>
</body>
</html>
