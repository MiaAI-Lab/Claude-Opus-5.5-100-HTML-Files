<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tend — A Habit Garden</title>
<meta name="description" content="Tend is a gentle habit tracker where every habit is a potted plant that grows from seed to bloom with your streak, with 12-week heatmaps, completion rings and best streaks. Everything stays in your browser.">
<meta name="theme-color" content="#f4f6f0">
<style>
:root{
  --bg:#f4f6f0;
  --paper:#fbfcf8;
  --sage:#9cb59a;
  --sage-l:#dfe8da;
  --sage-ll:#eaf0e6;
  --forest:#2f4f3a;
  --forest-2:#456b52;
  --clay:#d98e73;
  --clay-d:#c2765c;
  --sun:#f2c14e;
  --ink:#2f4f3a;
  --ink-2:#5d7564;
  --ink-3:#8a9c8d;
  --line:rgba(47,79,58,.12);
  --shadow:0 1px 0 rgba(255,255,255,.8) inset,0 18px 40px -22px rgba(47,79,58,.35),0 2px 6px -2px rgba(47,79,58,.12);
  --font:ui-rounded,"SF Pro Rounded","Seravek","Nunito","Avenir Next","Segoe UI","Candara","Trebuchet MS","DejaVu Sans",sans-serif;
  --r:24px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);font-variant-numeric:tabular-nums;overflow-x:hidden;
  background-image:radial-gradient(900px 500px at 88% -8%,rgba(242,193,78,.16),transparent 60%),radial-gradient(900px 600px at -10% 20%,rgba(156,181,154,.18),transparent 60%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--clay);outline-offset:3px;border-radius:12px}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}

/* ---------- header ---------- */
.top{position:relative;padding:34px 0 26px}
.sky{position:absolute;inset:0 0 auto 0;height:100%;pointer-events:none;overflow:hidden;z-index:0;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 98%);mask-image:linear-gradient(180deg,#000 55%,transparent 98%)}
.sky svg{position:absolute;right:-40px;top:0;width:min(760px,70vw);height:100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 38%);mask-image:linear-gradient(90deg,transparent,#000 38%)}
.top .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 28px;font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--forest)}
.brand svg{width:30px;height:30px}
.brand small{font-weight:500;color:var(--ink-3);font-size:13px;margin-left:4px}
.date{margin:0;font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}
.date b{color:var(--clay-d);font-weight:700}
.greet{margin:6px 0 0;font:700 clamp(34px,5vw,58px)/1.02 var(--font);letter-spacing:-.025em;color:var(--forest)}
.greet em{font-style:normal;color:var(--clay)}
.mood{margin:12px 0 0;font-size:17px;color:var(--ink-2);max-width:560px}
.today-row{display:flex;align-items:center;gap:14px;margin-top:22px}
.today-bar{position:relative;width:220px;height:12px;border-radius:99px;background:var(--sage-l);overflow:hidden}
.today-bar i{position:absolute;inset:0;border-radius:99px;background:linear-gradient(90deg,var(--sage),var(--forest-2));transform-origin:0 50%;transform:scaleX(0);transition:transform .8s cubic-bezier(.3,1.2,.4,1)}
.today-t{font-weight:700;font-size:15px}
.today-t span{color:var(--ink-3);font-weight:500}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:flex;padding:5px;border-radius:99px;background:var(--sage-ll);border:1px solid var(--line);position:relative}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:10px 18px;border-radius:99px;font-weight:700;font-size:14.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center;transition:color .25s}
.tabs button svg{width:17px;height:17px}
.tabs button[aria-selected="true"]{color:var(--forest)}
.tabs .knob{position:absolute;top:5px;bottom:5px;left:5px;border-radius:99px;background:var(--paper);box-shadow:0 4px 12px -4px rgba(47,79,58,.35);transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .45s}
.btn{border:0;border-radius:99px;padding:13px 20px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;transition:transform .15s ease,box-shadow .2s,background-color .2s}
.btn svg{width:18px;height:18px}
.btn-clay{background:var(--clay);color:#fff;box-shadow:0 10px 20px -10px rgba(194,118,92,.9)}
.btn-clay:hover{background:var(--clay-d);transform:translateY(-1px)}
.btn-clay:active{transform:translateY(1px) scale(.98)}
.btn-ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--sage-ll)}
.btn-forest{background:var(--forest);color:#f4f6f0}
.btn-forest:hover{background:#264231}

/* ---------- garden grid ---------- */
main{padding-bottom:40px}
.panel[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:26px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 20px 18px;display:flex;flex-direction:column;gap:16px;animation:rise .6s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.c-head{display:flex;align-items:center;gap:12px}
.glyph{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--hc) 22%,#fff);color:var(--hc-d,var(--forest))}
.glyph svg{width:22px;height:22px}
.c-title{min-width:0;flex:1}
.c-title h2{margin:0;font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.c-title p{margin:2px 0 0;font-size:13.5px;color:var(--ink-3);font-weight:500}
.edit{width:38px;height:38px;border-radius:12px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--ink-3);transition:background-color .2s,color .2s}
.edit:hover{background:var(--sage-ll);color:var(--forest)}
.edit svg{width:18px;height:18px}
.arch{position:relative;height:218px;border-radius:160px 160px 18px 18px;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 14%,#f7f9f3) 0%,#eef3ea 58%,#e3ebdd 100%)}
.arch::before{content:"";position:absolute;left:50%;top:18px;width:62%;height:62%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),transparent 70%)}
.arch::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,transparent,rgba(47,79,58,.06))}
.arch svg.plant{position:absolute;left:50%;bottom:4px;width:176px;height:209px;transform:translateX(-50%);overflow:visible;z-index:1}
.stage{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--forest);background:rgba(251,252,248,.82);border:1px solid var(--line);padding:5px 10px;border-radius:99px}
.next{position:absolute;right:10px;bottom:10px;z-index:2;font-size:12px;font-weight:600;color:var(--ink-3);background:rgba(251,252,248,.82);border:1px solid var(--line);padding:5px 10px;border-radius:99px}
.sway{transform-origin:80px 150px;animation:sway var(--sd,5s) ease-in-out infinite alternate;animation-delay:var(--sdl,0s)}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.4deg)}}
.pollen circle{animation:float 3.6s ease-in-out infinite alternate}
.pollen circle:nth-child(2){animation-duration:4.4s;animation-delay:-1.2s}
.pollen circle:nth-child(3){animation-duration:3.1s;animation-delay:-2s}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(6px,-12px)}}
.c-mid{display:flex;align-items:center;justify-content:space-between;gap:12px}
.streak{display:flex;align-items:baseline;gap:8px}
.streak b{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--forest)}
.streak span{font-size:13.5px;line-height:1.25;color:var(--ink-2);font-weight:600}
.streak span small{display:block;color:var(--ink-3);font-weight:500}
.water{border:2px solid var(--forest);background:transparent;color:var(--forest);border-radius:99px;padding:11px 18px 11px 14px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;transition:background-color .25s,color .25s,transform .15s,box-shadow .25s;white-space:nowrap}
.water svg{width:20px;height:20px}
.water:hover{background:var(--sage-ll);box-shadow:0 0 0 5px rgba(156,181,154,.25)}
.water:active{transform:scale(.96)}
.water[aria-pressed="true"]{background:var(--forest);color:#f4f6f0}
.water[aria-pressed="true"]:hover{background:#264231}
.water .ok{display:none}
.water[aria-pressed="true"] .ok{display:block}
.water[aria-pressed="true"] .can{display:none}
.cells{display:grid;grid-template-columns:14px repeat(12,minmax(0,1fr));grid-template-rows:repeat(7,18px);gap:3px;border-radius:8px;outline-offset:4px}
.cells .dl{grid-column:1;font-size:9.5px;font-weight:700;color:var(--ink-3);display:flex;align-items:center}
.cell{height:100%;min-width:0;border-radius:4px;background:#e4eadf;transition:transform .15s,box-shadow .15s;cursor:pointer}
.cell.l1{background:#c9d9c1}
.cell.l2{background:#9cb59a}
.cell.l3{background:#5f8a64}
.cell.l4{background:#2f4f3a}
.cell.fut{background:transparent;box-shadow:inset 0 0 0 1px rgba(47,79,58,.07);cursor:default}
.cell.today{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--clay)}
.cell:hover,.cell.cur{transform:scale(1.28);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--sun);position:relative;z-index:1}
.heat-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3);font-weight:600;margin-top:-6px}
.legend{display:flex;align-items:center;gap:3px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.add-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:300px;border:2px dashed rgba(47,79,58,.22);background:rgba(251,252,248,.5);box-shadow:none;color:var(--ink-2);font-weight:700;font-size:17px;border-radius:var(--r);transition:border-color .2s,background-color .2s,transform .2s;animation:rise .6s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.add-card:hover{border-color:var(--clay);background:rgba(255,255,255,.7);transform:translateY(-2px)}
.add-card svg{width:92px;height:92px}
.add-card small{font-weight:500;color:var(--ink-3);font-size:14px}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--forest);color:#f4f6f0;font-size:13px;font-weight:600;line-height:1.35;padding:8px 11px;border-radius:10px;box-shadow:0 10px 24px -10px rgba(0,0,0,.4);transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .12s;white-space:nowrap}
.tip small{display:block;font-weight:500;color:#cfe0cc}
.tip::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--forest);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tip.show{opacity:1}

/* ---------- fx ---------- */
.fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fx span{position:absolute;left:0;top:0;display:block;will-change:transform,opacity;opacity:0}
.fx .petal{width:12px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.fx .drop{width:9px;height:13px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:#8fc1d4}
.fx .spark{width:10px;height:10px;background:var(--sun);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.fx .leaf{width:10px;height:16px;border-radius:0 100% 0 100%;background:var(--sage)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:26px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
.box h2{margin:0 0 4px;font-size:21px;letter-spacing:-.01em}
.box > p{margin:0 0 20px;color:var(--ink-3);font-size:14.5px;font-weight:500}
.rings{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.ringsvg{width:260px;height:260px}
.ringsvg circle{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.rl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rl li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;font-weight:600}
.rl i{width:14px;height:14px;border-radius:50%}
.rl b{font-size:18px;font-weight:800}
.rl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.bests li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center}
.bests .mini{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sage-ll)}
.bests .mini svg{width:34px;height:40px}
.bests .row1{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;margin-bottom:6px}
.bests .row1 span:last-child{color:var(--ink-3);font-weight:600;font-size:13.5px;white-space:nowrap}
.bests .track{position:relative;height:12px;border-radius:99px;background:var(--sage-ll);overflow:hidden}
.bests .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transform-origin:0 50%;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.bests .track i.best{opacity:.35}
.crown{color:var(--sun);font-size:15px}
.tiles{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile span{font-size:13.5px;color:var(--ink-3);font-weight:600}
.week{grid-column:1/-1}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px;align-items:end;height:170px;padding-top:10px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.wk .bar{width:100%;max-width:64px;border-radius:14px 14px 6px 6px;background:linear-gradient(180deg,var(--sage),#7fa27f);transform-origin:50% 100%;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.wk .bar.peak{background:linear-gradient(180deg,var(--sun),var(--clay))}
.wk span{font-size:13px;font-weight:700;color:var(--ink-2)}
.wk small{font-size:12px;color:var(--ink-3);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--ink-3)}

/* ---------- footer ---------- */
.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:30px 0 48px;color:var(--ink-3);font-size:14px;border-top:1px solid var(--line);margin-top:24px}
.foot button{background:none;border:0;color:var(--clay-d);font-weight:700;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}

/* ---------- dialog ---------- */
dialog{border:0;padding:0;border-radius:28px;background:var(--paper);color:var(--ink);width:min(520px,calc(100vw - 28px));box-shadow:0 40px 80px -30px rgba(20,40,28,.55);max-height:calc(100vh - 28px);overflow:auto}
dialog::backdrop{background:rgba(35,55,42,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.dlg{padding:26px 26px 22px;display:flex;flex-direction:column;gap:18px}
.dlg h2{margin:0;font-size:24px;letter-spacing:-.015em}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:14px}
.dlg-prev{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--sage-ll);flex:none}
.dlg-prev svg{width:54px;height:62px}
.field label,.field legend{display:block;font-weight:700;font-size:14px;margin-bottom:8px;padding:0}
.field{border:0;margin:0;padding:0;min-width:0}
.field input[type=text]{width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:600;transition:border-color .2s}
.field input[type=text]:focus{outline:none;border-color:var(--sage)}
.field input[type=text][aria-invalid="true"]{border-color:var(--clay)}
.err{margin:6px 0 0;color:var(--clay-d);font-size:13px;font-weight:600;min-height:1em}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;transition:border-color .15s,background-color .15s,transform .15s;color:var(--forest)}
.opt span svg{width:22px;height:22px}
.opt input:checked+span{border-color:var(--forest);background:var(--sage-ll);transform:translateY(-2px)}
.opt input:focus-visible+span{outline:3px solid var(--clay);outline-offset:2px}
.sw span{border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 2.5px var(--forest);transform:scale(1.08)}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:6px}
.dlg-foot .right{display:flex;gap:10px;margin-left:auto}
.del{background:none;border:0;color:var(--clay-d);font-weight:700;padding:10px 6px;display:inline-flex;gap:6px;align-items:center}
.del svg{width:17px;height:17px}
.del.sure{background:var(--clay);color:#fff;border-radius:99px;padding:10px 16px}

.toast{position:fixed;left:50%;bottom:26px;z-index:60;transform:translate(-50%,30px);opacity:0;background:var(--forest);color:#f4f6f0;padding:12px 18px;border-radius:99px;font-weight:600;font-size:15px;box-shadow:0 16px 30px -12px rgba(20,40,28,.6);transition:opacity .3s,transform .35s cubic-bezier(.2,1.3,.4,1);max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .stats{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .wrap{padding:0 16px}
  .top{padding:22px 0 20px}
  .top .wrap{grid-template-columns:minmax(0,1fr)}
  .brand{margin-bottom:20px}
  .actions{justify-content:space-between}
  .sky svg{width:130%;right:-55%;opacity:.5}
  .sky .sprouts{display:none}
  .grid{grid-template-columns:minmax(0,1fr);gap:20px}
  .today-bar{width:150px}
  .rings{grid-template-columns:minmax(0,1fr);justify-items:center}
  .ringsvg{width:230px;height:230px}
  .rl{width:100%}
  .box{padding:20px}
  .wk{gap:8px;height:150px}
  .add-card{min-height:220px}
  .tabs button{padding:10px 14px}
}
@media (max-width:440px){
  .tabs button svg{display:none}
  .tabs button{padding:10px 15px}
  .actions{flex-wrap:nowrap}
  .btn{padding:12px 16px;font-size:14.5px}
  .streak b{font-size:38px}
  .water{padding:10px 14px 10px 12px;font-size:14.5px}
}
@media (prefers-reduced-motion:reduce){
  .sway,.pollen circle,.card,.add-card{animation:none!important}
  dialog[open]{animation:none}
  .today-bar i,.ringsvg circle,.bests .track i,.wk .bar,.tabs .knob{transition:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="sky" aria-hidden="true">
    <svg viewBox="0 0 760 260" preserveAspectRatio="xMaxYMid slice">
      <defs>
        <radialGradient id="sunglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f2c14e" stop-opacity=".55"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
        <linearGradient id="hill1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfe8da" stop-opacity="0"/><stop offset=".3" stop-color="#dfe8da"/><stop offset="1" stop-color="#dfe8da"/></linearGradient>
        <linearGradient id="hill2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9d9c1" stop-opacity="0"/><stop offset=".4" stop-color="#c9d9c1"/><stop offset="1" stop-color="#c9d9c1"/></linearGradient>
      </defs>

  <div class="wrap">

      <p class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#dfe8da"/><path d="M16 25V13" stroke="#2f4f3a" stroke-width="2" stroke-linecap="round"/><path d="M16 17c-5 0-7-3-7-7 5 0 7 3 7 7zM16 14c0-4 3-7 7-7 0 4-3 7-7 7z" fill="#9cb59a"/><circle cx="16" cy="11" r="0" fill="#f2c14e"/></svg>Tend<small>a habit garden</small></p>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const KEY = 'tend-garden-v1';

  /* ================= DATES ================= */
  const pad = n => String(n).padStart(2, '0');
  const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; };
  const TODAY = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
  const TK = dkey(TODAY);
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const fmtShort = d => `${DAYS[d.getDay()].slice(0, 3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;
  const parseKey = k => { const [y, m, dd] = k.split('-').map(Number); return new Date(y, m - 1, dd); };
  const daysBetween = (a, b) => Math.round((b - a) / 86400000);

  /* ================= PALETTE / ICONS ================= */
  const COLORS = [
    { id: 'sage', v: '#9cb59a', d: '#3f6a4a', name: 'Sage' },
    { id: 'forest', v: '#2f4f3a', d: '#2f4f3a', name: 'Deep green' },
    { id: 'clay', v: '#d98e73', d: '#a65a40', name: 'Clay' },
    { id: 'sun', v: '#f2c14e', d: '#94701a', name: 'Sun yellow' },
    { id: 'rain', v: '#7fa7b5', d: '#3f6c7c', name: 'Rain blue' },
    { id: 'heather', v: '#b58db0', d: '#7a4f75', name: 'Heather' }
  ];
  const colorOf = id => COLORS.find(c => c.id === id) || COLORS[0];
  const ICONS = {
    drop: '<path d="M12 3.5c3.4 4 5.8 7.2 5.8 10.3a5.8 5.8 0 0 1-11.6 0C6.2 10.7 8.6 7.5 12 3.5z"/><path d="M9.3 14.2a2.8 2.8 0 0 0 2.4 2.6"/>',
    book: '<path d="M4 5.8c2.6-1 5.4-1 8 .6 2.6-1.6 5.4-1.6 8-.6v13c-2.6-1-5.4-1-8 .6-2.6-1.6-5.4-1.6-8-.6z"/><path d="M12 6.4v13"/>',
    leaf: '<path d="M5 19c0-8 5-13.2 14-14 0 9-5 14-13.5 14z"/><path d="M5 19l8.5-8.5"/>',
    moon: '<path d="M19 14.8A7.6 7.6 0 1 1 9.2 5a6.1 6.1 0 0 0 9.8 9.8z"/>',
    pen: '<path d="M4.5 19.5l3.8-.9L19 7.9 16.1 5 5.4 15.7z"/><path d="M14 7.1l2.9 2.9"/>',
    weights: '<path d="M3.5 9.5v5M6.5 7v10M17.5 7v10M20.5 9.5v5M6.5 12h11"/>',
    apple: '<path d="M12 8.3c-3.8-2-7 0-7 4.3 0 4.6 3.4 8.6 7 6.8 3.6 1.8 7-2.2 7-6.8 0-4.3-3.2-6.3-7-4.3z"/><path d="M12 8.2c0-2.2 1-3.8 3-4.4"/>',
    note: '<path d="M9 17.5V6.2l10-2v11.3"/><circle cx="6.8" cy="17.6" r="2.3"/><circle cx="16.8" cy="15.6" r="2.3"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>',
    heart: '<path d="M12 19.5s-7-4.3-7-9.6a4 4 0 0 1 7-2.6 4 4 0 0 1 7 2.6c0 5.3-7 9.6-7 9.6z"/>'
  };
  const ICON_NAMES = { drop: 'Water drop', book: 'Book', leaf: 'Leaf', moon: 'Moon', pen: 'Pen', weights: 'Dumbbell', apple: 'Apple', note: 'Music note', sun: 'Sun', heart: 'Heart' };
  const icon = k => `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.leaf}</svg>`;

  /* ================= STORAGE ================= */
  let db = null, storageOK = true;
  function load() {
    try { const raw = window.localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); if (o && Array.isArray(o.habits)) return o; } }
    catch (e) { storageOK = false; }
    return null;
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { if (storageOK) { storageOK = false; toast('Storage is blocked here — changes last until you close the tab.'); } }
  }
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function demo() {
    const r = rng(20260922);
    const mk = (id, name, ico, color, age, streak, doneToday, rate) => {
      const log = {};
      // current streak ending yesterday (or today)
      const end = doneToday ? 0 : 1;
      for (let i = end; i < end + streak; i++) log[dkey(addDays(TODAY, -i))] = 1;
      // older history: runs with gaps
      let i = end + streak + 1; // one missed day breaks the streak
      while (i < age) {
        if (r() < rate) { const run = 1 + Math.floor(r() * 9); for (let k = 0; k < run && i < age; k++, i++) log[dkey(addDays(TODAY, -i))] = 1; }
        i += 1 + Math.floor(r() * 2.2);
      }
      return { id, name, icon: ico, color, created: dkey(addDays(TODAY, -age)), log };
    };
    return {
      v: 1,
      habits: [
        mk('h1', 'Drink eight glasses of water', 'drop', 'rain', 96, 16, false, .86),
        mk('h2', 'Read twenty pages', 'book', 'clay', 90, 5, true, .7),
        mk('h3', 'Morning stretch', 'sun', 'sun', 84, 13, false, .78)
      ]
    };
  }
  db = load() || demo();
  if (!load()) save();

  /* ================= HABIT MATH ================= */
  const done = (h, d) => !!h.log[dkey(d)];
  function streakOf(h) {
    let d = done(h, TODAY) ? TODAY : addDays(TODAY, -1), n = 0;
    while (done(h, d)) { n++; d = addDays(d, -1); }
    return n;
  }
  function runAt(h, d) { let n = 0; while (done(h, d) && n < 60) { n++; d = addDays(d, -1); } return n; }
  function bestOf(h) {
    const keys = Object.keys(h.log).sort();
    let best = 0, cur = 0, prev = null;
    keys.forEach(k => { const d = parseKey(k); cur = prev && daysBetween(prev, d) === 1 ? cur + 1 : 1; prev = d; if (cur > best) best = cur; });
    return best;
  }
  function rate(h, days) {
    const age = Math.max(1, Math.min(days, daysBetween(parseKey(h.created), TODAY) + 1));
    let n = 0; for (let i = 0; i < age; i++) if (done(h, addDays(TODAY, -i))) n++;
    return n / age;
  }
  const STAGES = [
    { min: 0, name: 'Seed', next: 1 },
    { min: 1, name: 'Sprout', next: 3 },
    { min: 3, name: 'Leaves', next: 7 },
    { min: 7, name: 'Bud', next: 14 },
    { min: 14, name: 'Bloom', next: null }
  ];
  const stageOf = s => s >= 14 ? 4 : s >= 7 ? 3 : s >= 3 ? 2 : s >= 1 ? 1 : 0;

  /* ================= PLANT SVG ================= */
  function leaf(x, y, ang, len, col, vein) {
    const w = len * .36;
    return `<g transform="translate(${x} ${y}) rotate(${ang})"><path d="M0 0C${len * .28} ${-w} ${len * .74} ${-w * .95} ${len} 0C${len * .74} ${w * .8} ${len * .28} ${w * .85} 0 0Z" fill="${col}"/>${vein ? `<path d="M1 0L${len * .82} 0" stroke="rgba(255,255,255,.4)" stroke-width="1.1" fill="none" stroke-linecap="round"/>` : ''}</g>`;
  }
  function plant(stage, cid, opts) {
    const c = colorOf(cid), o = opts || {};
    const petal = c.v, petalD = c.d;
    let s = '';
    // pot
    s += `<g class="pot"><path d="M47 150h66l-7 36H54z" fill="#d98e73"/><path d="M50 156h60l-1.3 6.5H51.3z" fill="#c2765c" opacity=".55"/><rect x="41" y="140" width="78" height="14" rx="5" fill="#c9795d"/><rect x="45" y="142.5" width="18" height="3" rx="1.5" fill="#fff" opacity=".28"/><path d="M58 186h44" stroke="#b56a50" stroke-width="2" stroke-linecap="round" opacity=".5"/><ellipse cx="80" cy="141.5" rx="34" ry="4.4" fill="#6b5040"/></g>`;
    s += `<g class="sway" style="--sd:${o.sd || 5}s;--sdl:${o.sdl || 0}s"><g class="grow">`;
    const stem = (h, bend) => `<path d="M80 141C${80 + bend} ${141 - h * .45} ${80 - bend * .6} ${141 - h * .75} 80 ${141 - h}" fill="none" stroke="#3f6a4a" stroke-width="${2.2 + h * .018}" stroke-linecap="round"/>`;
    if (stage === 0) {
      s += `<path d="M62 141c5-8 30-8 36 0z" fill="#7a5a47"/><g transform="translate(80 134) rotate(-24)"><ellipse rx="6.5" ry="4.2" fill="#a57b52"/><path d="M-4 -1c2.5 1.4 5.5 1.4 8 0" stroke="#7d5a38" stroke-width="1" fill="none"/></g><path d="M86 128c1.5-2.5 1.5-5 0-7.5" stroke="#9cb59a" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="92" cy="120" r="1.6" fill="#f2c14e"/><circle cx="70" cy="124" r="1.2" fill="#f2c14e" opacity=".7"/>`;
    } else if (stage === 1) {
      s += stem(26, 4) + leaf(80, 116, -150, 17, '#9cb59a', true) + leaf(80, 116, -30, 17, '#8aab88', true);
    } else if (stage === 2) {
      s += stem(66, 7) + leaf(79, 126, -160, 26, '#7fa27f', true) + leaf(81, 116, -18, 28, '#9cb59a', true) + leaf(79, 102, -150, 24, '#9cb59a', true) + leaf(80, 90, -30, 20, '#8aab88', true) + leaf(80, 78, -120, 13, '#b4c9b0', false) + leaf(80, 78, -60, 13, '#b4c9b0', false);
    } else if (stage === 3) {
      s += stem(88, 8) + leaf(79, 128, -162, 30, '#6f956f', true) + leaf(81, 118, -16, 31, '#8aab88', true) + leaf(79, 104, -154, 28, '#9cb59a', true) + leaf(81, 92, -26, 25, '#9cb59a', true) + leaf(80, 76, -140, 18, '#8aab88', true);
      s += `<g transform="translate(80 53)"><path d="M0 -16C8 -10 9 2 0 8C-9 2 -8 -10 0 -16Z" fill="${petal}"/><path d="M0 -16C4 -10 4.5 0 0 8" fill="none" stroke="${petalD}" stroke-width="1.2" opacity=".5"/><path d="M-7 3C-4 9 4 9 7 3C4 5 -4 5 -7 3Z" fill="#3f6a4a"/><path d="M0 8C-5 6 -9 -1 -8 -6" fill="none" stroke="#3f6a4a" stroke-width="2" stroke-linecap="round"/><path d="M0 8C5 6 9 -1 8 -6" fill="none" stroke="#3f6a4a" stroke-width="2" stroke-linecap="round"/></g>`;
    } else {
      s += stem(94, 9) + leaf(79, 130, -164, 32, '#6f956f', true) + leaf(81, 120, -14, 33, '#8aab88', true) + leaf(79, 106, -152, 29, '#9cb59a', true) + leaf(81, 94, -28, 27, '#9cb59a', true) + leaf(80, 78, -146, 20, '#8aab88', true);
      // side branch with a small bud
      s += `<path d="M81 100C92 94 99 86 101 76" fill="none" stroke="#3f6a4a" stroke-width="2" stroke-linecap="round"/><g transform="translate(101 72) rotate(18)"><path d="M0 -8C4 -5 4.5 1 0 4C-4.5 1 -4 -5 0 -8Z" fill="${petal}"/><path d="M-4 2C-2 5 2 5 4 2" fill="#3f6a4a"/></g>`;
      // flower
      let petals = '';
      for (let i = 0; i < 8; i++) petals += `<ellipse cx="0" cy="-14" rx="7.2" ry="12.5" fill="${petal}" transform="rotate(${i * 45})"/>`;
      let inner = '';
      for (let i = 0; i < 8; i++) inner += `<ellipse cx="0" cy="-9" rx="4" ry="7.5" fill="#fff" opacity=".28" transform="rotate(${i * 45 + 22.5})"/>`;
      s += `<g transform="translate(80 47)"><g class="bloom-head">${petals}${inner}<circle r="7.6" fill="#f2c14e"/><circle r="7.6" fill="none" stroke="${petalD}" stroke-width="1.2" opacity=".35"/><circle cx="-2.2" cy="-1.8" r="1" fill="#b98a1d"/><circle cx="2.4" cy="-1" r="1" fill="#b98a1d"/><circle cx="-.4" cy="2.4" r="1" fill="#b98a1d"/><circle cx="2.8" cy="3" r=".8" fill="#b98a1d"/></g></g>`;
      s += `<g class="pollen" fill="#f2c14e"><circle cx="60" cy="40" r="1.8"/><circle cx="104" cy="34" r="1.4"/><circle cx="96" cy="56" r="1.1"/></g>`;
    }
    s += '</g></g>';
    return s;
  }

  /* ================= GREETING & SKY ================= */
  function header() {
    const now = new Date(), h = now.getHours();
    $('#date').innerHTML = `${DAYS[now.getDay()]}, <b>${now.getDate()} ${MONTHS[now.getMonth()]}</b> ${now.getFullYear()}`;
    let g, m;
    if (h >= 5 && h < 12) { g = 'Good morning, <em>gardener</em>.'; m = 'Dew on the leaves. A small thing done early grows all day.'; }
    else if (h >= 12 && h < 17) { g = 'Good afternoon, <em>gardener</em>.'; m = 'The sun is high — a good hour to water whatever still looks thirsty.'; }
    else if (h >= 17 && h < 22) { g = 'Good evening, <em>gardener</em>.'; m = 'Golden hour in the greenhouse. One last round before the light goes.'; }
    else { g = 'Still up, <em>night gardener</em>?'; m = 'The garden is asleep, but it will not mind a quiet watering.'; }
    $('#greet').innerHTML = g; $('#mood').textContent = m;
    // sun (or moon) follows the time of day along an arc
    const t = ((h + now.getMinutes() / 60) - 5) / 17; // 5:00 → 0, 22:00 → 1
    const night = t < 0 || t > 1, u = Math.min(1, Math.max(0, t));
    const x = 330 + u * 380, y = 200 - Math.sin(u * Math.PI) * 150;
    ['#sunhalo', '#sundisc'].forEach(id => { $(id).setAttribute('cx', night ? 640 : x.toFixed(1)); $(id).setAttribute('cy', night ? 70 : y.toFixed(1)); });
    if (night) { $('#sundisc').setAttribute('fill', '#e8e2c4'); $('#sunhalo').setAttribute('opacity', '.35'); $('#moonbite').setAttribute('d', 'M652 58a28 28 0 1 0 0 30a22 22 0 1 1 0-30z'); }
  }

  /* ================= RENDER GARDEN ================= */
  const grid = $('#grid');
  function summary() {
    const n = db.habits.length, d = db.habits.filter(h => done(h, TODAY)).length;
    $('#today-t').innerHTML = `${d} of ${n} <span>tended today</span>`;
    $('#today-fill').style.transform = `scaleX(${n ? d / n : 0})`;
  }
  function cardHTML(h, i) {
    const s = streakOf(h), st = stageOf(s), c = colorOf(h.color), best = bestOf(h), dt = done(h, TODAY);
    const nx = STAGES[st].next, rem = nx ? nx - s : 0;
    const nextTxt = nx ? `${rem} day${rem === 1 ? '' : 's'} to ${STAGES[st + 1].name.toLowerCase()}` : 'In full bloom';
    return `
      <div class="c-head">
        <span class="glyph" aria-hidden="true">${icon(h.icon)}</span>
        <div class="c-title"><h2 id="hn-${h.id}"></h2><p>Daily · best streak ${best} day${best === 1 ? '' : 's'}</p></div>
        <button type="button" class="edit" data-edit="${h.id}" aria-label="Edit ${esc(h.name)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5l3.8-.9L19 7.9 16.1 5 5.4 15.7z M14 7.1l2.9 2.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
      </div>
      <div class="arch">
        <span class="stage">${STAGES[st].name}</span><span class="next">${nextTxt}</span>
        <svg class="plant" viewBox="0 0 160 190" role="img" aria-label="${STAGES[st].name} stage plant, streak ${s} days">${plant(st, h.color, { sd: 4.2 + (i % 3) * .9, sdl: -i * .7 })}</svg>
      </div>

      <section class="box week" aria-labelledby="s-week">
        <h2 id="s-week">Weekly rhythm</h2><p>You tend most reliably on <strong>${WL[bestW]}s</strong> (${Math.round(wr[bestW] * 100)}% over the last 12 weeks).</p>
        <div class="wk">${wr.map((v, i) => `<div><small>${Math.round(v * 100)}%</small><span class="bar${i === bestW ? ' peak' : ''}" style="height:${Math.max(4, v * 100)}%;transform:scaleY(0)" data-to="1"></span><span>${WN[i]}</span></div>`).join('')}</div>
      </section>`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      $$('.arc', el).forEach(a => a.setAttribute('stroke-dashoffset', a.dataset.to));
      $$('.bests .track i', el).forEach(b => b.style.transform = `scaleX(${b.dataset.to})`);
      $$('.wk .bar', el).forEach(b => b.style.transform = 'scaleY(1)');
    }));
  }

  /* ================= TABS ================= */
  const tabs = [$('#tab-garden'), $('#tab-stats')], knob = $('.tabs .knob');
  function placeKnob() { const t = tabs.find(x => x.getAttribute('aria-selected') === 'true'); knob.style.width = t.offsetWidth + 'px'; knob.style.transform = `translateX(${t.offsetLeft - 5}px)`; }
  function selectTab(i, focus) {
    tabs.forEach((t, k) => { t.setAttribute('aria-selected', k === i ? 'true' : 'false'); t.tabIndex = k === i ? 0 : -1; });
    $('#panel-garden').hidden = i !== 0; $('#panel-stats').hidden = i !== 1;
    if (i === 1) renderStats();
    if (focus) tabs[i].focus();
    placeKnob(); hideTip();
  }
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => selectTab(i));
    t.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); selectTab(i ? 0 : 1, true); } });
  });

  /* ================= MISC ================= */
  let tt = 0;
  function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2800); }
  $('#reset').addEventListener('click', () => {
    if (!window.confirm('Replant the demo garden? Your current habits and history will be replaced.')) return;
    db = demo(); save(); renderGarden(); if (!$('#panel-stats').hidden) renderStats(); toast('Fresh demo garden planted.');
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'n' || e.key === 'N') && !e.target.closest('input,textarea,dialog') && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); openDialog(null); }
  });
  window.addEventListener('resize', () => { placeKnob(); hideTip(); });

  header();
  renderGarden();
  placeKnob();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeKnob);
})();
</script>
</body>
</html>
