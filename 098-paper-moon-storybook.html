<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pip and the Paper Moon — An Interactive Picture Book</title>
<meta name="description" content="Pip and the Paper Moon: an original eight-spread picture book about a little fox who wants to give the moon a gift. Watercolour-pastel illustrations, 3D page turns, read-along highlighting and hidden delights on every page.">
<meta name="theme-color" content="#1d3557">
<style>
:root{
  --peach:#ffcdb2;
  --pink:#e5989b;
  --mauve:#b5838d;
  --blue:#a8dadc;
  --night:#1d3557;
  --gold:#ffd166;
  --paper:#fdf6ee;
  --ink:#2b2d4a;
  --story:"Bookman Old Style","URW Bookman","Bookman","Cooper Std","Georgia",serif;
  --display:"Cooper Black","Cooper Std","Bookman Old Style","URW Bookman",Georgia,serif;
  --ui:"Avenir Next","Nunito","Segoe UI","Helvetica Neue","Nimbus Sans",Arial,sans-serif;
  --pw:500px;--ph:700px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 20%,#2c4870 0%,#1d3557 45%,#131f3a 100%);color:var(--ink);font-family:var(--story);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 50% 100%,rgba(229,152,155,.18),transparent 70%)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- stage & book ---------- */
.stage{position:fixed;left:0;right:0;top:0;bottom:84px;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.book{position:relative;width:calc(var(--pw) * 2);height:var(--ph);perspective:2600px;transition:transform .9s cubic-bezier(.45,.05,.2,1)}
.book.closed{transform:translateX(calc(var(--pw) * -.5))}
.book.single{width:var(--pw);perspective:1800px}
.board{position:absolute;left:-14px;right:-14px;top:-12px;bottom:-14px;border-radius:14px;
  background:linear-gradient(135deg,#29466e,#1d3557 50%,#172a47);box-shadow:0 30px 60px rgba(5,10,25,.55),0 6px 14px rgba(5,10,25,.35),inset 0 0 0 2px rgba(181,131,141,.35);
  transition:left .9s cubic-bezier(.45,.05,.2,1)}
.book.closed .board{left:calc(var(--pw) - 14px)}
.book.single .board{left:-10px;right:-10px}
.stack{position:absolute;top:0;bottom:0;left:-6px;right:-6px;border-radius:4px;pointer-events:none;
  box-shadow:-2px 2px 0 #efe4d6,-4px 4px 0 #e6d8c6,2px 2px 0 #efe4d6,4px 4px 0 #e2d2bf;background:#efe4d6;transition:left .9s cubic-bezier(.45,.05,.2,1)}
.book.closed .stack{left:var(--pw)}
.book.single .stack{left:0;right:-5px;box-shadow:2px 2px 0 #efe4d6,4px 4px 0 #e2d2bf}
.slot{position:absolute;top:0;width:var(--pw);height:var(--ph);z-index:1}
.slot.L{left:0}.slot.R{left:var(--pw)}
.book.single .slot.R{left:0}
.book.single .slot.L{display:none}
.cast{position:absolute;top:0;height:var(--ph);width:0;z-index:2;pointer-events:none;opacity:0}
#castR{left:var(--pw);background:linear-gradient(90deg,rgba(20,20,45,.42),rgba(20,20,45,0))}
#castL{right:var(--pw);background:linear-gradient(270deg,rgba(20,20,45,.38),rgba(20,20,45,0))}
.book.single #castR{left:0}
.book.single #castL{display:none}
.rig{position:absolute;top:0;left:var(--pw);height:var(--ph);z-index:3;transform-style:preserve-3d;transform-origin:0 50%;pointer-events:none}
.book.single .rig{left:0}
.seg{position:absolute;top:0;height:100%;transform-style:preserve-3d;transform-origin:0 50%}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face>.page{position:absolute;top:0}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0}
.face.front .shade{background:linear-gradient(90deg,rgba(25,20,45,.55),rgba(25,20,45,.18))}
.face.back .shade{background:linear-gradient(270deg,rgba(25,20,45,.55),rgba(25,20,45,.18))}
.gloss{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.55) 60%,rgba(255,255,255,0) 90%)}

/* ---------- pages ---------- */
.page{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);overflow:hidden;background:var(--paper)}
.page .art{position:absolute;inset:0;width:100%;height:100%;display:block}
.page.L::after,.page.R::after{content:"";position:absolute;top:0;bottom:0;width:14%;pointer-events:none}
.page.L::after{right:0;background:linear-gradient(90deg,rgba(30,25,50,0),rgba(30,25,50,.16) 70%,rgba(30,25,50,.34))}
.page.R::after{left:0;background:linear-gradient(270deg,rgba(30,25,50,0),rgba(30,25,50,.14) 70%,rgba(30,25,50,.3))}
.text{position:absolute;left:10%;right:9%;margin:0;font-size:calc(var(--pw) * .0425);line-height:1.52;letter-spacing:.005em}
.page.R .text{left:11%;right:8%}
.text.top{top:6.5%}.text.bottom{bottom:9%}
.text.light{color:#fff7e8;text-shadow:0 2px 14px rgba(8,16,36,.65),0 0 2px rgba(8,16,36,.4)}
.text.panel{padding:4.2% 5.2% 4.6%;color:var(--ink);background:rgba(255,249,240,.9);border-radius:32px 38px 30px 36px / 34px 28px 38px 30px;box-shadow:0 8px 22px rgba(29,53,87,.18)}
.w{border-radius:.3em;transition:background-color .25s ease,color .25s ease,box-shadow .25s ease}
.w.on{background:rgba(255,209,102,.75);box-shadow:0 0 0 .12em rgba(255,209,102,.75);color:var(--ink);text-shadow:none}
.text.light .w.read{color:#ffe2a8}
.text.panel .w.read{color:#6b5a7a}
.pno{position:absolute;bottom:2.6%;font-family:var(--ui);font-size:calc(var(--pw) * .024);letter-spacing:.2em;color:rgba(255,246,230,.8)}
.page.L .pno{left:7%}.page.R .pno{right:7%}
.pno.dark{color:rgba(43,45,74,.55)}

/* interactive bits inside the art */
.fox{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%}
.fox.hop{animation:hop .75s cubic-bezier(.3,.7,.35,1)}
@keyframes hop{0%{transform:none}14%{transform:scale(1.08,.88)}40%{transform:translateY(-34%) scale(.94,1.08) rotate(-4deg)}66%{transform:translateY(0) scale(1.1,.9)}82%{transform:scale(.97,1.04)}100%{transform:none}}
.fox .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.2s infinite}
@keyframes blink{0%,92%,100%{transform:none}95%{transform:scaleY(.1)}}
.star{cursor:pointer}
.star .sp{transform-box:fill-box;transform-origin:50% 50%;animation:glim 3.4s ease-in-out infinite}
@keyframes glim{0%,100%{opacity:1}50%{opacity:.45}}
.star.tw .sp{animation:tw .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes tw{0%{transform:none;opacity:1}35%{transform:scale(2.4) rotate(45deg);fill:#fff}100%{transform:none;opacity:1}}
.star .hit{fill:transparent}
.pond{cursor:pointer}
.ripple{fill:none;stroke:#eaf8f8;stroke-width:2.5;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:50% 50%;animation:ripple 1.7s ease-out forwards;pointer-events:none}
@keyframes ripple{from{transform:scale(.08);opacity:.95}to{transform:scale(1);opacity:0}}
.reflection{transform-box:fill-box;transform-origin:50% 50%}
.reflection.wob{animation:wob 1.6s ease-out}
@keyframes wob{0%{transform:none}15%{transform:scale(1.25,.7) skewX(8deg)}35%{transform:scale(.85,1.2) skewX(-6deg)}55%{transform:scale(1.1,.9) skewX(3deg)}75%{transform:scale(.97,1.04)}100%{transform:none}}
.lantern-glow{animation:flicker 2.6s ease-in-out infinite alternate}
@keyframes flicker{from{opacity:.75}to{opacity:1}}
.rise{animation:rise 7s ease-in-out infinite alternate}
@keyframes rise{from{transform:translateY(8px)}to{transform:translateY(-10px)}}

/* ---------- cover ---------- */
.cover-title{position:absolute;left:6%;right:6%;top:6%;margin:0;text-align:center;font-family:var(--display);font-weight:700;line-height:.98;font-size:calc(var(--pw) * .118);letter-spacing:.01em;
  background:linear-gradient(100deg,#ffd166 0%,#ffd166 38%,#fff8e1 48%,#ffd166 58%,#ffc15e 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(10,20,40,.45)) drop-shadow(0 0 18px rgba(255,209,102,.35));animation:shimmer 4.5s ease-in-out infinite}
.cover-title small{display:block;font-size:.42em;letter-spacing:.06em;margin:.2em 0 .12em}
@keyframes shimmer{0%{background-position:100% 0}60%,100%{background-position:0 0}}
.cover-sub{position:absolute;left:10%;right:10%;bottom:5.5%;margin:0;text-align:center;font-family:var(--story);font-style:italic;font-size:calc(var(--pw) * .036);color:#ffe9c9;text-shadow:0 2px 10px rgba(8,16,36,.8)}
.spark{position:absolute;width:calc(var(--pw) * .05);aspect-ratio:1;pointer-events:none;animation:spark 2.4s ease-in-out infinite}
.spark svg{width:100%;height:100%;display:block}
@keyframes spark{0%,100%{transform:scale(0) rotate(0);opacity:0}45%{transform:scale(1) rotate(90deg);opacity:1}70%{transform:scale(.5) rotate(140deg);opacity:.6}}
.endcard{position:absolute;left:12%;right:12%;top:50%;transform:translateY(-50%);text-align:center;color:var(--ink)}
.endcard h2{margin:0 0 .3em;font-family:var(--display);font-weight:700;font-size:calc(var(--pw) * .1);color:var(--night)}
.endcard p{margin:0 0 1.2em;font-size:calc(var(--pw) * .036);line-height:1.5;color:#5b4d6b}
.again{appearance:none;border:0;cursor:pointer;padding:.7em 1.4em;border-radius:999px;font-family:var(--ui);font-weight:700;font-size:calc(var(--pw) * .034);letter-spacing:.04em;color:var(--night);background:var(--gold);box-shadow:0 6px 0 #e0a93a,0 12px 20px rgba(29,53,87,.2);transition:transform .15s ease,box-shadow .15s ease}
.again:hover{transform:translateY(-2px)}
.again:active{transform:translateY(4px);box-shadow:0 2px 0 #e0a93a}
.again:focus-visible{outline:3px dashed var(--night);outline-offset:4px}
.the-end{position:absolute;left:0;right:0;top:9%;margin:0;text-align:center;font-family:var(--display);font-weight:700;font-size:calc(var(--pw) * .13);color:#ffe7a8;text-shadow:0 3px 0 rgba(8,16,36,.5),0 0 24px rgba(255,209,102,.35)}

/* ---------- single page (phones) ---------- */
.page.m .art{position:relative;height:auto;inset:auto}
.page.m .mtext{position:relative;margin:0;padding:5.5% 8% 0;font-size:min(calc(var(--pw) * .053),calc(var(--ph) * .029));line-height:1.5}
.page.m .pno{right:8%;color:rgba(43,45,74,.5)}
.page.m.coverm .art{position:absolute;inset:0;height:100%}
.page.blank{background:linear-gradient(90deg,#efe5d8,#fbf4ea)}

/* ---------- corners ---------- */
.corner{position:absolute;bottom:0;z-index:5;width:18%;max-width:120px;aspect-ratio:1;padding:0;border:0;background:transparent;cursor:pointer}
.corner.next{right:0}.corner.prev{left:0}
.book.single .corner.prev{left:0}
.corner span{position:absolute;bottom:0;width:0;height:0;transition:width .3s cubic-bezier(.3,1.4,.5,1),height .3s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(-3px -3px 5px rgba(20,15,40,.28))}
.corner.next span{right:0;background:linear-gradient(135deg,#fffaf2 0%,#efe2d1 46%,#cdbba6 50%,rgba(0,0,0,0) 50.5%)}
.corner.prev span{left:0;background:linear-gradient(225deg,#fffaf2 0%,#efe2d1 46%,#cdbba6 50%,rgba(0,0,0,0) 50.5%)}
.corner:hover span,.corner:focus-visible span{width:46%;height:46%}
.corner:focus-visible{outline:3px dashed var(--gold);outline-offset:-6px;border-radius:10px}
.corner[hidden]{display:none}
.book.turning .corner{pointer-events:none}

/* ---------- control bar ---------- */
.bar{position:fixed;left:50%;bottom:16px;z-index:10;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:999px;
  background:rgba(253,246,238,.94);box-shadow:0 10px 30px rgba(5,10,25,.35);font-family:var(--ui)}
.bar button{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;min-width:44px;padding:0 14px;border:0;border-radius:999px;cursor:pointer;
  font-family:var(--ui);font-size:15px;font-weight:600;color:var(--night);background:transparent;transition:background-color .2s ease,transform .15s ease}
.bar button:hover{background:rgba(181,131,141,.18)}
.bar button:active{transform:scale(.95)}
.bar button:focus-visible{outline:3px solid var(--mauve);outline-offset:1px}
.bar button:disabled{opacity:.35;cursor:default}
.bar button[aria-pressed="true"]{background:var(--gold)}
.bar svg{width:20px;height:20px}
.dots{display:flex;gap:7px;padding:0 6px}
.dots i{display:block;width:9px;height:9px;border-radius:50%;background:rgba(29,53,87,.2);transition:background-color .3s,transform .3s}
.dots i.on{background:var(--pink);transform:scale(1.35)}
.sep{width:1px;height:26px;background:rgba(29,53,87,.15)}
#flies{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}

@media (max-width:640px){
  .stage{bottom:74px}
  .bar{bottom:10px;gap:2px;padding:6px}
  .bar button{height:42px;min-width:42px;padding:0 10px;font-size:14px}
  .bar .lbl{display:none}
  .dots{gap:5px;padding:0 2px}
  .dots i{width:7px;height:7px}
  .sep{display:none}
}
@media (prefers-reduced-motion:reduce){
  .cover-title,.spark,.star .sp,.lantern-glow,.rise,.fox .eye{animation:none}
  .book,.board,.stack{transition-duration:.01s}
}
</style>
</head>
<body>
<h1 class="sr-only">Pip and the Paper Moon — an interactive picture book</h1>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3557"/><stop offset=".42" stop-color="#46507f"/><stop offset=".68" stop-color="#9d7a98"/><stop offset=".84" stop-color="#e5989b"/><stop offset="1" stop-color="#ffcdb2"/></linearGradient>
    <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101c36"/><stop offset=".5" stop-color="#1d3557"/><stop offset="1" stop-color="#3c4f7e"/></linearGradient>
    <linearGradient id="gTwilight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34466f"/><stop offset=".45" stop-color="#7b6c93"/><stop offset=".78" stop-color="#e5989b"/><stop offset="1" stop-color="#ffcdb2"/></linearGradient>
    <linearGradient id="gWarm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4674"/><stop offset=".4" stop-color="#9b7593"/><stop offset=".75" stop-color="#f0a99b"/><stop offset="1" stop-color="#ffd7b8"/></linearGradient>
    <radialGradient id="gMoonGlow"><stop offset="0" stop-color="#fff4d0" stop-opacity=".8"/><stop offset=".32" stop-color="#ffe7a6" stop-opacity=".26"/><stop offset="1" stop-color="#ffe7a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gMoon" cx=".4" cy=".36" r=".7"><stop offset="0" stop-color="#fffdf4"/><stop offset=".65" stop-color="#fff0c4"/><stop offset="1" stop-color="#f3d99a"/></radialGradient>
    <radialGradient id="gLantern" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fff6d2"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#f2a15f"/></radialGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#ffd166" stop-opacity=".7"/><stop offset=".4" stop-color="#ffc062" stop-opacity=".25"/><stop offset="1" stop-color="#ffc062" stop-opacity="0"/></radialGradient>
    <linearGradient id="gFox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fab58a"/><stop offset="1" stop-color="#e9865c"/></linearGradient>
    <linearGradient id="gHillA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b5838d"/><stop offset="1" stop-color="#7a5f7c"/></linearGradient>
    <linearGradient id="gHillB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5989b"/><stop offset="1" stop-color="#b5838d"/></linearGradient>
    <linearGradient id="gHillN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46598a"/><stop offset="1" stop-color="#22325a"/></linearGradient>
    <linearGradient id="gHillD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c4f78"/><stop offset="1" stop-color="#2e2c4f"/></linearGradient>
    <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8dadc"/><stop offset=".45" stop-color="#6d93b6"/><stop offset="1" stop-color="#2b4670"/></linearGradient>
    <linearGradient id="gSage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc4bf"/><stop offset="1" stop-color="#5e8d8f"/></linearGradient>
    <linearGradient id="gBark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6a7e"/><stop offset=".5" stop-color="#a88396"/><stop offset="1" stop-color="#6e5470"/></linearGradient>
    <linearGradient id="gPaperEnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5ea"/><stop offset="1" stop-color="#fbe3d4"/></linearGradient>
    <filter id="fWC" x="-4%" y="-4%" width="108%" height="108%"><feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="fGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="11" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .3  0 0 0 -.9 .55"/></filter>
    <filter id="fBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
</svg>

<main class="stage" id="stage">
  <div class="book closed" id="book">
    <div class="board" aria-hidden="true"></div>
    <div class="stack" aria-hidden="true"></div>
    <section class="slot L" id="slotL" aria-label="Left page"></section>
    <section class="slot R" id="slotR" aria-label="Right page"></section>
    <div class="cast" id="castR" aria-hidden="true"></div>
    <div class="cast" id="castL" aria-hidden="true"></div>
    <button type="button" class="corner prev" id="cornerPrev" aria-label="Turn back a page"><span></span></button>
    <button type="button" class="corner next" id="cornerNext" aria-label="Turn the page"><span></span></button>
  </div>
</main>

<nav class="bar" aria-label="Book controls">
  <button type="button" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <button type="button" id="next" aria-label="Next page"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="read" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5.5C7 4.5 9.5 5 12 6.5c2.5-1.5 5-2 8-1v13c-3-1-5.5-.5-8 1-2.5-1.5-5-2-8-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 6.5v13" stroke="currentColor" stroke-width="2"/></svg><span class="lbl">Read along</span></button>
  <button type="button" id="sound" aria-pressed="true" aria-label="Sound on"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a5 5 0 0 0-5 5v4l-2 3h14l-2-3V8a5 5 0 0 0-5-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 18a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2"/><path id="soundX" d="M4 4l16 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0"/></svg></button>
</nav>
<canvas id="flies" aria-hidden="true"></canvas>
<p class="sr-only" id="live" aria-live="polite"></p>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = reduceMQ.matches;
reduceMQ.addEventListener && reduceMQ.addEventListener('change', e => { reduce = e.matches; });
const clamp = (v,a,b) => v<a?a:v>b?b:v;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const r1 = n => Math.round(n*10)/10;

/* ================= the story ================= */

  {focus:1130, side:'L', pos:'top', style:'light', text:'At the edge of Hazelhollow Wood, where the ferns curl up like sleepy fists, lived a small fox called Pip. Every evening Pip sat on the same mossy stump and watched the moon climb up out of the trees.'},

/* ================= little painting kit ================= */
const OUT = 'stroke="#4b3656" stroke-opacity=".28" stroke-width="3" stroke-linejoin="round"';
function sparkle(x,y,s){ const k=s*.2; return `M${r1(x)} ${r1(y-s)}C${r1(x+k)} ${r1(y-k)} ${r1(x+k)} ${r1(y-k)} ${r1(x+s)} ${r1(y)}C${r1(x+k)} ${r1(y+k)} ${r1(x+k)} ${r1(y+k)} ${r1(x)} ${r1(y+s)}C${r1(x-k)} ${r1(y+k)} ${r1(x-k)} ${r1(y+k)} ${r1(x-s)} ${r1(y)}C${r1(x-k)} ${r1(y-k)} ${r1(x-k)} ${r1(y-k)} ${r1(x)} ${r1(y-s)}Z`; }
function stars(seed, n, x0, x1, y0, y1, sMin, sMax, ex){
  const R = mulberry32(seed); let h = '';
  for (let i = 0; i < n; i++){
    const x = x0 + R()*(x1-x0), y = y0 + Math.pow(R(),1.3)*(y1-y0), s = sMin + R()*(sMax-sMin);
    if (ex && x > ex[0] && x < ex[2] && y > ex[1] && y < ex[3]) continue;
    if (R() < .45) { h += `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(s*.22)}" fill="#fff4d6" opacity="${(.5+R()*.5).toFixed(2)}"/>`; continue; }
    h += `<g class="star"><circle class="hit" cx="${r1(x)}" cy="${r1(y)}" r="${r1(s*2.2)}"/><path class="sp" style="animation-delay:-${(R()*3.4).toFixed(2)}s" d="${sparkle(x,y,s)}" fill="#ffe9a8"/></g>`;
  }
  return h;
}
function moon(x,y,r,warm){
  return `<circle cx="${x}" cy="${y}" r="${r*(warm?3:2.6)}" fill="url(#gMoonGlow)"/>${warm?`<circle cx="${x}" cy="${y}" r="${r*2}" fill="url(#gGlow)" opacity=".7"/>`:''}
  <circle cx="${x}" cy="${y}" r="${r}" fill="url(#gMoon)"/>
  <g fill="#e8cd92" opacity=".45"><circle cx="${x-r*.32}" cy="${y-r*.18}" r="${r*.2}"/><circle cx="${x+r*.28}" cy="${y+r*.3}" r="${r*.14}"/><circle cx="${x+r*.12}" cy="${y-r*.42}" r="${r*.09}"/><circle cx="${x-r*.1}" cy="${y+r*.46}" r="${r*.07}"/></g>`;
}
function pine(x,y,h,fill){
  let d = '';
  for (let k = 0; k < 3; k++){
    const tt = y - h + k*h*.24, tb = tt + h*.44, hw = h*(.15 + k*.1);
    d += `M${r1(x)} ${r1(tt)}Q${r1(x+hw*.45)} ${r1(tt+(tb-tt)*.55)} ${r1(x+hw)} ${r1(tb)}Q${r1(x)} ${r1(tb-h*.06)} ${r1(x-hw)} ${r1(tb)}Q${r1(x-hw*.45)} ${r1(tt+(tb-tt)*.55)} ${r1(x)} ${r1(tt)}Z`;
  }
  d += `M${r1(x-h*.03)} ${r1(y-h*.12)}h${r1(h*.06)}V${r1(y)}h${r1(-h*.06)}Z`;
  return `<path d="${d}" fill="${fill}"/>`;
}
function roundTree(x,y,h,fill,trunk){
  return `<path d="M${r1(x-h*.04)} ${r1(y)}L${r1(x-h*.025)} ${r1(y-h*.5)}L${r1(x+h*.025)} ${r1(y-h*.5)}L${r1(x+h*.04)} ${r1(y)}Z" fill="${trunk||'#6e5470'}"/>
  <g fill="${fill}"><circle cx="${r1(x)}" cy="${r1(y-h*.68)}" r="${r1(h*.3)}"/><circle cx="${r1(x-h*.2)}" cy="${r1(y-h*.52)}" r="${r1(h*.22)}"/><circle cx="${r1(x+h*.21)}" cy="${r1(y-h*.5)}" r="${r1(h*.2)}"/></g>`;
}
function hillPath(pts, bottom){
  bottom += 60;   // run past the page edge so the watercolour wobble never lifts the hem
  let d = `M${pts[0][0]} ${bottom}L${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++){ const [x0,y0] = pts[i-1], [x1,y1] = pts[i]; const mx = (x0+x1)/2; d += `C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}`; }
  return d + `L${pts[pts.length-1][0]} ${bottom}Z`;
}
function fern(x,y,s,flip){
  const f = flip ? -1 : 1;
  return `<g transform="translate(${x} ${y}) scale(${f*s} ${s})" fill="none" stroke="url(#gSage)" stroke-width="7" stroke-linecap="round">
    <path d="M0 0C2 -60 10 -120 40 -150C62 -170 84 -160 84 -140C84 -122 66 -116 58 -128C52 -138 62 -146 68 -140"/>
    <path d="M30 0C28 -40 20 -80 -6 -104C-24 -120 -44 -112 -42 -96C-40 -84 -26 -84 -24 -94"/>
    <path d="M6 -70l-22 -14M8 -96l-20 -18M20 -126l-14 -22M14 -60l24 -10M18 -90l24 -8" stroke-width="5"/></g>`;
}
function grass(x,y,s,col){ return `<path d="M${x} ${y}q${-4*s} ${-26*s} ${-14*s} ${-40*s}M${x+6*s} ${y}q${2*s} ${-30*s} ${6*s} ${-48*s}M${x+12*s} ${y}q${8*s} ${-22*s} ${20*s} ${-34*s}" fill="none" stroke="${col}" stroke-width="${r1(4*s)}" stroke-linecap="round"/>`; }
function cloud(x,y,s,fill,op){ return `<g fill="${fill}" opacity="${op||.8}"><ellipse cx="${x}" cy="${y}" rx="${130*s}" ry="${34*s}"/><circle cx="${x-50*s}" cy="${y-20*s}" r="${42*s}"/><circle cx="${x+20*s}" cy="${y-34*s}" r="${56*s}"/><circle cx="${x+78*s}" cy="${y-12*s}" r="${36*s}"/></g>`; }
function lantern(x,y,s,paper){
  return `<g transform="translate(${x} ${y}) scale(${s})"><circle r="95" fill="url(#gGlow)" class="lantern-glow"/>
    <path d="M-30 -40C-44 -20 -44 22 -30 40H30C44 22 44 -20 30 -40Z" fill="url(#gLantern)" stroke="#c8784c" stroke-opacity=".5" stroke-width="3"/>
    <path d="M-12 -40C-18 -16 -18 16 -12 40M12 -40C18 -16 18 16 12 40" fill="none" stroke="#e39a5a" stroke-opacity=".6" stroke-width="3"/>
    <rect x="-22" y="-50" width="44" height="12" rx="4" fill="#b5838d"/><rect x="-22" y="38" width="44" height="10" rx="4" fill="#b5838d"/>${paper||''}</g>`;
}
function paperMoon(x,y,s){
  return `<g transform="translate(${x} ${y}) scale(${s})"><circle r="150" fill="url(#gGlow)" class="lantern-glow"/><circle r="62" fill="url(#gLantern)" stroke="#d98b52" stroke-opacity=".55" stroke-width="3"/>
    <path d="M-62 0C-40 -8 40 -8 62 0M-56 -26C-30 -32 30 -32 56 -26M-56 26C-30 20 30 20 56 26M0 -62C-12 -30 -12 30 0 62" fill="none" stroke="#e39a5a" stroke-opacity=".55" stroke-width="3"/>
    <path d="M14 -30a26 26 0 1 0 0 52 20 20 0 1 1 0-52z" fill="#fff8e1" opacity=".9"/><path d="M-26 -8l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#fff8e1" opacity=".9"/></g>`;
}

    <ellipse cx="-4" cy="2" rx="70" ry="9" fill="#1d2440" opacity=".22"/>

const book = $('book'), slotL = $('slotL'), slotR = $('slotR'), castR = $('castR'), castL = $('castL');

  const W = innerWidth, H = innerHeight;
  const barH = W <= 640 ? 74 : 84;
  mode = (W >= 820 && W > H*1.05) ? 'two' : 'one';
  if (mode === 'two'){
    const aw = W - 80, ah = H - barH - 40;
    ph = Math.min(ah, aw/2*1.4); pw = ph/1.4;
  } else {
    const aw = W - 28, ah = H - barH - 26;
    ph = ah; pw = Math.min(aw, ph*.74);
    if (pw < aw && ph > pw*1.62) ph = pw*1.62;
  }
  pw = Math.floor(pw); ph = Math.floor(ph);
  book.style.setProperty('--pw', pw+'px'); book.style.setProperty('--ph', ph+'px');
  book.classList.toggle('single', mode === 'one');
}

    const w = pw*f, b = a + w;
    const seg = k === 0 ? rig : document.createElement('div');
    if (k > 0){ seg.className = 'seg'; seg.style.left = (pw*widths[k-1]) + 'px'; }
    seg.style.width = w + 'px';
    const ff = document.createElement('div'); ff.className = 'face front';
    const fc = front.cloneNode(true); fc.style.left = (-a) + 'px'; ff.appendChild(fc);
    const fs = document.createElement('div'); fs.className = 'shade'; ff.appendChild(fs);
    const fg = document.createElement('div'); fg.className = 'gloss'; ff.appendChild(fg);
    const fb = document.createElement('div'); fb.className = 'face back';
    const bc = back.cloneNode(true); bc.style.left = (-(pw - b)) + 'px'; fb.appendChild(bc);
    const bs = document.createElement('div'); bs.className = 'shade'; fb.appendChild(bs);
    seg.appendChild(ff); seg.appendChild(fb);
    if (k > 0) parent.appendChild(seg);
    segs.push({seg, fs, bs, fg});
    parent = seg; a = b;
  });
  return {rig, segs};
}
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
function animateRig(R, from, to, dir, dur, done){
  book.appendChild(R.rig);
  const t0 = performance.now();
  const step = now => {
    const p = clamp((now - t0)/dur, 0, 1), e = ease(p);
    const th = from + (to - from)*e, curl = Math.sin(e*Math.PI)*(reduce ? .2 : 1);
    const lead = (to < from) ? -1 : 1;
    const angs = [th, lead*28*curl, lead*24*curl];
    let acc = 0;
    R.segs.forEach((s, k) => {
      acc += angs[k];
      s.seg.style.transform = `rotateY(${angs[k].toFixed(2)}deg)`;
      const c = Math.cos(acc*Math.PI/180);
      s.fs.style.opacity = clamp((1 - c)*.62 + k*.05*curl, 0, .9).toFixed(3);
      s.bs.style.opacity = clamp((1 + c)*.62 + k*.05*curl, 0, .9).toFixed(3);
      s.fg.style.opacity = (k > 0 ? curl*.35 : curl*.12).toFixed(3);
    });
    // shadows cast on the pages beneath
    const c0 = Math.cos(th*Math.PI/180);
    if (c0 > 0){ castR.style.width = (pw*c0 + 30) + 'px'; castR.style.opacity = (curl*.9).toFixed(3); castL.style.opacity = '0'; }
    else { castL.style.width = (pw*-c0 + 30) + 'px'; castL.style.opacity = (curl*.9).toFixed(3); castR.style.opacity = '0'; }
    if (p < 1) requestAnimationFrame(step);
    else { R.rig.remove(); castR.style.opacity = castL.style.opacity = '0'; done(); }
  };
  requestAnimationFrame(step);
}
function turn(dir){
  if (turning) return false;
  const nxt = cur + dir;
  if (nxt < 0 || nxt >= TOTAL) return false;
  turning = true; book.classList.add('turning');
  Sound.swish();
  const dur = reduce ? 260 : (mode === 'two' ? 1050 : 850);
  const finish = () => { cur = nxt; turning = false; book.classList.remove('turning'); render(); announce(); if (reading){ wordIdx = 0; clearTimeout(readT); readT = setTimeout(readStep, 650); } };
  if (mode === 'two'){
    if (dir > 0){
      const R = buildRig(makePage(cur,'R'), makePage(nxt,'L') || blankPage());
      fill(slotR, makePage(nxt,'R'));
      if (cur === 0) book.classList.remove('closed');
      animateRig(R, 0, -180, dir, dur, finish);
    } else {
      const R = buildRig(makePage(nxt,'R'), makePage(cur,'L') || blankPage());
      fill(slotL, makePage(nxt,'L'));
      if (nxt === 0) book.classList.add('closed');
      animateRig(R, -180, 0, dir, dur, finish);
    }
  } else {
    if (dir > 0){
      const R = buildRig(makeMobilePage(cur), blankPage());
      fill(slotR, makeMobilePage(nxt));
      animateRig(R, 0, -180, dir, dur, finish);
    } else {
      const R = buildRig(makeMobilePage(nxt), blankPage());
      animateRig(R, -180, 0, dir, dur, finish);
    }
  }
  return true;
}
const live = $('live');
function announce(){
  live.textContent = cur === 0 ? 'Cover: Pip and the Paper Moon.' : cur === 9 ? 'The End.' : `Spread ${cur} of 8. ${STORY[cur-1].text}`;
}

/* ================= sound: bells, page swishes, a hop ================= */
const Sound = (() => {
  let ac = null, master = null, on = true, noise = null;
  try { on = localStorage.getItem('pip-sound') !== '0'; } catch(e){}
  function init(){
    if (ac){ if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = on ? .5 : 0; master.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate*.6, ac.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
    } catch(e){ ac = null; }
  }
  const PENTA = [0,2,4,7,9,12,14,16];
  function bell(semi, vol){
    if (!ac || !on) return;
    const f = 523.25*Math.pow(2, semi/12), t = ac.currentTime;
    [[1,1],[2.76,.35],[5.4,.12]].forEach(([m,v]) => {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f*m;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime((vol||.22)*v, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6/m + .3);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 2);
    });
  }
  return {
    init,
    get on(){ return on; },
    set(v){ on = v; if (master) master.gain.setTargetAtTime(v ? .5 : 0, ac.currentTime, .03); try { localStorage.setItem('pip-sound', v ? '1' : '0'); } catch(e){} },
    chime(){ bell(PENTA[Math.floor(Math.random()*PENTA.length)]); },
    swish(){
      if (!ac || !on || !noise) return;
      const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noise; f.type = 'bandpass'; f.Q.value = .8; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(3200, t+.35);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.16, t+.08); g.gain.exponentialRampToValueAtTime(.0001, t+.5);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+.55);
    },
    hop(){
      if (!ac || !on) return;
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(760, t+.14); o.frequency.exponentialRampToValueAtTime(420, t+.3);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+.34);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+.36);
    },
    plink(){ bell(-5, .14); setTimeout(() => bell(2, .08), 90); }
  };
})();
function syncSound(){ const on = Sound.on; $('sound').setAttribute('aria-pressed', String(on)); $('sound').setAttribute('aria-label', on ? 'Sound on' : 'Sound off'); $('soundX').setAttribute('opacity', on ? '0' : '1'); }
syncSound();
$('sound').addEventListener('click', () => { Sound.init(); Sound.set(!Sound.on); syncSound(); if (Sound.on) Sound.chime(); });

/* ================= read along ================= */
let reading = false, readT = 0, wordIdx = 0;
function liveWords(){ return Array.from(book.querySelectorAll('.slot .w')); }
function readStep(){
  if (!reading) return;
  if (turning){ readT = setTimeout(readStep, 200); return; }
  const ws = liveWords();
  if (!ws.length){
    if (cur < TOTAL-1){ readT = setTimeout(() => turn(1), cur === 0 ? 1400 : 900); }
    else stopReading();
    return;
  }
  if (wordIdx < ws.length){
    ws.forEach((w,k) => { w.classList.toggle('on', k === wordIdx); w.classList.toggle('read', k < wordIdx); });
    const t = ws[wordIdx].textContent;
    let d = 300 + t.length*28;
    if (/[,;:]["”’]?$/.test(t)) d += 260;
    if (/[.!?]["”’]?$/.test(t)) d += 520;
    wordIdx++;
    readT = setTimeout(readStep, d);
  } else {
    ws.forEach(w => { w.classList.remove('on'); w.classList.add('read'); });
    readT = setTimeout(() => { if (reading && !turn(1)) stopReading(); }, 1500);
  }
}
function startReading(){ Sound.init(); reading = true; wordIdx = 0; $('read').setAttribute('aria-pressed','true'); live.textContent = 'Read along is on.'; clearTimeout(readT); readT = setTimeout(readStep, 300); }
function stopReading(){ reading = false; clearTimeout(readT); $('read').setAttribute('aria-pressed','false'); liveWords().forEach(w => w.classList.remove('on','read')); }
$('read').addEventListener('click', () => reading ? stopReading() : startReading());

/* ================= navigation ================= */
function userTurn(dir){ Sound.init(); if (reading){ wordIdx = 0; } turn(dir); }
$('next').addEventListener('click', () => userTurn(1));
$('prev').addEventListener('click', () => userTurn(-1));
$('cornerNext').addEventListener('click', () => userTurn(1));
$('cornerPrev').addEventListener('click', () => userTurn(-1));
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); userTurn(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); userTurn(-1); }
  else if ((e.key === 'r' || e.key === 'R') && !e.target.closest('button')){ reading ? stopReading() : startReading(); }
  else if (e.key === 'm' || e.key === 'M'){ Sound.init(); Sound.set(!Sound.on); syncSound(); }
});
// swipe
let sw = null;
book.addEventListener('pointerdown', e => { Sound.init(); sw = {x:e.clientX, y:e.clientY, t:performance.now()}; });
window.addEventListener('pointerup', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y, dt = performance.now() - sw.t; sw = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.3 && dt < 900){ userTurn(dx < 0 ? 1 : -1); swiped = performance.now(); }
});
let swiped = 0;

/* ================= little delights ================= */
book.addEventListener('click', e => {
  if (performance.now() - swiped < 300) return;
  const again = e.target.closest('[data-again]');
  if (again){ stopReading(); jumpTo(0); return; }
  const fx = e.target.closest('.fox');
  if (fx){ Sound.init(); fx.classList.remove('hop'); void fx.getBoundingClientRect(); fx.classList.add('hop'); Sound.hop(); return; }
  const st = e.target.closest('.star');
  if (st){ Sound.init(); st.classList.remove('tw'); void st.getBoundingClientRect(); st.classList.add('tw'); Sound.chime(); burst(e.clientX, e.clientY); return; }
  const pond = e.target.closest('.pond');
  if (pond){ Sound.init(); ripple(pond, e); Sound.plink(); return; }
});
function ripple(pond, e){
  const svg = pond.ownerSVGElement; const m = pond.getScreenCTM(); if (!m) return;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(m.inverse());
  const host = pond.querySelector('.ripples');
  for (let k = 0; k < 3; k++){
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
    el.setAttribute('class','ripple'); el.setAttribute('cx', p.x.toFixed(1)); el.setAttribute('cy', p.y.toFixed(1)); el.setAttribute('rx', 170 - k*30); el.setAttribute('ry', 42 - k*8);
    el.style.animationDelay = (k*.22) + 's'; host.appendChild(el); setTimeout(() => el.remove(), 2400);
  }
  const refl = pond.querySelector('.reflection'); if (refl){ refl.classList.remove('wob'); void refl.getBoundingClientRect(); refl.classList.add('wob'); }
}
function jumpTo(k){ cur = k; render(); announce(); }
book.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-again]')){ e.preventDefault(); stopReading(); jumpTo(0); }
});

/* ================= fireflies that follow your finger ================= */
const cv = $('flies'), ctx = cv.getContext('2d');
let dpr = 1, VW = 0, VH = 0;
const flies = [], sparks2 = [];
let ptr = {x:0, y:0, t:-1e9};
function sizeCanvas(){ dpr = Math.min(2, window.devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = Math.round(VW*dpr); cv.height = Math.round(VH*dpr); }
for (let i = 0; i < 16; i++) flies.push({x:Math.random()*innerWidth, y:Math.random()*innerHeight, vx:0, vy:0, a:Math.random()*6.28, r:30 + Math.random()*90, sp:.4 + Math.random()*.9, ph:Math.random()*6.28});
const sprite = document.createElement('canvas'); sprite.width = sprite.height = 64;
(() => { const g = sprite.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,248,210,1)'); gr.addColorStop(.18,'rgba(255,214,110,.9)'); gr.addColorStop(.45,'rgba(255,190,90,.25)'); gr.addColorStop(1,'rgba(255,190,90,0)'); g.fillStyle = gr; g.fillRect(0,0,64,64); })();
window.addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.t = performance.now(); });
window.addEventListener('pointerdown', e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.t = performance.now(); });
function burst(x, y){ for (let i = 0; i < 14; i++){ const a = Math.random()*6.28, s = 60 + Math.random()*160; sparks2.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, rot:Math.random()*6}); } }
let last = performance.now(), raf = 0, clock = 0;
function frame(now){
  raf = requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last)/1000); last = now; clock += dt;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,VW,VH);
  const active = now - ptr.t < 3500;
  const bx = book.getBoundingClientRect();
  ctx.globalCompositeOperation = 'lighter';
  flies.forEach((f, k) => {
    f.a += dt*f.sp*(reduce ? .3 : 1);
    let tx, ty;
    if (active){ tx = ptr.x + Math.cos(f.a + k)*f.r*.6; ty = ptr.y + Math.sin(f.a*1.3 + k)*f.r*.45; }
    else { tx = bx.left + bx.width*(.5 + .48*Math.sin(f.a*.5 + f.ph)); ty = bx.top + bx.height*(.5 + .45*Math.sin(f.a*.37 + f.ph*2)); }
    const k1 = active ? 3.2 : 1.1;
    f.vx += ((tx - f.x)*k1 - f.vx*2.2)*dt; f.vy += ((ty - f.y)*k1 - f.vy*2.2)*dt;
    f.x += f.vx*dt; f.y += f.vy*dt;
    const b = .55 + .45*Math.sin(clock*2.3 + f.ph*3), s = 10 + b*10;
    ctx.globalAlpha = .35 + b*.6; ctx.drawImage(sprite, f.x - s, f.y - s, s*2, s*2);
  });
  for (let i = sparks2.length - 1; i >= 0; i--){
    const p = sparks2[i]; p.life -= dt*1.4; if (p.life <= 0){ sparks2.splice(i,1); continue; }
    p.vx *= .94; p.vy = p.vy*.94 + 30*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += dt*4;
    const s = 7*p.life + 2; ctx.globalAlpha = p.life; ctx.fillStyle = '#ffe7a0';
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.beginPath(); ctx.moveTo(0,-s); ctx.quadraticCurveTo(0,0,s,0); ctx.quadraticCurveTo(0,0,0,s); ctx.quadraticCurveTo(0,0,-s,0); ctx.quadraticCurveTo(0,0,0,-s); ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function start(){ if (!raf){ last = performance.now(); raf = requestAnimationFrame(frame); } }
function stop(){ cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => { if (document.hidden){ stop(); if (reading){ clearTimeout(readT); } } else { start(); if (reading) readT = setTimeout(readStep, 400); } });

/* ================= boot ================= */
let rT = 0;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { const was = mode; measure(); sizeCanvas(); if (!turning) render(); else if (was !== mode) render(); }, 120); });
measure(); sizeCanvas(); render(); announce(); start();
})();
</script>
