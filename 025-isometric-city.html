<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Metropolis</title>
<meta name="description" content="A tiny isometric city-builder toy in soft pastels. Place houses, towers, trees, parks, roads and water; watch little cars drive and the town light up at night.">
<meta name="theme-color" content="#bfe3f2">
<style>
  :root {
    --grass: #a8d5a2;
    --water: #7ec8e3;
    --road: #d6d0c4;
    --peach: #ffb5a7;
    --blush: #fcd5ce;
    --mint: #b8e0d2;
    --lav: #cdb4db;
    --ink: #4a4063;
    --ink-2: #6f6689;
    --ink-3: #9a93ad;
    --cream: #fffaf3;
    --cream-2: #fbf1e6;
    --line: rgba(74, 64, 99, .12);
    --shadow: 0 10px 28px -12px rgba(74, 64, 99, .45), 0 2px 0 rgba(255, 255, 255, .7) inset;
    --round: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Quicksand", "Arial Rounded MT Bold", "M PLUS Rounded 1c", "URW Gothic", "Century Gothic", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #bfe3f2;
    color: var(--ink);
    font-family: var(--round);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #world {
    position: fixed;
    inset: 0;
    touch-action: none;
    outline: none;
    cursor: pointer;
  }
  #world.panning { cursor: grabbing; }
  #world canvas { width: 100%; height: 100%; display: block; }
  #world:focus-visible { box-shadow: inset 0 0 0 3px rgba(74, 64, 99, .35); }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed;
    z-index: 3;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .title-card {
    top: 18px;
    left: 18px;
    background: var(--cream);
    border-radius: 22px;
    padding: 14px 18px 12px;
    box-shadow: var(--shadow);
    min-width: 238px;
  }
  .title-card h1 {
    margin: 0;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1.05;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .title-card h1 svg { width: 30px; height: 30px; flex: none; }
  .title-card .tag {
    margin: 4px 0 10px 39px;
    font-size: 12.5px;
    color: var(--ink-2);
    letter-spacing: .01em;
  }
  .clock {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 10px;
    border-top: 1.5px dashed var(--line);
  }
  .dial {
    width: 30px;
    height: 30px;
    flex: none;
  }
  .clock-read {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 15px;
    min-width: 5.6em;
  }
  .clock-read small { display: block; font-weight: 600; font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
  .chip {
    appearance: none;
    border: 0;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    background: var(--cream-2);
    border-radius: 999px;
    height: 30px;
    min-width: 30px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), background .2s ease;
  }
  .chip:hover { background: #f6e6d6; transform: translateY(-1px); }
  .chip:active { transform: translateY(1px) scale(.96); }
  .chip svg { width: 14px; height: 14px; }
  .chip[aria-pressed="true"] { background: var(--lav); }

  .stats {
    top: 18px;
    right: 18px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .bubble {
    position: relative;
    background: var(--cream);
    border-radius: 22px;
    padding: 12px 16px 12px 14px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 14px;
    transform-origin: 15% 100%;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 30px;
    bottom: -9px;
    width: 18px;
    height: 18px;
    background: var(--cream);
    border-radius: 0 0 6px 0;
    transform: rotate(45deg);
    box-shadow: 6px 6px 12px -8px rgba(74, 64, 99, .4);
  }
  .bubble.pop { animation: pop .5s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.07, .95); } 100% { transform: scale(1); } }
  .stat { display: grid; gap: 1px; }
  .stat .k { font-size: 11px; font-weight: 700; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
  .stat .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .stat .v small { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .face { width: 40px; height: 40px; flex: none; }
  .face .mouth { transition: d .4s ease; }
  .meter {
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: #f1e7dc;
    overflow: hidden;
    margin-top: 4px;
  }
  .meter i {
    display: block;
    height: 100%;
    width: 50%;
    border-radius: 3px;
    background: linear-gradient(90deg, #ffb5a7, #fcd5ce 40%, #b8e0d2);
    transition: width .6s cubic-bezier(.3, 1.3, .5, 1);
  }
  .quick { display: flex; gap: 8px; }
  .pill {
    appearance: none;
    border: 0;
    font: inherit;
    font-weight: 800;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--cream);
    border-radius: 999px;
    height: 40px;
    padding: 0 16px 0 12px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
  }
  .pill svg { width: 20px; height: 20px; }
  .pill:hover { transform: translateY(-2px) rotate(-1deg); }
  .pill:active { transform: translateY(1px) scale(.97); }
  .pill.icon { padding: 0; width: 40px; justify-content: center; }
  .pill.icon .off { display: none; }
  .pill.icon[aria-pressed="false"] .on { display: none; }
  .pill.icon[aria-pressed="false"] .off { display: inline; }

  /* ---------- toolbar ---------- */
  .toolbar {
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    background: var(--cream);
    border-radius: 26px;
    padding: 8px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 6px;
    max-width: calc(100vw - 24px);
  }
  .tool {
    appearance: none;
    border: 0;
    font: inherit;
    background: transparent;
    color: var(--ink-2);
    width: 72px;
    padding: 6px 4px 7px;
    border-radius: 18px;
    display: grid;
    justify-items: center;
    gap: 3px;
    cursor: pointer;
    position: relative;
    transition: background .25s ease, color .25s ease, transform .3s cubic-bezier(.3, 1.6, .5, 1);
  }
  .tool svg { width: 40px; height: 34px; transition: transform .35s cubic-bezier(.3, 1.8, .5, 1); }
  .tool span { font-size: 12px; font-weight: 800; letter-spacing: .01em; }
  .tool kbd {
    position: absolute;
    top: 4px;
    right: 7px;
    font: inherit;
    font-size: 9.5px;
    font-weight: 800;
    color: var(--ink-3);
    opacity: .8;
  }
  .tool:hover { background: var(--cream-2); color: var(--ink); }
  .tool:hover svg { transform: translateY(-3px) scale(1.06); }
  .tool[aria-pressed="true"] {
    background: var(--tint, var(--mint));
    color: var(--ink);
    transform: translateY(-6px);
    box-shadow: 0 10px 18px -10px rgba(74, 64, 99, .55);
  }
  .tool[aria-pressed="true"] svg { transform: translateY(-2px) scale(1.1); }
  .tool[data-tool="bulldoze"] { --tint: #ffd6cc; }
  .tool[data-tool="house"] { --tint: var(--peach); }
  .tool[data-tool="tower"] { --tint: var(--lav); }
  .tool[data-tool="tree"] { --tint: #cfe8c8; }
  .tool[data-tool="park"] { --tint: var(--mint); }
  .tool[data-tool="road"] { --tint: #ebe4d8; }
  .tool[data-tool="water"] { --tint: #c6e8f3; }
  .sep { width: 1.5px; margin: 8px 2px; background: var(--line); border-radius: 1px; }

  .toast {
    left: 50%;
    bottom: 118px;
    transform: translate(-50%, 10px);
    background: var(--ink);
    color: var(--cream);
    font-size: 13px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity .35s ease, transform .35s cubic-bezier(.3, 1.6, .5, 1);
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .help {
    left: 18px;
    bottom: 22px;
    font-size: 11.5px;
    color: var(--ink-2);
    background: rgba(255, 250, 243, .72);
    padding: 8px 12px;
    border-radius: 14px;
    line-height: 1.6;
    max-width: 260px;
  }
  .help b { color: var(--ink); }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  :focus-visible { outline: 3px solid #8e7cc3; outline-offset: 2px; }
  button:focus:not(:focus-visible) { outline: none; }

  @media (max-width: 1100px) { .help { display: none; } }
  @media (max-width: 760px) {
    .title-card {
      top: 10px; left: 10px; right: 10px;
      padding: 8px 8px 8px 12px; min-width: 0; border-radius: 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .title-card h1 { font-size: 16px; gap: 7px; white-space: nowrap; }
    .title-card h1 svg { width: 22px; height: 22px; }
    .title-card .tag { display: none; }
    .clock { padding-top: 0; margin-top: 0; border-top: 0; gap: 5px; }
    .dial { width: 22px; height: 22px; }
    .clock-read { font-size: 13px; min-width: 3.3em; }
    .clock-read small { font-size: 9.5px; }
    .chip { height: 26px; min-width: 26px; padding: 0 7px; }
    .chip .lbl { display: none; }
    .stats {
      top: 82px; left: 10px; right: 10px;
      flex-direction: row; justify-content: space-between; align-items: center; gap: 8px;
    }
    .bubble { padding: 8px 12px 8px 9px; gap: 10px; border-radius: 18px; }
    .bubble::after { display: none; }
    .face { width: 28px; height: 28px; }
    .stat .v { font-size: 16px; }
    .stat .k { font-size: 9px; }
    .meter { height: 4px; margin-top: 3px; }
    .pill { height: 36px; font-size: 12px; padding: 0 12px 0 9px; }
    .pill.icon { width: 36px; }
    .pill svg { width: 17px; height: 17px; }
    .toolbar { bottom: 10px; padding: 5px; gap: 2px; border-radius: 20px; }
    .tool { width: 47px; padding: 5px 2px 5px; border-radius: 14px; }
    .tool svg { width: 30px; height: 26px; }
    .tool span { font-size: 9.5px; }
    .tool kbd { display: none; }
    .tool[aria-pressed="true"] { transform: translateY(-4px); }
    .sep { display: none; }
    .toast { bottom: 92px; font-size: 12px; }
  }
  @media (max-width: 380px) {
    .tool { width: 44px; }
    .quick .pill .lbl { display: none; }
    .quick .pill { width: 34px; padding: 0; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
  }
</style>
</head>
<body>
<main id="world" tabindex="0" aria-label="Isometric town map. Click or tap a tile to build with the selected tool. Right-click or long-press to bulldoze. Drag to pan, scroll or pinch to zoom. Arrow keys move the cursor, Enter builds, Delete bulldozes." aria-describedby="status">
  <canvas id="scene" aria-hidden="true"></canvas>
</main>

<section class="hud title-card" aria-label="Pocket Metropolis">
  <h1>
    <svg viewBox="0 0 30 30" aria-hidden="true">
      <path d="M15 4l11 5.5-11 5.5L4 9.5z" fill="#a8d5a2"/>
      <path d="M4 9.5l11 5.5v11L4 20.5z" fill="#8cbf86"/>
      <path d="M26 9.5L15 15v11l11-5.5z" fill="#79ad74"/>
      <path d="M10.5 3.5l5 2.5v6.5l-5-2.5z" fill="#ffb5a7"/>
      <path d="M15.5 6l3.5-1.8v6.5L15.5 12.5z" fill="#f29a8a"/>
      <path d="M10.5 3.5l3.6-1.8 4.9 2.5-3.5 1.8z" fill="#ffd3c9"/>
      <circle cx="21" cy="12" r="2.4" fill="#b8e0d2"/>
    </svg>
    Pocket Metropolis
  </h1>
  <p class="tag">a tiny town that fits in your pocket</p>
  <div class="clock">
    <svg class="dial" viewBox="0 0 30 30" aria-hidden="true">
      <circle cx="15" cy="15" r="13.5" fill="#fbf1e6" stroke="rgba(74,64,99,.15)"/>
      <path d="M1.5 15a13.5 13.5 0 0 1 27 0z" fill="#dff1f8"/>
      <path d="M1.5 15a13.5 13.5 0 0 0 27 0z" fill="#3d4a73" opacity=".85"/>
      <g id="dial-hand"><circle cx="15" cy="4.6" r="3.1" fill="#ffc86b"/></g>
      <circle cx="15" cy="15" r="1.6" fill="#4a4063"/>
    </svg>
    <p class="clock-read" id="clock" aria-live="off">10:00<small>Day 1</small></p>
    <button type="button" class="chip" id="pause" aria-pressed="false" aria-label="Pause the clock">
      <svg viewBox="0 0 14 14" aria-hidden="true"><rect x="3" y="2.5" width="2.8" height="9" rx="1" fill="currentColor"/><rect x="8.2" y="2.5" width="2.8" height="9" rx="1" fill="currentColor"/></svg>
    </button>
    <button type="button" class="chip" id="speed" aria-label="Clock speed">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 3l5 4-5 4zM7 3l5 4-5 4z" fill="currentColor"/></svg><span class="lbl" id="speed-lbl">1×</span>
    </button>
  </div>
</section>

<section class="hud stats" aria-label="Town statistics">
  <div class="bubble" id="bubble">
    <svg class="face" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="#ffe29a"/>
      <circle cx="20" cy="20" r="18" fill="none" stroke="#f0c46a" stroke-width="1.5"/>
      <ellipse cx="11" cy="23" rx="3.4" ry="2.2" fill="#ffb5a7" opacity=".8"/>
      <ellipse cx="29" cy="23" rx="3.4" ry="2.2" fill="#ffb5a7" opacity=".8"/>
      <circle cx="14" cy="16.5" r="2" fill="#4a4063"/>
      <circle cx="26" cy="16.5" r="2" fill="#4a4063"/>
      <path class="mouth" id="mouth" d="M13 24 Q20 30 27 24" fill="none" stroke="#4a4063" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <div class="stat">
      <span class="k">Population</span>
      <span class="v" id="pop">0</span>
    </div>
    <div class="stat">
      <span class="k">Happiness</span>
      <span class="v" id="happy">—</span>
      <span class="meter" aria-hidden="true"><i id="happy-bar"></i></span>
    </div>
  </div>
  <div class="quick">
    <button type="button" class="pill" id="random">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="15" height="15" rx="4" fill="#cdb4db"/><circle cx="7" cy="7" r="1.6" fill="#fff"/><circle cx="13" cy="13" r="1.6" fill="#fff"/><circle cx="13" cy="7" r="1.6" fill="#fff"/><circle cx="7" cy="13" r="1.6" fill="#fff"/><circle cx="10" cy="10" r="1.6" fill="#fff"/></svg>
      <span class="lbl">Random town</span>
    </button>
    <button type="button" class="pill icon" id="sound" aria-pressed="true" aria-label="Sound effects">
      <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8h3l4-3.5v11L6 12H3z" fill="#fcd5ce"/>
        <path class="on" d="M13 7.3c1.2 1.4 1.2 4 0 5.4M15.3 5.2c2.3 2.6 2.3 7 0 9.6"/>
        <path class="off" d="M13.2 8l4 4m0-4l-4 4"/>
      </svg>
    </button>
  </div>
</section>

<nav class="hud toolbar" aria-label="Building tools">
  <button type="button" class="tool" data-tool="house" aria-pressed="true" aria-label="House">
    <svg viewBox="0 0 40 34" aria-hidden="true"><path d="M20 22l14-7-14-7-14 7z" fill="#a8d5a2"/><path d="M11 17v-6l7 3.5v6z" fill="#ffb5a7"/><path d="M18 20.5v-6l9-4.5v6z" fill="#f09a8b"/><path d="M11 11l5-6 9 4.5-7 5z" fill="#8e9aaf"/><path d="M16 5l11 5.5-2 .1-9-4.5z" fill="#a9b3c6"/><rect x="21" y="14.5" width="2.4" height="3" rx=".5" fill="#fff6d6" transform="skewY(-27)" transform-origin="21 14.5"/></svg>
    <span>House</span><kbd>1</kbd>
  </button>
  <button type="button" class="tool" data-tool="tower" aria-pressed="false" aria-label="Tower">
    <svg viewBox="0 0 40 34" aria-hidden="true"><path d="M20 30l12-6-12-6-12 6z" fill="#a8d5a2"/><path d="M13 24V6l7 3.5v18z" fill="#cdb4db"/><path d="M20 27.5v-18l7-3.5v18z" fill="#b39cc4"/><path d="M13 6l7-3.5 7 3.5-7 3.5z" fill="#e3d4ec"/><g fill="#fff6d6" opacity=".95"><rect x="22" y="12" width="1.6" height="2.2"/><rect x="24.6" y="10.7" width="1.6" height="2.2"/><rect x="22" y="17" width="1.6" height="2.2"/><rect x="24.6" y="15.7" width="1.6" height="2.2"/><rect x="22" y="22" width="1.6" height="2.2"/><rect x="24.6" y="20.7" width="1.6" height="2.2"/></g></svg>
    <span>Tower</span><kbd>2</kbd>
  </button>
  <button type="button" class="tool" data-tool="tree" aria-pressed="false" aria-label="Tree">
    <svg viewBox="0 0 40 34" aria-hidden="true"><path d="M20 30l12-6-12-6-12 6z" fill="#a8d5a2"/><rect x="18.8" y="17" width="2.4" height="8" rx="1" fill="#b08968"/><circle cx="20" cy="13" r="7.5" fill="#86c07f"/><circle cx="17.5" cy="10.5" r="3.2" fill="#a6d69f"/></svg>
    <span>Tree</span><kbd>3</kbd>
  </button>
  <button type="button" class="tool" data-tool="park" aria-pressed="false" aria-label="Park">
    <svg viewBox="0 0 40 34" aria-hidden="true"><path d="M20 28l15-7.5-15-7.5-15 7.5z" fill="#bfe6b6"/><path d="M9 19c6 1 10-2 14 0s6 3 8 1" stroke="#f3e6cf" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="26" cy="17" r="3" fill="#7ec8e3"/><circle cx="14" cy="15" r="3.4" fill="#86c07f"/><rect x="13.3" y="17" width="1.4" height="3" fill="#b08968"/><circle cx="20" cy="24" r="1.1" fill="#ffb5a7"/><circle cx="23" cy="22.5" r="1.1" fill="#cdb4db"/></svg>
    <span>Park</span><kbd>4</kbd>
  </button>
  <button type="button" class="tool" data-tool="road" aria-pressed="false" aria-label="Road">
    <svg viewBox="0 0 40 34" aria-hidden="true"><path d="M20 28l15-7.5-15-7.5-15 7.5z" fill="#d6d0c4"/><path d="M8.5 18.8l8.2 4.1M9 22.3l2.8-1.4" stroke="#ece8df" stroke-width="1.2"/><path d="M12.5 17.5l15 7.5" stroke="#fff" stroke-width="1.4" stroke-dasharray="2.6 2.4" transform="translate(0 -2)"/><rect x="28" y="12" width="1.2" height="9" fill="#8e8aa3"/><circle cx="28.6" cy="11.6" r="1.8" fill="#ffe29a"/></svg>
    <span>Road</span><kbd>5</kbd>
  </button>
  <button type="button" class="tool" data-tool="water" aria-pressed="false" aria-label="Water">
    <svg viewBox="0 0 40 34" aria-hidden="true"><path d="M20 28l15-7.5-15-7.5-15 7.5z" fill="#7ec8e3"/><path d="M12 20.5q2-1.3 4 0t4 0M20 23.5q2-1.3 4 0t4 0M18 17q2-1.3 4 0" stroke="#e6f6fb" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
    <span>Water</span><kbd>6</kbd>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" class="tool" data-tool="bulldoze" aria-pressed="false" aria-label="Bulldoze">
    <svg viewBox="0 0 40 34" aria-hidden="true"><rect x="8" y="17" width="18" height="8" rx="3" fill="#ffc86b"/><rect x="13" y="10" width="9" height="8" rx="2" fill="#ffd98f"/><rect x="15" y="12" width="5" height="4" rx="1" fill="#dff1f8"/><path d="M26 15h3l4 10h-7z" fill="#9a93ad"/><rect x="7" y="24" width="20" height="5" rx="2.5" fill="#6f6689"/><circle cx="10.5" cy="26.5" r="1.4" fill="#cdc6da"/><circle cx="17" cy="26.5" r="1.4" fill="#cdc6da"/><circle cx="23.5" cy="26.5" r="1.4" fill="#cdc6da"/></svg>
