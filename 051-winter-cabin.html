<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hytte — A Winter Cabin</title>
<meta name="description" content="A cosy interactive log cabin at night: a crackling stone fireplace, an aurora over the snowy spruce forest, a reading lamp, a steaming mug and a sleeping cat. Light the lamp, feed the fire, open the window.">
<style>
:root{
  --wood:#7a4a2a;
  --wood-hi:#a0673c;
  --night:#0b1026;
  --aurora-g:#4dffb4;
  --aurora-v:#8a5cff;
  --cream:#f3e6cf;
  --ember:#ff8a3d;
  --u:1;
  --placard:"Charter","Bitstream Charter","Sitka Text","Cambria","C059","Georgia",serif;
  --ui:"Avenir Next","Avenir","Segoe UI","Nimbus Sans","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a0f08}
body{font-family:var(--ui);color:var(--cream);-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stage{position:fixed;inset:0;overflow:hidden;background:#2a180d}
#outside{position:absolute;z-index:1;display:block}
#scene{position:absolute;inset:0;width:100%;height:100%;z-index:2;display:block}
#scene text{font-family:var(--placard)}
.sashes{position:absolute;z-index:3;perspective:calc(var(--u) * 1500px);pointer-events:none}
.sash{position:absolute;top:0;width:50%;height:100%;transition:transform 1.1s cubic-bezier(.5,.05,.2,1);transform-style:preserve-3d;
  border:calc(var(--u) * 13px) solid #5b3620;border-top-width:calc(var(--u) * 15px);border-bottom-width:calc(var(--u) * 17px);
  background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 12%,transparent 88%,rgba(0,0,0,.25));
  box-shadow:inset 0 0 0 calc(var(--u) * 2px) #3e2414,0 0 0 calc(var(--u) * 1px) #2a170b;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:calc(var(--u) * 7px);
}
.sash::before{content:"";position:absolute;inset:calc(var(--u) * -13px);border-radius:1px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,220,170,.22),transparent 30%),linear-gradient(0deg,rgba(0,0,0,.35),transparent 18%);mix-blend-mode:overlay}
.sash.l{left:0;transform-origin:0 50%}
.sash.r{right:0;transform-origin:100% 50%}
.open .sash.l{transform:rotateY(-72deg)}
.open .sash.r{transform:rotateY(72deg)}
.pane{position:relative;background:
  radial-gradient(circle at 0 100%,rgba(235,244,255,.55),rgba(235,244,255,.12) 22%,transparent 38%),
  radial-gradient(circle at 100% 100%,rgba(235,244,255,.38),transparent 30%),
  linear-gradient(125deg,rgba(255,236,200,.13),transparent 35%,transparent 60%,rgba(255,236,200,.07) 72%,transparent 80%);
  box-shadow:inset 0 0 0 calc(var(--u) * 1px) rgba(20,10,4,.6);outline:calc(var(--u) * 3.5px) solid #5b3620}
.sash .pane:nth-child(n+5){background:
  radial-gradient(ellipse at 50% 108%,rgba(240,248,255,.62),rgba(240,248,255,.2) 30%,transparent 55%),
  linear-gradient(125deg,rgba(255,236,200,.1),transparent 40%)}
#fx{position:absolute;inset:0;z-index:6;pointer-events:none}
.light{position:absolute;inset:0;pointer-events:none}
#dark{z-index:4;background:#1c1430;mix-blend-mode:multiply;opacity:.4;transition:opacity 1s ease}
#coldglow,#fireglow,#lampglow{z-index:5;mix-blend-mode:screen}
#lampglow{opacity:1;transition:opacity .9s ease}
.lamp-off #lampglow{opacity:0}
.lamp-off #dark{opacity:.62}

/* hit targets double as keyboard controls */
.hit{position:absolute;z-index:8;background:transparent;border:0;padding:0;margin:0;cursor:pointer;border-radius:12px;-webkit-appearance:none;appearance:none}
.hit:focus-visible{outline:2px dashed rgba(255,214,150,.9);outline-offset:4px}
.tip{position:absolute;z-index:9;pointer-events:none;padding:7px 12px 6px;border-radius:3px;background:rgba(36,20,10,.82);border:1px solid rgba(243,230,207,.28);color:var(--cream);
  font:500 12px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;opacity:0;transform:translate(-50%,-6px);transition:opacity .25s,transform .25s}
.tip.on{opacity:1;transform:translate(-50%,-14px)}

.ui{position:absolute;z-index:10;right:18px;top:16px;display:flex;gap:10px}
.pill{-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 16px 0 12px;border-radius:20px;cursor:pointer;
  background:rgba(30,17,9,.62);border:1px solid rgba(243,230,207,.3);color:var(--cream);font:500 12.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background-color .3s,border-color .3s}
.pill:hover{background:rgba(60,34,16,.78);border-color:rgba(243,230,207,.55)}
.pill:focus-visible{outline:2px solid #ffd69a;outline-offset:3px}
.pill svg{width:18px;height:18px}
.pill .wave{opacity:0;transition:opacity .3s}
.pill[aria-pressed="true"] .wave{opacity:1}
.pill[aria-pressed="true"] .x{opacity:0}
.hint{position:absolute;z-index:10;left:50%;bottom:16px;transform:translateX(-50%);margin:0;padding:9px 18px 8px;border-radius:22px;background:rgba(30,17,9,.55);border:1px solid rgba(243,230,207,.2);
  font:400 13px/1.3 var(--ui);letter-spacing:.06em;color:rgba(243,230,207,.86);white-space:nowrap;transition:opacity 1.2s ease;text-align:center}
.hint b{font-weight:600;color:#ffd69a}
.hint.dim{opacity:.35}
@media (max-width:560px){
  .hint{font-size:12px;white-space:normal;width:calc(100% - 32px);bottom:12px}
  .ui{right:12px;top:12px}
  .pill{height:38px;font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){
  .sash{transition-duration:.01s}
  #lampglow,#dark{transition:none}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="outside" aria-hidden="true"></canvas>
  <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="scene-title scene-desc">
    <title id="scene-title">Hytte, a winter cabin at night</title>
    <desc id="scene-desc">Inside a log cabin: a stone fireplace with a crackling fire, a large window onto a snowy spruce forest under a green and violet aurora, a steaming mug on the sill, a tripod reading lamp and a grey cat asleep on a braided rug.</desc>
  </svg>
  <div class="sashes" id="sashes" aria-hidden="true">
    <div class="sash l"><div class="pane"></div><div class="pane"></div><div class="pane"></div><div class="pane"></div><div class="pane"></div><div class="pane"></div></div>
    <div class="sash r"><div class="pane"></div><div class="pane"></div><div class="pane"></div><div class="pane"></div><div class="pane"></div><div class="pane"></div></div>
  </div>
  <div class="light" id="dark" aria-hidden="true"></div>
  <div class="light" id="coldglow" aria-hidden="true"></div>
  <div class="light" id="fireglow" aria-hidden="true"></div>
  <div class="light" id="lampglow" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <button type="button" class="hit" id="hit-lamp" aria-label="Switch the reading lamp off" aria-pressed="true" data-tip="Lamp"></button>
  <button type="button" class="hit" id="hit-fire" aria-label="Put another log on the fire" data-tip="Add a log"></button>
  <button type="button" class="hit" id="hit-window" aria-label="Open the window" aria-pressed="false" data-tip="Open the window"></button>
  <button type="button" class="hit" id="hit-cat" aria-label="Stroke the sleeping cat" data-tip="Psst, the cat"></button>
  <div class="tip" id="tip" aria-hidden="true"></div>

  <div class="ui">
    <button type="button" class="pill" id="sound" aria-pressed="false" aria-label="Ambient sound: off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.6a7.6 7.6 0 0 1 0 10.8"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg>
      <span id="sound-label">Sound off</span>
    </button>
  </div>
  <p class="hint" id="hint">Click the <b>lamp</b>, the <b>fire</b>, the <b>window</b> or the <b>cat</b></p>
  <p class="sr" id="live" aria-live="polite"></p>
</div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const f1 = (v) => Math.round(v * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function vnoise(x){ const i = Math.floor(x), f = x - i, h = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }; const u = f * f * (3 - 2 * f); return h(i) * (1 - u) + h(i + 1) * u; }

/* ------------------------------------------------------------------
   Two compositions: landscape, and portrait (window above, fire below)
------------------------------------------------------------------ */
const LAYOUTS = {
  land: { W: 1600, H: 1000, floorY: 812, vp: [800, 400],
    placard: { x: 470, y: 4 }, clock: { x: 896, y: 176 },
    win: { x: 176, y: 226, w: 588, h: 398 }, sill: { x: 128, y: 650, w: 684 }, mug: { x: 704, y: 650 },
    chim: { x: 1000, y: -600, w: 452, h: 1412 }, mantel: { x: 978, y: 440, w: 496, h: 38 },
    fire: { x: 1105, y: 560, w: 260, h: 240, rise: 40 }, hearth: { x: 1040, y: 800, w: 390, h: 40 },
    lamp: { x: 872, y: 812 }, rug: { x: 1228, y: 906, rx: 190, ry: 46 }, cat: { x: 1226, y: 902, sc: 1 },
    basket: { x: 1524, y: 812 }, candles: [[1022, 440], [1060, 440]], horse: [1372, 440], jar: [1428, 440] },
  port: { W: 1000, H: 1700, floorY: 1480, vp: [500, 1080],
    placard: { x: 500, y: 34 }, clock: { x: 880, y: 1010 },
    win: { x: 186, y: 236, w: 628, h: 538 }, sill: { x: 140, y: 800, w: 720 }, mug: { x: 748, y: 800 },
    chim: { x: 250, y: 972, w: 500, h: 508 }, mantel: { x: 224, y: 960, w: 552, h: 38 },
    fire: { x: 370, y: 1216, w: 260, h: 254, rise: 42 }, hearth: { x: 300, y: 1468, w: 400, h: 42 },
    lamp: { x: 168, y: 1480 }, rug: { x: 560, y: 1590, rx: 200, ry: 48 }, cat: { x: 560, y: 1586, sc: 1.08 },
    basket: { x: 842, y: 1480 }, candles: [[252, 960], [290, 960]], horse: [640, 960], jar: [700, 960] }
};
let L = LAYOUTS.land, layoutName = '';
let S = 1, OX = 0, OY = 0, VW = 0, VH = 0, DPR = 1;

/* ------------------------------------------------------------------
   Scene drawing (SVG strings), all in design units
------------------------------------------------------------------ */
function defs(){
  return `<defs>
  <linearGradient id="gLog" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a2a15"/><stop offset=".12" stop-color="#7a4a2a"/><stop offset=".42" stop-color="#a0673c"/><stop offset=".62" stop-color="#8f5a33"/><stop offset=".9" stop-color="#5e3820"/><stop offset="1" stop-color="#3a2010"/>
  </linearGradient>
  <linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5530"/><stop offset=".35" stop-color="#6b3f22"/><stop offset="1" stop-color="#3e2312"/></linearGradient>
  <linearGradient id="gSill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b07548"/><stop offset=".3" stop-color="#8a5530"/><stop offset="1" stop-color="#5a3419"/></linearGradient>
  <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e2413"/><stop offset=".35" stop-color="#5c371d"/><stop offset="1" stop-color="#6e4526"/></linearGradient>
  <radialGradient id="gStone" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".48"/></radialGradient>
  <linearGradient id="gStack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140c06" stop-opacity=".78"/><stop offset=".55" stop-color="#1a0f08" stop-opacity=".45"/><stop offset="1" stop-color="#2a1608" stop-opacity=".12"/></linearGradient>
  <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
  <radialGradient id="gSoot" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#5a240c"/><stop offset=".35" stop-color="#2a1208"/><stop offset="1" stop-color="#0c0604"/></radialGradient>
  <linearGradient id="gShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8b48f"/><stop offset=".45" stop-color="#eadbb9"/><stop offset="1" stop-color="#b39c76"/></linearGradient>
  <linearGradient id="gShadeOn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd48a"/><stop offset=".45" stop-color="#fff1cf"/><stop offset="1" stop-color="#f6c375"/></linearGradient>
  <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e5220"/><stop offset=".45" stop-color="#e2c27a"/><stop offset="1" stop-color="#7a5c24"/></linearGradient>
  <linearGradient id="gPlacard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98652"/><stop offset=".5" stop-color="#a0673c"/><stop offset="1" stop-color="#7d4c29"/></linearGradient>
  <linearGradient id="gFloorLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd8ff" stop-opacity=".22"/><stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/></linearGradient>
  <radialGradient id="gCatShade" cx=".45" cy=".25" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient>
  <radialGradient id="gFace" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fbf4e4"/><stop offset=".9" stop-color="#e9dcc2"/><stop offset="1" stop-color="#cdbb98"/></radialGradient>
  <mask id="mWall" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000">
    <rect x="-2000" y="-2000" width="6000" height="6000" fill="#fff"/>
    <rect x="${L.win.x}" y="${L.win.y}" width="${L.win.w}" height="${L.win.h}" fill="#000"/>
  </mask>
  </defs>`;
}

function wallSVG(R){
  const top = -700, bot = L.floorY, x0 = -900, x1 = L.W + 900, rowH = 54;
  let s = `<g mask="url(#mWall)"><rect x="${x0}" y="${top}" width="${x1 - x0}" height="${bot - top}" fill="#2e1a0d"/>`;
  let grain = '', knots = '', chink = '', joints = '', tone = '';
  for (let y = bot - rowH; y > top - rowH; y -= rowH){
    s += `<rect x="${x0}" y="${y + 2}" width="${x1 - x0}" height="${rowH - 4}" rx="20" fill="url(#gLog)"/>`;
    const tv = R();
    tone += `<rect x="${x0}" y="${y + 2}" width="${x1 - x0}" height="${rowH - 4}" fill="${tv < .5 ? '#000' : '#ffd9a8'}" opacity="${(tv < .5 ? tv * .22 : (tv - .5) * .1).toFixed(3)}"/>`;
    chink += `M${x0} ${y + 1}H${x1}`;
    for (let k = 0; k < 7; k++){
      const gy = y + 10 + R() * (rowH - 20), gx = x0 + R() * (x1 - x0), gl = 80 + R() * 260;
      grain += `M${f1(gx)} ${f1(gy)}q${f1(gl / 2)} ${f1((R() - .5) * 5)} ${f1(gl)} ${f1((R() - .5) * 3)}`;
    }
    if (R() < .9){
      const kx = x0 + 300 + R() * (x1 - x0 - 600), ky = y + rowH * (.35 + R() * .3);
      knots += `<ellipse cx="${f1(kx)}" cy="${f1(ky)}" rx="${f1(6 + R() * 7)}" ry="${f1(3 + R() * 3)}" fill="#4a2a15" opacity=".75"/><ellipse cx="${f1(kx)}" cy="${f1(ky)}" rx="${f1(13 + R() * 8)}" ry="${f1(6 + R() * 3)}" fill="none" stroke="#5a341b" stroke-width="1.2" opacity=".55"/>`;
    }
    const jx = x0 + 400 + R() * (x1 - x0 - 800);
    joints += `M${f1(jx)} ${y + 3}v${rowH - 6}`;
  }
  s += tone;
  s += `<path d="${grain}" fill="none" stroke="#3e2210" stroke-width="1.1" stroke-opacity=".35" stroke-linecap="round"/>`;
  s += `<path d="${chink}" stroke="#c9b28c" stroke-width="3.2" stroke-opacity=".55"/><path d="${chink}" stroke="#2a170b" stroke-width="1" transform="translate(0 2.4)"/>`;
  s += `<path d="${joints}" stroke="#2a170b" stroke-width="2.4"/>` + knots;
  // ceiling beam across the very top in landscape
  s += `<rect x="${x0}" y="${top}" width="${x1 - x0}" height="${-top - 8}" fill="#24140a"/>`;
  s += '</g>';
  // skirting board
  s += `<rect x="${x0}" y="${bot - 14}" width="${x1 - x0}" height="18" fill="#3b2211"/><rect x="${x0}" y="${bot - 14}" width="${x1 - x0}" height="3" fill="#8a5530" opacity=".6"/>`;
  return s;
}

function floorSVG(R){
  const y0 = L.floorY, y1 = L.H + 700, vp = L.vp;
  let s = `<rect x="-900" y="${y0}" width="${L.W + 1800}" height="${y1 - y0}" fill="url(#gFloor)"/>`;
  const at = (xb, y) => vp[0] + (xb - vp[0]) * (y - vp[1]) / (y1 - vp[1]);
  let planks = '', seams = '';
  const step = 118;
  let i = 0;
  for (let xb = -3200; xb < L.W + 3200; xb += step, i++){
    const a = at(xb, y0), b = at(xb + step, y0);
    const tone = R();
    planks += `<path d="M${f1(a)} ${y0}L${f1(b)} ${y0}L${f1(xb + step)} ${y1}L${xb} ${y1}Z" fill="${tone < .5 ? '#000' : '#e0a870'}" opacity="${(tone < .5 ? .05 + tone * .16 : (tone - .5) * .12).toFixed(3)}"/>`;
    seams += `M${f1(a)} ${y0}L${xb} ${y1}`;
    // butt joints
    const jy = y0 + 30 + R() * 170, ja = at(xb, jy), jb = at(xb + step, jy);
    seams += `M${f1(ja)} ${f1(jy)}L${f1(jb)} ${f1(jy)}`;
  }
  s += planks + `<path d="${seams}" stroke="#23130a" stroke-width="2" stroke-opacity=".7"/>`;
  // cool light from the window, cast onto the boards
  const w = L.win;
  const lx0 = w.x + 30, lx1 = w.x + w.w - 30;
  s += `<path d="M${lx0} ${y0 + 6}L${lx1} ${y0 + 6}L${lx1 + 170} ${y0 + 190}L${lx0 - 70} ${y0 + 190}Z" fill="url(#gFloorLight)" filter="url(#fSoft)"/>`;
  return s;
}

function placardSVG(){
  const p = L.placard, w = 300, h = 100, x = p.x - w / 2, y = p.y + 40;
  return `<g id="placard">
    <path d="M${p.x} ${p.y}L${x + 30} ${y + 4}M${p.x} ${p.y}L${x + w - 30} ${y + 4}" stroke="#2a1a0e" stroke-width="2"/>
    <circle cx="${p.x}" cy="${p.y}" r="5" fill="url(#gBrass)" stroke="#3a2a14" stroke-width="1"/>
    <rect x="${x + 4}" y="${y + 6}" width="${w}" height="${h}" rx="10" fill="#1a0e06" opacity=".45"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="url(#gPlacard)" stroke="#5a3419" stroke-width="2"/>
    <path d="M${x + 14} ${y + 26}q${w * .3} -6 ${w * .6} 1t${w * .35} -2M${x + 20} ${y + h - 20}q${w * .4} 5 ${w * .8} -2" fill="none" stroke="#6b3f22" stroke-width="1.2" opacity=".5"/>
    <rect x="${x + 9}" y="${y + 9}" width="${w - 18}" height="${h - 18}" rx="6" fill="none" stroke="#f1dcb4" stroke-opacity=".35" stroke-width="1.2"/>
    <text x="${p.x}" y="${y + 60}" text-anchor="middle" font-size="50" letter-spacing="7" fill="#2a1609" style="font-weight:700">HYTTE</text>
    <text x="${p.x}" y="${y + 59}" text-anchor="middle" font-size="50" letter-spacing="7" fill="#f6e4c2" fill-opacity=".92" style="font-weight:700" transform="translate(-1 -1.4)">HYTTE</text>
    <text x="${p.x}" y="${y + 84}" text-anchor="middle" font-size="14" letter-spacing="5.5" fill="#f6e4c2" fill-opacity=".85" font-style="italic">a winter cabin</text>
    ${heart(x + 34, y + h / 2 + 2, 1)}${heart(x + w - 34, y + h / 2 + 2, 1)}
  </g>`;
}
function heart(x, y, k){
  return `<g transform="translate(${x} ${y}) scale(${k})"><path d="M0 9C-9 2-12-4-7-8c3-2 6-1 7 2 1-3 4-4 7-2 5 4 2 10-7 17z" fill="#9e2f28" stroke="#f1dcb4" stroke-opacity=".5" stroke-width="1"/><path d="M-13 0h-6M13 0h6M0-14v-5" stroke="#f1dcb4" stroke-opacity=".5" stroke-width="1.4" stroke-linecap="round"/></g>`;
}

function clockSVG(){
  const c = L.clock;
  let ticks = '';
  const roman = ['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
  for (let i = 0; i < 12; i++){
    const a = i * 30 * Math.PI / 180, r = 34;

let skyLayer = null, treeLayer = null, stars = [], snowOut = [];
function buildOutside(){
  const R = mulberry(77);

  }
}
function sizeOutsideLayers(){
  const w = L.win, W = Math.round((w.w + 4) * S * DPR), H = Math.round((w.h + 4) * S * DPR);

  c.fillStyle = gr; c.fillRect(0, 0, W, H);
  // trees
  c = treeLayer.getContext('2d');
  c.setTransform(k, 0, 0, k, 0, 0);
  const ww = w.w + 4, hh = w.h + 4, R = mulberry(4242);
  // distant hills
  c.beginPath(); c.moveTo(0, hh * .66);
  for (let x = 0; x <= ww; x += 12) c.lineTo(x, hh * (.6 + .05 * Math.sin(x * .011 + 1) + .03 * Math.sin(x * .031)));
  c.lineTo(ww, hh); c.lineTo(0, hh); c.closePath();
  const hg = c.createLinearGradient(0, hh * .55, 0, hh);
  hg.addColorStop(0, '#6b7fae'); hg.addColorStop(.25, '#3a4a78'); hg.addColorStop(1, '#27345a');
  c.fillStyle = hg; c.fill();
  const spruce = (x, base, h, col, snow) => {
    const tiers = Math.max(5, Math.round(h / 12)), wmax = h * .42;
    c.fillStyle = col;
    c.beginPath(); c.moveTo(x, base - h);
    for (let i = 1; i <= tiers; i++){
      const y = base - h + h * i / tiers * .92, wv = wmax * Math.pow(i / tiers, .9) * (.85 + R() * .3);
      c.lineTo(x + wv * .5, y); c.lineTo(x + wv * .22, y - h / tiers * .25);
    }
    c.lineTo(x + h * .02, base); c.lineTo(x - h * .02, base);
    for (let i = tiers; i >= 1; i--){
      const y = base - h + h * i / tiers * .92, wv = wmax * Math.pow(i / tiers, .9) * (.85 + R() * .3);
      c.lineTo(x - wv * .22, y - h / tiers * .25); c.lineTo(x - wv * .5, y);
    }
    c.closePath(); c.fill();
    if (snow){
      c.strokeStyle = snow; c.lineWidth = Math.max(.8, h / 60); c.lineCap = 'round';
      c.beginPath();
      for (let i = 1; i <= tiers; i++){
        const y = base - h + h * i / tiers * .92 - h / tiers * .18, wv = wmax * Math.pow(i / tiers, .9) * .42;
        c.moveTo(x - wv * .7, y + wv * .12); c.quadraticCurveTo(x - wv * .3, y - wv * .05, x - wv * .05, y);
        c.moveTo(x + wv * .05, y); c.quadraticCurveTo(x + wv * .3, y - wv * .06, x + wv * .66, y + wv * .1);
      }

    }

  const rows = [
    { n: 22, base: .74, h: [30, 60], col: '#243058', snow: 'rgba(160,178,220,.55)' },
    { n: 13, base: .86, h: [70, 130], col: '#141c38', snow: 'rgba(190,205,238,.7)' },
    { n: 6, base: 1.02, h: [170, 300], col: '#0a0f22', snow: 'rgba(215,226,248,.82)' }
  ];
  rows.forEach((row, ri) => {
    // snow ground in front of each row
    c.fillStyle = ['#56679a', '#8193c4', '#aebde0'][ri];
    c.beginPath(); c.moveTo(0, hh * row.base - 4);
    for (let x = 0; x <= ww; x += 10) c.lineTo(x, hh * row.base - 6 + Math.sin(x * .02 + ri) * 4);
    c.lineTo(ww, hh); c.lineTo(0, hh); c.closePath(); c.fill();
    for (let i = 0; i < row.n; i++){
      const x = (i + R() * .8) / row.n * ww * 1.1 - ww * .05, h = row.h[0] + R() * (row.h[1] - row.h[0]);

  const dg = c.createLinearGradient(0, hh * .86, 0, hh);
  dg.addColorStop(0, '#c9d4ee'); dg.addColorStop(1, '#eef2fb');
  c.fillStyle = dg; c.beginPath(); c.moveTo(0, hh);
  for (let x = 0; x <= ww; x += 8) c.lineTo(x, hh * (.93 - .03 * Math.sin(x * .012 + .6) - .02 * Math.sin(x * .05)));
  c.lineTo(ww, hh); c.closePath(); c.fill();

  warm.addColorStop(0, 'rgba(255,190,120,.35)'); warm.addColorStop(1, 'rgba(255,190,120,0)');
  c.fillStyle = warm; c.fillRect(0, hh * .7, ww, hh * .3);
}
// one vertical sprite for the aurora curtains
const auroraSprite = (() => {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const x = c.getContext('2d'), gr = x.createLinearGradient(0, 256, 0, 0);
  gr.addColorStop(0, 'rgba(77,255,180,0)'); gr.addColorStop(.06, 'rgba(77,255,180,.95)'); gr.addColorStop(.3, 'rgba(77,255,180,.45)'); gr.addColorStop(.6, 'rgba(138,92,255,.35)'); gr.addColorStop(1, 'rgba(138,92,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 4, 256);

function drawOutside(t, dt){
  const w = L.win, ww = w.w + 4, hh = w.h + 4, k = S * DPR;
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.drawImage(skyLayer, 0, 0);
  octx.setTransform(k, 0, 0, k, 0, 0);
  // stars
  for (const st of stars){
    const a = .45 + .55 * Math.pow(Math.sin(t * st.f + st.ph) * .5 + .5, 2);
    octx.fillStyle = `rgba(235,240,255,${a.toFixed(3)})`;
    octx.fillRect(st.x * ww, st.y * hh, st.r, st.r);
  }
  // aurora: a soft glow under rippling curtains of thin rays
  octx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++){
    const u = (i + .5) / 7, x = u * ww, y = hh * (.4 + Math.sin(u * 5.2 + t * .28) * .07);
    const a = .16 + .1 * vnoise(u * 4 + t * .2);
    const gr = octx.createRadialGradient(x, y, 0, x, y, ww * .2);
    gr.addColorStop(0, `rgba(77,255,180,${a.toFixed(3)})`); gr.addColorStop(.5, `rgba(100,160,255,${(a * .4).toFixed(3)})`); gr.addColorStop(1, 'rgba(138,92,255,0)');
    octx.fillStyle = gr; octx.fillRect(x - ww * .2, y - ww * .2, ww * .4, ww * .4);
  }
  for (let band = 0; band < 3; band++){
    const baseY = hh * (.36 + band * .09), amp = hh * (.07 - band * .015), height = hh * (.34 - band * .07);
    const alphaB = [.55, .38, .26][band];
    for (let x = -4; x < ww + 4; x += 3){
      const u = x / ww;
      const y = baseY + Math.sin(u * 5.2 + t * .28 + band * 1.7) * amp + Math.sin(u * 13 - t * .5 + band) * amp * .35;
      const h = height * (.55 + .45 * vnoise(u * 6 + t * .22 + band * 9));
      const a = alphaB * (.35 + .65 * vnoise(u * 9 - t * .35 + band * 4)) * (0.6 + 0.4 * Math.sin(t * .4 + band));
      if (a < .02) continue;
      octx.globalAlpha = Math.min(1, a);
      octx.drawImage(auroraSprite, x, y - h, 3.4, h);
    }
  }

  octx.globalCompositeOperation = 'source-over';

    f.y += (f.v * dt) / hh;

    if (f.y > 1.02){ f.y = -.02; f.x = Math.random(); }
    if (f.x > 1.03) f.x -= 1.06;
    octx.globalAlpha = [.55, .75, .95][f.d];
    octx.beginPath(); octx.arc(f.x * ww, f.y * hh, f.r, 0, Math.PI * 2); octx.fill();
  }

}

      const am = ctx.createGain(); am.gain.value = 0;
      const osc = ctx.createOscillator(), og = ctx.createGain(); osc.frequency.value = 26; og.gain.value = .5; osc.connect(og).connect(am.gain);
      const env = ctx.createGain(); env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(.9, t + .3); env.gain.setTargetAtTime(0, t + 1.6, .3);
      s.connect(lp).connect(am).connect(env).connect(master); s.start(t); s.stop(t + 3); osc.start(t); osc.stop(t + 3);
    }
  };
})();
$('#sound').addEventListener('click', () => {
  const on = sfx.toggle();
  const b = $('#sound');
  b.setAttribute('aria-pressed', String(on));
  b.setAttribute('aria-label', on ? 'Ambient sound: on' : 'Ambient sound: off');
  $('#sound-label').textContent = on ? 'Sound on' : 'Sound off';
});

/* ------------------------------------------------------------------
   Interaction wiring
------------------------------------------------------------------ */
let touched = false;
function touch(){ if (!touched){ touched = true; $('#hint').classList.add('dim'); } }
$('#hit-lamp').addEventListener('click', () => { touch(); toggleLamp(); });
$('#hit-fire').addEventListener('click', () => { touch(); addLog(); });
$('#hit-window').addEventListener('click', () => { touch(); toggleWindow(); });
$('#hit-cat').addEventListener('click', () => { touch(); petCat(); });
const tip = $('#tip');
document.querySelectorAll('.hit').forEach((b) => {
  const show = () => { const r = b.getBoundingClientRect(); tip.textContent = b.dataset.tip; tip.style.left = (r.left + r.width / 2) + 'px'; tip.style.top = Math.max(8, r.top) + 'px'; tip.classList.add('on'); };
  b.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') show(); });
  b.addEventListener('focus', show);
  b.addEventListener('pointerleave', () => tip.classList.remove('on'));
  b.addEventListener('blur', () => tip.classList.remove('on'));
  b.addEventListener('click', () => setTimeout(() => { if (tip.classList.contains('on')) tip.textContent = b.dataset.tip; }, 30));
});

/* ------------------------------------------------------------------
   The loop
------------------------------------------------------------------ */
let last = performance.now(), T = 0, running = true;
const elFire = $('#fireglow'), elDark = $('#dark'), elCold = $('#coldglow');
const zFont = 'italic 600 22px ' + getComputedStyle(document.documentElement).getPropertyValue('--placard').trim();
function setDesign(){ g.setTransform(S * DPR, 0, 0, S * DPR, OX * DPR, OY * DPR); }
function frame(now){
  if (!running){ return; }
  let dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (reduce) dt *= .35;
  T += dt;
  // fire intensity: base, boosted by logs, knocked down by the draught
  fireBoost *= Math.exp(-dt / 6.5);
  windOpen += ((windowIsOpen ? 1 : 0) - windOpen) * Math.min(1, dt * (windowIsOpen ? 2.2 : .9));
  const target = (1 + fireBoost) * (1 - .55 * windOpen);
  fireI += (target - fireI) * Math.min(1, dt * 2.2);
  const flick = (vnoise(T * 7.3) - .5) * .6 + (vnoise(T * 17.1 + 5) - .5) * .35;

  // lighting overlays
  elFire.style.opacity = clamp(.55 + .3 * (fireI - 1) + .22 * flick * (reduce ? .3 : 1), .15, 1).toFixed(3);
  elDark.style.opacity = ((lampOn ? .36 : .6) - .08 * (fireI - 1) - .025 * flick + .06 * windOpen).toFixed(3);
  elCold.style.opacity = (.7 + .3 * vnoise(T * .5) + .5 * windOpen).toFixed(3);

  drawOutside(T, dt);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, fx.width, fx.height);
  setDesign();
  drawFire(T, flick);
  drawEmbers(dt);
  drawCandles(T);
  drawSteam(dt);
  drawIndoorSnow(dt);
  drawZzz(dt);
  animateRoom(dt, T);
  sfx.update();
  requestAnimationFrame(frame);
}

function drawFire(t, flick){
  const F = L.fire, baseY = F.y + F.h - 36, x0 = F.x + 30, x1 = F.x + F.w - 30, cx = (x0 + x1) / 2;
  g.save();
  g.clip(firePath);
  g.globalCompositeOperation = 'lighter';
  const I = fireI;
  // glow bed
  const gl = g.createRadialGradient(cx, baseY + 10, 4, cx, baseY, F.w * .75);
  gl.addColorStop(0, `rgba(255,120,40,${(.55 * Math.min(1.4, I)).toFixed(3)})`); gl.addColorStop(.5, 'rgba(160,50,10,.22)'); gl.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gl; g.fillRect(F.x, F.y - F.rise, F.w, F.h + F.rise * 2);
  // coals
  for (let i = 0; i < 16; i++){
    const x = x0 + (x1 - x0) * (i + .5) / 16, n = vnoise(t * 3 + i * 4.1);
    g.fillStyle = `rgba(255,${(80 + n * 90) | 0},20,${(.35 + n * .45).toFixed(3)})`;
    g.beginPath(); g.ellipse(x, baseY + 22 + (i % 3) * 3, 12 + n * 5, 5 + n * 2, 0, 0, Math.PI * 2); g.fill();
  }
  // tongues of flame in three nested layers
  const N = 9, lean = windOpen * 38;
  const cols = [[255, 70, 20, .5], [255, 145, 40, .55], [255, 225, 140, .62]];
  for (let layer = 0; layer < 3; layer++){
    const k = [1, .7, .42][layer], wk = [1.55, 1.1, .7][layer];
    const c = cols[layer];
    g.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${c[3]})`;
    for (let i = 0; i < N; i++){
      const mid = 1 - Math.abs(i - (N - 1) / 2) / N * 1.3;
      const bx = x0 + (x1 - x0) * (i + .5) / N;
      const n1 = vnoise(t * (2.4 + i * .13) + i * 7.3), n2 = vnoise(t * 1.8 + i * 3.1 + 40);
      const hh = F.h * .62 * I * (.4 + .6 * n1) * mid * k;
      if (hh < 4) continue;
      const ww = (x1 - x0) / N * wk;
      const sway = (n2 - .5) * ww * 1.1 + lean * (hh / F.h);
      g.beginPath();
      g.moveTo(bx - ww / 2, baseY + 8);
      g.bezierCurveTo(bx - ww * .55, baseY - hh * .45, bx + sway * .35 - ww * .28, baseY - hh * .72, bx + sway, baseY - hh);
      g.bezierCurveTo(bx + sway * .35 + ww * .28, baseY - hh * .72, bx + ww * .55, baseY - hh * .45, bx + ww / 2, baseY + 8);
      g.fill();
    }
  }
  // a hint of blue at the roots
  g.fillStyle = 'rgba(90,120,255,.16)';
  g.beginPath(); g.ellipse(cx, baseY + 4, (x1 - x0) * .45, 7, 0, 0, Math.PI * 2); g.fill();
  g.restore();
}
function drawEmbers(dt){
  const F = L.fire;
  const rate = 10 * fireI + fireBoost * 22;
  if (!reduce && Math.random() < rate * dt){
    embers.push({ x: F.x + F.w * (.2 + Math.random() * .6), y: F.y + F.h - 40, vx: (Math.random() - .5) * 20, vy: -(50 + Math.random() * 90) * (.7 + fireI * .3), life: 0, max: 1 + Math.random() * 1.8, ph: Math.random() * 6 });
  }
  g.save();
  g.clip(firePath);
  g.globalCompositeOperation = 'lighter';
  for (let i = embers.length - 1; i >= 0; i--){
    const e = embers[i];
    e.life += dt;
    if (e.life > e.max){ embers.splice(i, 1); continue; }
    e.x += (e.vx + Math.sin(T * 4 + e.ph) * 14 + windOpen * 40) * dt; e.y += e.vy * dt; e.vy *= .995;
    const k = 1 - e.life / e.max;
    g.fillStyle = `rgba(255,${(150 + 90 * k) | 0},${(60 * k) | 0},${(k * .95).toFixed(3)})`;
    g.fillRect(e.x - 1.2, e.y - 1.2, 2.4, 2.4);
  }
  g.restore();
  // flare sparks may leap out of the hearth
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (let i = sparks.length - 1; i >= 0; i--){
    const p = sparks[i];
    p.life += dt;
    if (p.life > p.max){ sparks.splice(i, 1); continue; }
    p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const k = 1 - p.life / p.max;
    g.strokeStyle = `rgba(255,${(170 + 80 * k) | 0},80,${k.toFixed(3)})`; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * .025, p.y - p.vy * .025); g.stroke();
  }
  g.restore();
}
function drawCandles(t){
  g.save();
  g.globalCompositeOperation = 'lighter';
  L.candles.forEach(([x, y], i) => {
    const h = i ? 44 : 58, top = y - 12 - h - 7;
    const n = vnoise(t * 5 + i * 9), sway = (vnoise(t * 3 + i * 4) - .5) * 3 + windOpen * 6;
    const fh = 13 + n * 5 - windOpen * 4;
    const gl = g.createRadialGradient(x, top - 6, 1, x, top - 6, 30);
    gl.addColorStop(0, 'rgba(255,200,120,.35)'); gl.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = gl; g.fillRect(x - 30, top - 36, 60, 60);
    g.fillStyle = 'rgba(255,190,90,.85)';
    g.beginPath(); g.moveTo(x - 3.6, top); g.quadraticCurveTo(x - 4, top - fh * .5, x + sway, top - fh); g.quadraticCurveTo(x + 4, top - fh * .5, x + 3.6, top); g.fill();
    g.fillStyle = 'rgba(255,248,220,.9)';
    g.beginPath(); g.ellipse(x + sway * .2, top - 3, 1.6, 3.6, 0, 0, Math.PI * 2); g.fill();
  });
  g.restore();
}
function drawSteam(dt){
  const m = L.mug;
  if (!reduce && Math.random() < dt * 9) steam.push({ x: m.x + (Math.random() - .5) * 18, y: m.y - 60, life: 0, max: 2.4 + Math.random() * 1.6, ph: Math.random() * 6.28, r: 5 + Math.random() * 5 });
  g.save();
  for (let i = steam.length - 1; i >= 0; i--){
    const s = steam[i];
    s.life += dt;
    if (s.life > s.max){ steam.splice(i, 1); continue; }
    const k = s.life / s.max;
    s.y -= (22 - windOpen * 10) * dt;
    s.x += (Math.sin(T * 1.6 + s.ph) * 9 + windOpen * 70) * dt;
    const a = Math.sin(Math.PI * k) * .16;
    g.fillStyle = `rgba(245,238,228,${a.toFixed(3)})`;
    g.beginPath(); g.ellipse(s.x, s.y, s.r * (1 + k * 1.6), s.r * (1.4 + k * 2), Math.sin(T + s.ph) * .4, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}
function drawIndoorSnow(dt){
  const w = L.win;
  if (windowIsOpen && windOpen > .3 && !reduce){
    const n = Math.round(80 * dt * windOpen);
    for (let i = 0; i < n; i++) indoorSnow.push({ x: w.x + Math.random() * w.w, y: w.y + Math.random() * w.h, vx: 40 + Math.random() * 220, vy: 10 + Math.random() * 110, life: 0, max: 1.6 + Math.random() * 1.8, r: .8 + Math.random() * 1.2, ph: Math.random() * 6 });
  }
  g.save();
  g.fillStyle = '#f4f7ff';
  for (let i = indoorSnow.length - 1; i >= 0; i--){
    const s = indoorSnow[i];
    s.life += dt;
    if (s.life > s.max){ indoorSnow.splice(i, 1); continue; }
    const k = s.life / s.max;
    s.x += (s.vx + Math.sin(T * 3 + s.ph) * 30) * dt; s.y += (s.vy + 30 * k) * dt;
    g.globalAlpha = Math.sin(Math.PI * Math.min(1, k * 1.2)) * .85;
    g.beginPath(); g.arc(s.x, s.y, s.r * (1 + k * 3), 0, Math.PI * 2); g.fill();
  }
  g.restore();
}
function drawZzz(dt){
  const c = L.cat;
  if (!reduce && Math.random() < dt * .35) zzz.push({ x: 0, y: 0, life: 0 });
  g.save();
  g.font = zFont;
  for (let i = zzz.length - 1; i >= 0; i--){
    const z = zzz[i];
    z.life += dt;
    if (z.life > 3){ zzz.splice(i, 1); continue; }
    const k = z.life / 3;
    const x = c.x + (70 + k * 40 + Math.sin(z.life * 3) * 6) * c.sc, y = c.y + (-95 - k * 90) * c.sc;
    g.fillStyle = `rgba(243,230,207,${(Math.sin(Math.PI * k) * .75).toFixed(3)})`;
    g.save(); g.translate(x, y); g.scale(.6 + k * .8, .6 + k * .8); g.fillText('z', 0, 0); g.restore();
  }
  g.restore();
}
function animateRoom(dt, t){
  const c = L.cat;
  // breathing: the body swells from its base
  const b = (Math.sin(t * 1.7) + 1) / 2;
  if (dom.catBody) dom.catBody.setAttribute('transform', `translate(0 2) scale(${(1 + .012 * b).toFixed(4)} ${(1 + .04 * b).toFixed(4)}) translate(0 -2)`);
  // ear and tail springs
  nextIdleTwitch -= dt;
  if (nextIdleTwitch < 0 && !reduce){ ear.v += 18; nextIdleTwitch = 5 + Math.random() * 9; }
  ear.v += (-ear.a * 180 - ear.v * 9) * dt; ear.a += ear.v * dt;
  tail.v += (-tail.a * 90 - tail.v * 5) * dt; tail.a += tail.v * dt;
  if (dom.earR){ dom.earR.setAttribute('transform', `rotate(${(ear.a * 1.2).toFixed(2)} 84 -64)`); dom.earL.setAttribute('transform', `rotate(${(-ear.a * .35).toFixed(2)} 36 -62)`); }
  if (dom.tailTip) dom.tailTip.setAttribute('transform', `rotate(${(tail.a + Math.sin(t * .8) * 2).toFixed(2)} 58 -1)`);
  // clock
  if (dom.pend){
    const now = new Date(), sec = now.getSeconds() + now.getMilliseconds() / 1000;
    dom.pend.setAttribute('transform', `rotate(${(Math.sin(sec * Math.PI) * 9 * (reduce ? .3 : 1)).toFixed(2)} 0 40)`);
    const m = now.getMinutes() + sec / 60, h = (now.getHours() % 12) + m / 60;
    dom.hH.setAttribute('transform', `rotate(${(h * 30).toFixed(2)})`);
    dom.hM.setAttribute('transform', `rotate(${(m * 6).toFixed(2)})`);
    dom.hS.setAttribute('transform', `rotate(${(Math.floor(sec) * 6)})`);
  }
  // log seams glow with the fire
  const glow = clamp(.45 + .5 * (fireI - .6) + (vnoise(t * 5) - .5) * .4, .15, 1).toFixed(3);
  dom.seams.forEach((s) => s.setAttribute('opacity', glow));
  // logs flying from the basket into the fire, then charring
  for (const lg of addedLogs){
    lg.t = Math.min(1, lg.t + dt / .9);
    const e = lg.t < 1 ? 1 - Math.pow(1 - lg.t, 2) : 1;
    const x = lg.from[0] + (lg.to[0] - lg.from[0]) * e, y = lg.from[1] + (lg.to[1] - lg.from[1]) * e - Math.sin(Math.PI * e) * 160;
    const r = lg.rot + (1 - e) * 90;
    const sc = .55 + .45 * e;
    lg.el.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1(r)}) scale(${sc.toFixed(3)})`);
    if (lg.t >= 1 && !lg.landed){ lg.landed = true; dom.newlogs.appendChild(lg.el); burst(); }
    if (lg.landed){
      lg.life += dt;
      const ch = Math.min(1, lg.life / 30);
      const rect = lg.el.querySelector('rect');
      if (rect) rect.setAttribute('fill', mixHex('#e9e2d2', '#2b1a10', ch));
    }
  }
}
function mixHex(a, b, t){
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden){ running = false; }
  else if (!running){ running = true; last = performance.now(); requestAnimationFrame(frame); }
});
let rsT = 0;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(layout, 50); });
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'l'){ touch(); toggleLamp(); }
  else if (k === 'f'){ touch(); addLog(); }
  else if (k === 'w'){ touch(); toggleWindow(); }
  else if (k === 'c'){ touch(); petCat(); }
});

layout();
requestAnimationFrame((n) => { last = n; frame(n); });
})();
</script>
