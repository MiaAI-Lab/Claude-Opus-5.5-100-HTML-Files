<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foxglove Hollow — A Paper-Cut Forest Diorama</title>
<meta name="description" content="Foxglove Hollow: nine sheets of hand-cut paper stacked into a forest diorama with hills, pines, a winding river, mushrooms, ferns and a small fox. Move to look around, flip day to night, and make the fox hop.">
<meta name="theme-color" content="#f3e8d2">
<style>
:root{
  --cream:#f3e8d2;
  --sage:#9bb89b;
  --moss:#5f7f5b;
  --teal:#274e52;
  --ochre:#d9a45b;
  --orange:#c8642d;
  --ink:#3b2b1d;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",P052,"URW Palladio L",Georgia,serif;
  --shade:rgba(58,38,18,.34);
  --edge:rgba(255,250,236,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#1f3a3c;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.night{--shade:rgba(6,6,32,.62);--edge:rgba(176,186,255,.2)}

/* ---------- the box ---------- */
.stage{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
.sky{position:absolute;inset:0;background:radial-gradient(120% 75% at 70% 22%,#fbf3e1 0%,#f3e8d2 42%,#ecd9b4 100%)}
.sky-night{position:absolute;inset:0;opacity:0;transition:opacity 1.5s ease;background:radial-gradient(95% 70% at 70% 20%,#3a3f8a 0%,#252a69 36%,#161a45 72%,#10132f 100%)}
body.night .sky-night{opacity:1}
.sky-grain{position:absolute;inset:0;width:100%;height:100%;opacity:.9;transition:opacity 1.4s ease}
.pins{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.2s ease .5s}
body.night .pins{opacity:1}
.pins circle{fill:#fff4d6;transform-box:fill-box;transform-origin:center}
.pins .tw{animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.3);opacity:.35}}

.layer{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.layer>svg{display:block;overflow:visible}
.cut{filter:drop-shadow(0 -1px 0 var(--edge)) drop-shadow(0 calc(var(--sh,4) * 1px) calc(var(--sh,4) * 1.5px) var(--shade));transition:filter 1.2s ease var(--d,0s)}
.place>svg{animation:placeIn .9s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes placeIn{from{transform:translateY(7%);opacity:0}to{transform:none;opacity:1}}

.layer path,.layer circle,.layer ellipse{transition:fill 1.25s cubic-bezier(.55,.05,.3,1) var(--d,0s),opacity 1.25s ease var(--d,0s),stroke 1.25s ease var(--d,0s)}
.grain{fill:url(#grainPat);pointer-events:none;transition:opacity 1.2s ease}
body.night .grain{opacity:.5}
body.night .sky-grain{opacity:.35}

/* day / night paper stock */
.c-far{fill:#dfdec3} body.night .c-far{fill:#4a508f}
.c-hill{fill:#bdcfb2} body.night .c-hill{fill:#3e4487}
.c-roof{fill:#a8bd9c} body.night .c-roof{fill:#353b7b}
.c-win{fill:#8aa083} body.night .c-win{fill:#ffd57c}
.winglow{opacity:0} body.night .winglow{opacity:1}
.c-ridge{fill:#9bb89b} body.night .c-ridge{fill:#343a7c}
.c-meadow{fill:#7e9c74} body.night .c-meadow{fill:#2b3071}
.c-river{fill:#b7d2c8} body.night .c-river{fill:#5763ae}
.c-ripple{fill:#f1f2e3} body.night .c-ripple{fill:#b9c1f2}
.glint{fill:#fff3c9;opacity:0} body.night .glint{opacity:.95;animation:glint 2.6s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:.95}50%{opacity:.12}}
.c-moss{fill:#5f7f5b} body.night .c-moss{fill:#24295f}
.c-teal{fill:#274e52} body.night .c-teal{fill:#1a1d4e}
.c-ground{fill:#d9a45b} body.night .c-ground{fill:#352b63}
.c-burrow{fill:#4a3019} body.night .c-burrow{fill:#110e2a}
.c-stem{fill:#f0e3c6} body.night .c-stem{fill:#8d86b9}
.c-cap{fill:#c8642d} body.night .c-cap{fill:#7b3e6b}
.c-dot{fill:#f8efdc} body.night .c-dot{fill:#aef6e4}
.c-fern{fill:#5f7f5b} body.night .c-fern{fill:#262d62}
.c-fall1{fill:#c9713a} body.night .c-fall1{fill:#5a3766}
.c-fall2{fill:#b98f4c} body.night .c-fall2{fill:#443d78}
.c-tuft{fill:#8a9a55} body.night .c-tuft{fill:#2c2a5c}
.c-pebble{fill:#e9dcc0} body.night .c-pebble{fill:#5a5690}
.c-fg{fill:#1f4245} body.night .c-fg{fill:#121439}
.c-fg2{fill:#3d6a50} body.night .c-fg2{fill:#1b1d4a}
.c-bell{fill:#c8642d} body.night .c-bell{fill:#8a4a86}
.c-bell2{fill:#efc27d} body.night .c-bell2{fill:#d7a3d8}
.c-mat{fill:#efe3c9} body.night .c-mat{fill:#8f8bb6}
.c-frame{fill:#1c3739} body.night .c-frame{fill:#0b0c27}
.c-fox{fill:#c8642d} body.night .c-fox{fill:#a14f36}
.c-foxc{fill:#f6ecd6} body.night .c-foxc{fill:#d2cbe4}
.c-foxd{fill:#3a2b24} body.night .c-foxd{fill:#17152f}
.glowdots{filter:url(#softGlow)}
.puff{fill:#e0b673;opacity:0} body.night .puff{fill:#9d96cc}

/* ---------- hanging things (a little fly-system) ---------- */
.hang{position:absolute;top:0;transition:transform 1.6s cubic-bezier(.5,-.28,.25,1.22);transition-delay:var(--hd,0s)}
.hang .swing{position:relative;transform-origin:50% 0;animation:swing var(--sd,5s) ease-in-out infinite alternate;animation-delay:var(--sdl,0s)}
.hang .string{position:absolute;left:50%;top:0;width:1px;margin-left:-.5px;height:var(--len);background:linear-gradient(rgba(74,54,34,.25),rgba(74,54,34,.6))}
body.night .hang .string{background:linear-gradient(rgba(220,220,255,.08),rgba(220,220,255,.36))}
.hang .obj{position:absolute;left:50%;top:var(--len);transform:translate(-50%,-6%);filter:drop-shadow(0 5px 6px var(--shade))}
.hang .obj svg{display:block;overflow:visible}
.hang.day{transform:none}
body.night .hang.day{transform:translateY(calc(-1px * var(--up)))}
.hang.nite{transform:translateY(calc(-1px * var(--up)))}
body.night .hang.nite{transform:none}
@keyframes swing{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.halo{position:absolute;left:50%;top:50%;width:260%;height:260%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,236,190,.34) 0%,rgba(255,236,190,.12) 34%,rgba(255,236,190,0) 66%);pointer-events:none}

/* ---------- leaves / fireflies ---------- */
.leaf{position:absolute;left:0;top:0;will-change:transform;filter:drop-shadow(1px 4px 3px var(--shade))}
.leaf svg{display:block}
.lf-a{fill:#d9a45b} body.night .lf-a{fill:#6c5a8f}
.lf-b{fill:#c8642d} body.night .lf-b{fill:#7a4577}
.lf-c{fill:#9bb89b} body.night .lf-c{fill:#4a569a}
.lf-v{fill:none;stroke:rgba(255,246,226,.55);stroke-width:.7} body.night .lf-v{stroke:rgba(210,210,255,.3)}
.leaf path{transition:fill 1.2s ease .6s}
#flies{pointer-events:none}

.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 16vmin rgba(60,36,14,.22);transition:box-shadow 1.4s ease}
body.night .vignette{box-shadow:inset 0 0 22vmin rgba(2,2,20,.55)}

/* ---------- the fox's hit target ---------- */
.fox-btn{position:absolute;left:0;top:0;width:10px;height:10px;padding:0;margin:0;border:0;border-radius:40%;background:transparent;cursor:pointer;pointer-events:auto;touch-action:manipulation}
.fox-btn:focus-visible{outline:2px dashed #fff6df;outline-offset:4px;box-shadow:0 0 0 6px rgba(39,78,82,.45)}

/* ---------- the tag ---------- */
.tag-wrap{position:fixed;top:0;left:clamp(26px,5.2vw,86px);z-index:10;transform-origin:50% 0;will-change:transform;pointer-events:none;filter:drop-shadow(2px 10px 9px var(--shade))}
.tag-string{display:block;margin:0 auto;width:1px;height:clamp(26px,5vh,54px);background:linear-gradient(rgba(74,54,34,.2),rgba(74,54,34,.7))}
body.night .tag-string{background:linear-gradient(rgba(230,230,255,.1),rgba(230,230,255,.45))}
.tag{position:relative;width:clamp(214px,21vw,290px);padding:44px 22px 20px;text-align:center;pointer-events:auto;
  background:#f8efdb;color:var(--ink);
  clip-path:polygon(24% 0,76% 0,100% 16%,100% 100%,0 100%,0 16%);
  transition:background-color 1.2s ease,color 1.2s ease}
body.night .tag{background:#e7e1ef;color:#2a2644}
.tag-grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tag>p,.tag>h1,.tag>.rule{position:relative}
.tag::after{content:"";position:absolute;inset:7px;border:1px dashed rgba(122,78,40,.35);clip-path:polygon(23% 0,77% 0,100% 15%,100% 100%,0 100%,0 15%);pointer-events:none}
.tag-hole{position:absolute;left:50%;top:13px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#1f3a3c;box-shadow:0 0 0 3.5px var(--ochre),0 0 0 4.5px rgba(90,56,24,.35);transition:background-color 1.2s ease}
body.night .tag-hole{background:#141841}
.tag-knot{position:absolute;left:50%;top:-2px;width:1px;height:23px;margin-left:-.5px;background:rgba(74,54,34,.7)}
body.night .tag-knot{background:rgba(230,230,255,.45)}
.kicker{margin:0 0 8px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#9a5526;font-variant-numeric:oldstyle-nums}
body.night .kicker{color:#7b5aa6}
.tag h1{margin:0;font-weight:400;font-size:clamp(31px,3vw,42px);line-height:.96;letter-spacing:-.01em}
.tag h1 em{display:block;font-style:italic;color:var(--orange);font-size:1.12em;letter-spacing:0}
body.night .tag h1 em{color:#8d4a86}
.tag .sub{margin:12px auto 0;max-width:22ch;font-size:13.5px;line-height:1.42;font-style:italic;color:#5b4632}
body.night .tag .sub{color:#4a4468}
.rule{display:block;width:44px;height:6px;margin:12px auto 0;background:radial-gradient(circle,var(--moss) 1.4px,transparent 1.8px) 0 50%/9px 6px repeat-x}

/* ---------- controls ---------- */
.controls{position:fixed;right:clamp(18px,3.4vw,48px);bottom:clamp(18px,3.4vw,44px);z-index:11;display:flex;gap:12px;align-items:center}
.chip{appearance:none;display:inline-flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border:0;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;background:#f8efdb;
  clip-path:polygon(2% 6%,30% 0,62% 4%,99% 1%,100% 52%,98% 96%,64% 100%,34% 97%,1% 100%,0 48%);
  filter:drop-shadow(0 4px 5px var(--shade));transition:transform .25s cubic-bezier(.3,1.6,.5,1),background-color 1.2s ease,color 1.2s ease}
.chip:hover{transform:translateY(-2px) rotate(-1deg)}
.chip:active{transform:translateY(1px) scale(.98)}
.chip:focus-visible{outline:none;background:#fff7e4;box-shadow:inset 0 0 0 2px var(--orange)}
body.night .chip{background:#e7e1ef;color:#2a2644}
.track{position:relative;width:52px;height:26px;border-radius:13px;background:#d9c7a1;box-shadow:inset 0 2px 3px rgba(80,50,20,.3);transition:background-color .9s ease}
body.night .track{background:#3a3f86}
.knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;transition:transform .7s cubic-bezier(.5,-.3,.3,1.35)}
body.night .knob{transform:translateX(26px)}
.knob svg{position:absolute;inset:0;width:22px;height:22px;transition:opacity .5s ease,transform .7s ease}
.knob .k-moon{opacity:0;transform:rotate(-90deg)}
body.night .knob .k-sun{opacity:0;transform:rotate(90deg)}
body.night .knob .k-moon{opacity:1;transform:none}
.chip-label{min-width:3.6em;text-align:left;font-style:italic}
.chip svg.scissors{width:20px;height:20px}
.hint{position:fixed;left:clamp(18px,3.4vw,48px);bottom:clamp(18px,3.4vw,44px);z-index:11;margin:0;padding:9px 14px;max-width:min(46vw,440px);font-size:14px;font-style:italic;line-height:1.35;color:#f8efdb;background:rgba(28,55,57,.78);
  clip-path:polygon(0 8%,40% 0,100% 6%,99% 94%,55% 100%,1% 96%);transition:opacity .8s ease,background-color 1.2s ease}
body.night .hint{background:rgba(12,13,40,.8);color:#e7e1ef}
.hint b{font-weight:600;font-style:normal;color:#f2c47f}
.hint.gone{opacity:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.defs{position:absolute;width:0;height:0;overflow:hidden}

@media (max-width:640px){
  .tag{width:226px;padding:40px 12px 16px}
  .kicker{letter-spacing:.15em;font-size:10px}
  .tag h1{font-size:30px}
  .tag .sub{font-size:12.5px}
  .controls{left:50%;right:auto;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom))}
  .chip{font-size:14px;padding:9px 14px 9px 10px}
  .hint{left:50%;transform:translateX(-50%);bottom:78px;max-width:calc(100vw - 40px);width:max-content;font-size:13px;text-align:center}
}
@media (prefers-reduced-motion:reduce){
  .place>svg{animation:none}
  .hang .swing,.pins .tw{animation:none}
  .hang{transition-duration:.6s}
}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Foxglove Hollow: a paper-cut forest diorama of layered hills, pine ridges, a winding river, mushrooms, ferns, foxgloves and a small fox">
  <div class="sky" id="sky">
    <div class="sky-night"></div>
    <svg class="sky-grain" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="url(#grainPat)"/></svg>
    <svg class="pins" id="pins" aria-hidden="true" focusable="false"></svg>
  </div>
  <div class="layer" id="hang" data-depth="0.4" aria-hidden="true"></div>
  <div class="layer cut place" id="L1" data-depth="1" style="--i:0;--sh:3" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut place" id="L2" data-depth="2" style="--i:1;--sh:3" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut place" id="L3" data-depth="3" style="--i:2;--sh:4" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut place" id="L4" data-depth="4" style="--i:3;--sh:4" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut place" id="L5" data-depth="5" style="--i:4;--sh:5" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut place" id="L6" data-depth="6" style="--i:5;--sh:6" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut place" id="L7" data-depth="7" style="--i:6;--sh:6">
    <svg focusable="false" aria-hidden="true"></svg>
    <button type="button" class="fox-btn" id="foxBtn" aria-label="The fox. Press to make it hop to a new spot"></button>
  </div>
  <canvas class="layer" id="flies" data-depth="7.4" aria-hidden="true"></canvas>
  <div class="layer" id="leaves" data-depth="7.7" aria-hidden="true"></div>
  <div class="layer cut place" id="L8" data-depth="8" style="--i:7;--sh:7" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="layer cut" id="L9" data-depth="2.2" style="--i:8;--sh:9" aria-hidden="true"><svg focusable="false"></svg></div>
  <div class="vignette" aria-hidden="true"></div>
</main>

<header class="tag-wrap" id="tagWrap">
  <span class="tag-string" aria-hidden="true"></span>
  <div class="tag" id="tag">
    <svg class="tag-grain" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="url(#grainPat)"/></svg>
    <span class="tag-knot" aria-hidden="true"></span>
    <span class="tag-hole" aria-hidden="true"></span>
    <p class="kicker">Plate XVIII · Paper diorama</p>
    <h1>Foxglove <em>Hollow</em></h1>
    <span class="rule" aria-hidden="true"></span>
    <p class="sub">Nine sheets of hand-cut paper, one slow river, and a fox who will not sit still.</p>
  </div>
</header>

<nav class="controls" aria-label="Diorama controls">
  <button type="button" class="chip" id="recut" aria-label="Recut the forest with a new pattern">
    <svg class="scissors" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M8.3 16.2 20 5M8.3 7.8 20 19M13 12h.01"/></g></svg>
    <span class="chip-label">Recut</span>
  </button>
  <button type="button" class="chip" id="toggle" aria-pressed="false" aria-label="Night">
    <span class="track" aria-hidden="true"><span class="knob">
      <svg class="k-sun" viewBox="-11 -11 22 22" focusable="false"><g fill="#c8642d"><circle r="5.6"/><path d="M0-10 1.6-6.8h-3.2zM0 10l1.6-3.2h-3.2zM-10 0l3.2 1.6v-3.2zM10 0 6.8 1.6v-3.2zM-7 -7l3.4 1.2-2.2 2.2zM7 7 3.6 5.8l2.2-2.2zM7 -7 5.8-3.6 3.6-5.8zM-7 7l1.2-3.4 2.2 2.2z"/></g></svg>
      <svg class="k-moon" viewBox="-11 -11 22 22" focusable="false"><path fill="#f4ead2" d="M3.2-8.6A9 9 0 1 0 8.8 4 7.2 7.2 0 0 1 3.2-8.6z"/></svg>
    </span></span>
    <span class="chip-label" id="toggleLabel">Day</span>
  </button>
</nav>
<p class="hint" id="hint"><span id="hintText">Move to look around · <b>click the fox</b> · tap the canopy for leaves</span></p>
<p class="sr-only" aria-live="polite" id="live"></p>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="grainPat" patternUnits="userSpaceOnUse" width="160" height="160"><image id="grainImg" width="160" height="160"/></pattern>
    <radialGradient id="winGlowGrad"><stop offset="0" stop-color="#ffd98a" stop-opacity=".75"/><stop offset=".45" stop-color="#ffc766" stop-opacity=".22"/><stop offset="1" stop-color="#ffc766" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const stage = $('stage'), body = document.body;
  const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = reduceMQ.matches;

  /* ---------- seeded randomness: every cut is repeatable ---------- */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  let seed = 1847, R = mulberry32(seed);
  const rr = (a,b) => a + (b-a)*R();
  const q = n => Math.round(n*10)/10;
  const clamp = (v,a,b) => v<a?a:v>b?b:v;

  let W=0, H=0, M=0, U=0, S=0, portrait=false;

  /* ---------- paper geometry ---------- */
  function area(p){let a=0;for(let i=0;i<p.length;i++){const u=p[i],v=p[(i+1)%p.length];a+=u[0]*v[1]-v[0]*u[1];}return a;}
  function orient(p){return area(p)<0?p.slice().reverse():p;}
  // walk a polygon, subdividing each edge and nudging points sideways so the edge looks scissor-cut
  function trace(p,j,step){
    let s='';const n=p.length;
    for(let i=0;i<n;i++){
      const a=p[i],b=p[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,k=Math.max(1,Math.round(L/step)),nx=-dy/L,ny=dx/L;
      for(let t=0;t<k;t++){
        let x=a[0]+dx*t/k,y=a[1]+dy*t/k;
        if(t>0){const o=(R()-.5)*2*j;x+=nx*o;y+=ny*o;}
        s+=(s?'L':'M')+q(x)+' '+q(y);
      }
    }
    return s+'Z';
  }
  const cut  = (p,j=.7,step=7) => trace(orient(p),j,step);
  const hole = (p,j=.7,step=7) => trace(orient(p).slice().reverse(),j,step);
  function poly(p){p=orient(p);let s='M'+q(p[0][0])+' '+q(p[0][1]);for(let i=1;i<p.length;i++)s+='L'+q(p[i][0])+' '+q(p[i][1]);return s+'Z';}
  function circ(cx,cy,r,n){const p=[];n=n||Math.max(8,Math.round(r*1.4));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}return p;}
  function wave(base,amps,lens){const ph=amps.map(()=>R()*Math.PI*2);return x=>{let y=base;for(let i=0;i<amps.length;i++)y+=amps[i]*Math.sin(x/lens[i]*Math.PI*2+ph[i]);return y;};}

      const x=W*fx,f=foxglove(x,g8(x)+4,H*fh,W*fl,sd);stalks+=f.stalk;bells+=f.bells;inner+=f.inner;
    }
    svgOf('L8').innerHTML = `<path class="c-fg2" d="${fg2}"/><path class="c-fg" d="${d8}${stalks}"/><path class="c-bell" d="${bells}"/><path class="c-bell2" d="${inner}"/><path class="grain" d="${d8}${fg2}${stalks}${bells}"/>`;

    /* sheet 9 — the box: a deckle-edged cream mat inside a dark board frame */
    const e=Math.max(10,Math.min(W,H)*.024), rad=e*3;
    const outer=[[-M-4,-M-4],[W+M+4,-M-4],[W+M+4,H+M+4],[-M-4,H+M+4]];
    const rrect=(ins,wob)=>{const p=[],x0=ins,y0=ins,x1=W-ins,y1=H-ins,r=rad;
      const seg=(ax,ay,bx,by)=>{const L=Math.hypot(bx-ax,by-ay),k=Math.max(1,Math.round(L/11));for(let t=0;t<k;t++){const u=t/k;p.push([ax+(bx-ax)*u+(R()-.5)*wob,ay+(by-ay)*u+(R()-.5)*wob]);}};
      const arc=(cx,cy,a0)=>{for(let i=0;i<6;i++){const a=a0+i/6*Math.PI/2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]);}};
      seg(x0+r,y0,x1-r,y0);arc(x1-r,y0+r,-Math.PI/2);seg(x1,y0+r,x1,y1-r);arc(x1-r,y1-r,0);seg(x1-r,y1,x0+r,y1);arc(x0+r,y1-r,Math.PI/2);seg(x0,y1-r,x0,y0+r);arc(x0+r,y0+r,Math.PI);
      return p;};
    const mat=cut(outer,0,4000)+hole(rrect(e,2.4),.5,6);
    const frame=cut(outer,0,4000)+hole(rrect(e*.55,1.2),.3,8);
    svgOf('L9').innerHTML = `<path class="c-mat" d="${mat}"/><path class="c-frame" d="${frame}"/><path class="grain" d="${frame}"/>`;

    buildHangers();
    buildPins();
    placeFox(fox.fx*W,false);
    sizeFlies();
  }

  /* ---------- sun, moon, clouds and stars hung on threads ---------- */
  function buildHangers(){
    const hang=$('hang'), m=Math.min(W,H);
    const sunD=clamp(m*.16,78,168), sunX=W*(portrait?.74:.7), sunY=H*(portrait?.33:.2);
    const items=[];
    // sun: scalloped burnt-orange rays behind an ochre disc
    let rays=[];for(let i=0;i<44;i++){const a=i/44*Math.PI*2,r=i%2?47:58;rays.push([Math.cos(a)*r,Math.sin(a)*r]);}
    const sunSvg=`<svg viewBox="-62 -62 124 124" width="${q(sunD)}" height="${q(sunD)}"><path fill="#c8642d" d="${cut(rays,.5,5)}"/><path fill="#d9a45b" d="${cut(circ(0,0,42,40),.5,5)}"/><path fill="#e6b772" d="${cut(circ(-4,-5,29,30),.4,5)}"/><path fill="url(#grainPat)" d="${cut(circ(0,0,42,40),.1,50)}"/></svg>`;
    items.push({cls:'day',x:sunX,y:sunY,h:sunD,html:sunSvg,delay:.1});
    // moon: a cream paper disc with cut craters and a warm halo
    const moonD=sunD*.86;
    const moonSvg=`<span class="halo"></span><svg viewBox="-50 -50 100 100" width="${q(moonD)}" height="${q(moonD)}" style="position:relative"><path fill="#f5ecd6" d="${cut(circ(0,0,44,44),.5,5)}"/><path fill="#e3d4b3" d="${cut(circ(-14,-10,9,14),.4,3)}${cut(circ(12,8,6,10),.3,3)}${cut(circ(-6,18,5,9),.3,3)}${cut(circ(18,-16,4,8),.3,3)}"/><path fill="url(#grainPat)" d="${cut(circ(0,0,44,40),.1,50)}"/></svg>`;
    items.push({cls:'nite',x:sunX-m*.02,y:sunY-m*.02,h:moonD,html:moonSvg,delay:.55});
    // clouds
    const cloudShape=(sc)=>{let d='';for(const [cx,cy,r] of [[-30,4,17],[-9,-9,24],[16,-5,20],[35,6,13]])d+=cut(circ(cx*sc,cy*sc,r*sc,22),.5,5);d+=cut([[-46*sc,20*sc],[-46*sc,6*sc],[48*sc,6*sc],[48*sc,20*sc]],.5,6);return d;};
    const clouds=portrait?[[.8,.12,.8],[.5,.375,.6]]:[[.44,.12,1],[.575,.305,.62]];
    clouds.forEach(([cx,cy,sc],i)=>{const cw=m*.19*sc;items.push({cls:'day',x:W*cx,y:H*cy,h:cw*.5,html:`<svg viewBox="-52 -36 104 60" width="${q(cw)}" height="${q(cw*.58)}"><path fill="#fbf6ea" d="${cloudShape(1)}"/><path fill="rgba(217,164,91,.16)" d="${cut([[-46,20],[-46,13],[48,13],[48,20]],.4,6)}"/></svg>`,delay:.2+i*.12});});
    // stars on threads
    const starPts=(r1,r2)=>{const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?r2:r1;p.push([Math.cos(a)*r,Math.sin(a)*r]);}return p;};
    const stars=portrait?[[.14,.4],[.5,.26],[.88,.16],[.4,.38],[.64,.12]]:[[.36,.1],[.5,.26],[.58,.08],[.84,.36],[.93,.12],[.3,.3],[.76,.06]];
    stars.forEach(([sx,sy],i)=>{const ss=m*rr(.024,.036);items.push({cls:'nite',x:W*sx,y:H*sy,h:ss,html:`<svg viewBox="-12 -12 24 24" width="${q(ss)}" height="${q(ss)}"><path fill="#e8b865" d="${cut(starPts(11,4.6),.2,3)}"/></svg>`,delay:.7+i*.08});});
    hang.innerHTML=items.map((it,i)=>{
      const len=it.y+M, up=len+it.h*1.6+40;
      return `<div class="hang ${it.cls}" style="left:${q(it.x+M)}px;--len:${q(len)}px;--up:${q(up)};--hd:${it.delay}s"><div class="swing" style="--sd:${(4+R()*3).toFixed(2)}s;--sdl:-${(R()*4).toFixed(2)}s"><span class="string"></span><div class="obj">${it.html}</div></div></div>`;
    }).join('');
  }
  function buildPins(){
    const pins=$('pins');pins.setAttribute('viewBox',`0 0 ${W} ${H}`);
    let s='';const n=Math.round(W*H/9000);
    for(let i=0;i<n;i++){const x=R()*W,y=Math.pow(R(),1.4)*H*.5,r=rr(.5,1.5);s+=`<circle${R()<.35?' class="tw"':''} style="animation-delay:-${(R()*3).toFixed(2)}s" cx="${q(x)}" cy="${q(y)}" r="${q(r)}"/>`;}
    pins.innerHTML=s;
  }

  /* ---------- fox placement and hopping ---------- */
  function foxScale(){return clamp(U*(portrait?.78:.72),5,11.5)/8;}
  function placeFox(x,keepY){
    fox.x=x;fox.y=groundAt(x);fox.s=foxScale();renderFox(0);
  }
  function renderFox(lift){
    const g=$('foxG');if(!g)return;
    const sx=fox.sx*fox.s*fox.dir, sy=fox.sy*fox.s;
    g.setAttribute('transform',`translate(${q(fox.x)} ${q(fox.y-lift)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)})`);
    const bw=150*fox.s,bh=80*fox.s;
    foxBtn.style.width=q(bw)+'px';foxBtn.style.height=q(bh)+'px';
    foxBtn.style.transform=`translate(${q(fox.x+M-bw/2+fox.dir*(-8*fox.s))}px,${q(fox.y-lift+M-bh)}px)`;
  }
  function hop(){
    if(fox.hop)return;
    const minX=W*.12,maxX=W*.88;let tx;
    for(let k=0;k<12;k++){tx=minX+Math.random()*(maxX-minX);if(Math.abs(tx-fox.x)>W*.14&&Math.abs(tx-fox.x)<W*.5)break;}
    const dist=Math.abs(tx-fox.x);
    fox.hop={t:0,x0:fox.x,x1:tx,dur:reduce?.35:.55+dist/W*.6,hgt:Math.max(40*fox.s*6/8,dist*.32)};
    fox.dir=tx>fox.x?1:-1;
    say('The fox hops '+(fox.dir>0?'to the right':'to the left')+'.');
  }
  const puffs=[];
  function landPuff(){
    const els=$('puffs')?$('puffs').children:[];
    for(let i=0;i<els.length;i++){const a=Math.PI+(i/(els.length-1))*Math.PI;puffs[i]={el:els[i],x:fox.x,y:fox.y-2,vx:Math.cos(a)*rr(40,90)*fox.s,vy:Math.sin(a)*rr(30,70)*fox.s,r:R()*6,t:0};}
  }
  function stepFox(dt){
    if(fox.hop){
      const h=fox.hop;h.t+=dt/h.dur;const t=Math.min(1,h.t);
      let lift=0;
      if(t<.16){const u=t/.16;fox.sy=1-.2*Math.sin(u*Math.PI/2);fox.sx=1+.12*Math.sin(u*Math.PI/2);}
      else if(t<.86){const u=(t-.16)/.7,e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;fox.x=h.x0+(h.x1-h.x0)*e;fox.y=groundAt(fox.x);lift=Math.sin(u*Math.PI)*h.hgt;fox.sy=1+.14*Math.cos(u*Math.PI);fox.sx=1-.08*Math.cos(u*Math.PI);}
      else{const u=(t-.86)/.14;if(!h.landed){h.landed=true;fox.x=h.x1;fox.y=groundAt(fox.x);landPuff();}fox.sy=1-.18*Math.sin(u*Math.PI);fox.sx=1+.1*Math.sin(u*Math.PI);}
      renderFox(lift);
      if(t>=1){fox.hop=null;fox.sx=fox.sy=1;fox.fx=fox.x/W;renderFox(0);}
    }
    for(const p of puffs){if(!p||p.t>=1)continue;p.t+=dt*1.8;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.r+=dt*8;
      p.el.setAttribute('transform',`translate(${q(p.x)} ${q(p.y)}) rotate(${q(p.r*40)}) scale(${(fox.s*1.4).toFixed(2)})`);p.el.style.opacity=(1-p.t).toFixed(2);}
  }

  /* ---------- paper leaves ---------- */
  const leafShapes=[
    'M0 -9C5 -6 6 1 0 9C-6 1 -5 -6 0 -9Z',
    'M0 -9L2.5 -4L6.5 -5L4.5 0L7 3L2 3.5L0 9L-2 3.5L-7 3L-4.5 0L-6.5 -5L-2.5 -4Z',
    'M0 -9C3 -7 4.5 -3 3.5 0C5 2 4 6 0 9C-4 6 -5 2 -3.5 0C-4.5 -3 -3 -7 0 -9Z'
  ];
  const leafCls=['lf-a','lf-b','lf-c','lf-a','lf-b'];
  const leavesEl=$('leaves'),leaves=[];
  function makeLeaves(){
    const n=18;let html='';
    for(let i=0;i<n;i++){html+=`<div class="leaf"><svg viewBox="-10 -10 20 20" width="20" height="20"><path class="${leafCls[i%5]}" d="${leafShapes[i%3]}"/><path class="lf-v" d="M0 -7V8"/></svg></div>`;}
    leavesEl.innerHTML=html;
    Array.from(leavesEl.children).forEach((el,i)=>leaves.push({el,on:false,x:0,y:0,vx:0,vy:0,rot:0,vr:0,ph:Math.random()*6,sz:1,ambient:i<(W<640?5:8)}));
    leaves.forEach(l=>{if(l.ambient)spawnLeaf(l,Math.random()*W,Math.random()*H*.9);else l.el.style.opacity='0';});
  }
  function spawnLeaf(l,x,y,burst){
    l.on=true;l.x=x;l.y=y;l.vx=burst?rr(-80,80):rr(8,26);l.vy=burst?rr(-70,-20):rr(18,34);
    l.rot=Math.random()*360;l.vr=rr(-90,90);l.sz=rr(.8,1.5)*clamp(U/9,.7,1.4);l.el.style.opacity='1';
  }
  function stepLeaves(dt,t){
    for(const l of leaves){
      if(!l.on)continue;
      const slow=reduce?.35:1;
      l.vy+=(30-l.vy)*dt*1.4;l.vx+=(14-l.vx)*dt*.8;
      l.x+=(l.vx+Math.sin(t*1.3+l.ph)*34)*dt*slow;l.y+=l.vy*dt*slow;l.rot+=l.vr*dt*slow;
      const flip=Math.sin(t*2.1+l.ph)*62;
      l.el.style.transform=`translate3d(${q(l.x+M)}px,${q(l.y+M)}px,0) rotate(${q(l.rot)}deg) rotateY(${q(flip)}deg) scale(${l.sz.toFixed(2)})`;
      if(l.y>H+30||l.x>W+40){if(l.ambient)spawnLeaf(l,rr(-.1,.9)*W,-30);else{l.on=false;l.el.style.opacity='0';}}
    }
  }
  function leafBurst(cx,cy){
    let n=0;for(const l of leaves){if(!l.on&&!l.ambient){spawnLeaf(l,cx,cy,true);if(++n>=4)break;}}
  }

  /* ---------- fireflies (and day-time pollen) ---------- */
  const fc=$('flies'),fx=fc.getContext('2d');
  let dpr=1,flies=[],nightAmt=0,sprite=null;
  function sizeFlies(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    fc.width=Math.round((W+2*M)*dpr);fc.height=Math.round((H+2*M)*dpr);
    fc.style.width=(W+2*M)+'px';fc.style.height=(H+2*M)+'px';
    const n=W<640?20:38;flies=[];
    for(let i=0;i<n;i++)flies.push({x:Math.random()*W,y:H*(.45+Math.random()*.5),a:Math.random()*6.28,sp:rr(12,26),ph:Math.random()*6.28,bl:rr(.6,1.4),z:rr(.6,1.2)});
    if(!sprite){sprite=document.createElement('canvas');sprite.width=sprite.height=64;const g=sprite.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,250,200,1)');gr.addColorStop(.14,'rgba(246,236,130,.95)');gr.addColorStop(.4,'rgba(214,230,110,.28)');gr.addColorStop(1,'rgba(200,220,100,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);}
  }
  let ptr={x:-9999,y:-9999,t:0};
  function stepFlies(dt,t){
    fx.setTransform(dpr,0,0,dpr,M*dpr,M*dpr);
    fx.clearRect(-M,-M,W+2*M,H+2*M);
    const na=nightAmt;
    for(const f of flies){
      f.a+=(Math.sin(t*.7+f.ph)*1.6)*dt;
      let vx=Math.cos(f.a)*f.sp,vy=Math.sin(f.a)*f.sp*.6;
      if(na>.5&&performance.now()-ptr.t<2500){const dx=ptr.x-f.x,dy=ptr.y-f.y,d=Math.hypot(dx,dy);if(d<W*.3&&d>20){vx+=dx/d*22;vy+=dy/d*22;}}
      const sp=reduce?.4:1;f.x+=vx*dt*sp;f.y+=vy*dt*sp;
      if(f.x<-20)f.x=W+20;if(f.x>W+20)f.x=-20;
      if(f.y<H*.42)f.a=Math.PI/2;if(f.y>H*.97)f.a=-Math.PI/2;
      if(na>.02){
        const b=Math.max(0,Math.sin(t*f.bl*2+f.ph))*.8+.2,s=(10+b*12)*f.z*clamp(U/10,.7,1.3);
        fx.globalAlpha=na*b;fx.drawImage(sprite,f.x-s,f.y-s,s*2,s*2);
      }
      if(na<.98){fx.globalAlpha=(1-na)*.55;fx.fillStyle='#fff8e6';fx.beginPath();fx.arc(f.x,f.y,1.3*f.z,0,6.283);fx.fill();}
    }
    fx.globalAlpha=1;
  }

  /* ---------- the hanging tag: a damped pendulum ---------- */
  const tagWrap=$('tagWrap');
  let tagA=-2.5,tagV=0;
  function stepTag(dt,t){
    const rest=-2.2+(reduce?0:Math.sin(t*.6)*.6);
    tagV+=(-(tagA-rest)*26-tagV*2.6)*dt;tagA+=tagV*dt;tagA=clamp(tagA,-16,16);
    tagWrap.style.transform=`rotate(${tagA.toFixed(2)}deg)`;
  }

  /* ---------- parallax ---------- */
  let px=0,py=0,tx=0,ty=0,lastInput=-1e9,drag=null;
  const depths=layerEls.map(el=>parseFloat(el.dataset.depth)||0);
  function applyParallax(){
    for(let i=0;i<layerEls.length;i++){
      const f=Math.pow(depths[i]/8,1.15)*S;
      layerEls[i].style.transform=`translate3d(${q(-px*f)}px,${q(-py*f*.55)}px,0)`;
    }
  }
  function stepParallax(dt,t){
    if(!reduce&&performance.now()-lastInput>3500&&!drag){tx=Math.sin(t*.19)*.42;ty=Math.sin(t*.13+1)*.18;}
    const k=1-Math.exp(-dt*(reduce?9:3.4));
    px+=(tx-px)*k;py+=(ty-py)*k;
    applyParallax();
  }

  /* ---------- the frame loop ---------- */
  let raf=0,last=performance.now(),clock=0;
  function frame(now){
    raf=requestAnimationFrame(frame);
    const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
    const target=body.classList.contains('night')?1:0;
    nightAmt+=(target-nightAmt)*(1-Math.exp(-dt*1.6));
    stepParallax(dt,clock);stepTag(dt,clock);stepLeaves(dt,clock);stepFox(dt);stepFlies(dt,clock);
  }
  function start(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame);}}
  function stop(){cancelAnimationFrame(raf);raf=0;}
  document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

  /* ---------- input ---------- */
  let lastPX=null,lastPT=0;
  stage.addEventListener('pointermove',e=>{
    const now=performance.now();
    if(e.pointerType==='mouse'&&!drag){tx=clamp((e.clientX/W-.5)*2,-1,1);ty=clamp((e.clientY/H-.5)*2,-1,1);}
    else if(drag){tx=clamp(drag.tx+(drag.x-e.clientX)/(W*.35),-1,1);ty=clamp(drag.ty+(drag.y-e.clientY)/(H*.35),-1,1);}
    if(lastPX!==null){const v=(e.clientX-lastPX)/Math.max(8,now-lastPT);tagV+=-v*9;}
    lastPX=e.clientX;lastPT=now;lastInput=now;
    const f=Math.pow(7.4/8,1.15)*S;ptr.x=e.clientX+px*f;ptr.y=e.clientY+py*f*.55;ptr.t=now;
  });
  stage.addEventListener('pointerdown',e=>{
    lastInput=performance.now();
    if(e.pointerType!=='mouse'){drag={x:e.clientX,y:e.clientY,tx,ty,moved:false};}
  });
  const endDrag=()=>{drag=null;};
  stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);stage.addEventListener('pointerleave',()=>{lastPX=null;});
  stage.addEventListener('click',e=>{
    if(e.target===foxBtn)return;
    const f=Math.pow(7.7/8,1.15)*S;
    leafBurst(e.clientX+px*f,e.clientY+py*f*.55);
    tagV+=(Math.random()-.5)*30;
    hideHint();
  });
  foxBtn.addEventListener('click',e=>{e.stopPropagation();hop();hideHint();});

  const toggle=$('toggle'),toggleLabel=$('toggleLabel');
  function setNight(on){
    body.classList.toggle('night',on);
    toggle.setAttribute('aria-pressed',String(on));
    toggleLabel.textContent=on?'Night':'Day';
    document.querySelector('meta[name="theme-color"]').setAttribute('content',on?'#161a45':'#f3e8d2');
    say(on?'Night falls on Foxglove Hollow: windows light up and fireflies come out.':'Morning returns to Foxglove Hollow.');
    try{localStorage.setItem('foxglove-night',on?'1':'0');}catch(e){}
  }
  toggle.addEventListener('click',()=>{setNight(!body.classList.contains('night'));tagV+=18;});

  $('recut').addEventListener('click',()=>{
    seed=(Math.random()*1e9)|0;
    build();
    if(!reduce){layerEls.forEach(el=>{if(el.classList.contains('place')){el.classList.remove('place');void el.offsetWidth;el.classList.add('place');}});}
    tagV-=24;say('The forest has been recut.');
  });

  window.addEventListener('keydown',e=>{
    if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
    const k=e.key;lastInput=performance.now();
    if(k==='ArrowLeft'){tx=clamp(tx-.25,-1,1);}
    else if(k==='ArrowRight'){tx=clamp(tx+.25,-1,1);}
    else if(k==='ArrowUp'){ty=clamp(ty-.25,-1,1);}
    else if(k==='ArrowDown'){ty=clamp(ty+.25,-1,1);}
    else if(k==='n'||k==='N'){setNight(!body.classList.contains('night'));}
    else if(k==='f'||k==='F'){hop();}
    else return;
    e.preventDefault();
  });

  const hint=$('hint');let hintTimer=0;
  function hideHint(){clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.add('gone'),2600);}
  if(matchMedia('(hover: none)').matches)$('hintText').innerHTML='Drag to look around · <b>tap the fox</b> · tap for leaves';
  const live=$('live');function say(s){live.textContent=s;}

  reduceMQ.addEventListener&&reduceMQ.addEventListener('change',e=>{reduce=e.matches;});

  let rT=0;
  window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{build();applyParallax();},120);});

  /* ---------- paper grain, made once from noise ---------- */
  function makeGrain(){
    const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d'),id=g.createImageData(160,160),d=id.data;
    for(let i=0;i<d.length;i+=4){const n=Math.random();if(n<.5){d[i]=74;d[i+1]=52;d[i+2]=30;d[i+3]=(.5-n)*46;}else{d[i]=255;d[i+1]=251;d[i+2]=240;d[i+3]=(n-.5)*40;}}
    g.putImageData(id,0,0);
    for(let k=0;k<90;k++){g.strokeStyle=k%3?'rgba(255,252,242,.2)':'rgba(96,66,36,.13)';g.lineWidth=.6;g.beginPath();const x=Math.random()*160,y=Math.random()*160,a=Math.random()*6.28,l=4+Math.random()*14;g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
    return c.toDataURL();
  }
  try{
    const url=makeGrain();
    $('grainImg').setAttribute('href',url);
  }catch(e){}

  let startNight=false;try{startNight=localStorage.getItem('foxglove-night')==='1';}catch(e){}
  if(startNight){body.classList.add('night');toggle.setAttribute('aria-pressed','true');toggleLabel.textContent='Night';nightAmt=1;}
  build();
  makeLeaves();
  applyParallax();
  start();
})();
</script>
</body>
</html>
