<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbital — N-Body Gravity Playground</title>
<meta name="description" content="Orbital is an interactive n-body gravity playground: fling bodies with a predicted trajectory, watch them orbit, merge and flare, and explore binary stars, a solar system, the figure-eight three-body orbit and a galaxy collision.">
<meta name="theme-color" content="#03040a">
<style>
:root{
  --void:#03040a;
  --panel:rgba(7,9,20,.74);
  --line:rgba(150,180,255,.14);
  --line-2:rgba(150,180,255,.26);
  --text:#dfe6f5;
  --mute:#7d88a6;
  --faint:#4a536e;
  --ice:#8fd3ff;
  --warm:#ffb36b;
  --hot:#ff7a2e;
  --indigo:#1b1464;
  --plum:#5f0f40;
  --mono:"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,"Nimbus Mono PS","DejaVu Sans Mono",monospace;
  --geo:"Futura","Avenir Next","Century Gothic","URW Gothic","Trebuchet MS",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--text);overflow:hidden;-webkit-text-size-adjust:100%}
body{font-family:var(--mono);font-size:12px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--ice);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#space{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;background:var(--void)}
#space.panning{cursor:grabbing}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 20px;pointer-events:none;z-index:5}
.brand{display:flex;align-items:center;gap:14px;pointer-events:auto}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{margin:0;font-family:var(--geo);font-weight:400;font-size:21px;letter-spacing:.62em;line-height:1;color:#f3f6ff;padding-left:.1em}
.brand p{margin:7px 0 0;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.hud{pointer-events:auto;min-width:238px;padding:12px 14px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.hud dl{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:18px;row-gap:5px;align-items:center}
.hud dt{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.hud dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--text);white-space:nowrap}
.hud dd small{color:var(--mute);font-size:10px}
.hud .spark{display:block;width:100%;height:26px;margin-top:9px;border-top:1px solid var(--line);padding-top:6px}
.hud .state{display:inline-block;width:6px;height:6px;border-radius:50%;background:#62f0a8;margin-right:7px;vertical-align:1px;box-shadow:0 0 8px #62f0a8}
.hud .state.paused{background:var(--warm);box-shadow:0 0 8px var(--warm)}

/* ---------- hint ---------- */
.hint{position:fixed;left:50%;bottom:calc(var(--dockH,96px) + 18px);transform:translateX(-50%);margin:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(3,4,10,.55);color:var(--mute);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;pointer-events:none;transition:opacity .8s,transform .8s;z-index:4}
.hint b{color:var(--text);font-weight:500}
.hint.gone{opacity:0;transform:translate(-50%,8px)}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:stretch;gap:0;padding:6px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:6;max-width:calc(100vw - 24px)}
.grp{display:flex;align-items:center;gap:4px;padding:4px 10px;position:relative}
.grp+.grp::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:1px;background:var(--line)}
.glabel{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);writing-mode:vertical-rl;transform:rotate(180deg);margin-right:4px}
.mass{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;width:46px;height:52px;padding:6px 0 5px;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;transition:background .25s,border-color .25s}
.mass i{display:block;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c),0 0 2px #fff inset;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.mass span{font-size:10px;color:var(--mute);letter-spacing:.04em}
.mass:hover{background:rgba(150,180,255,.06)}
.mass:hover i{transform:scale(1.18)}
.mass[aria-checked="true"]{border-color:var(--line-2);background:rgba(150,180,255,.08)}
.mass[aria-checked="true"] span{color:var(--text)}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:52px;height:52px;padding:6px 8px 5px;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;transition:background .25s,border-color .25s,color .25s;color:var(--text)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.btn:hover{background:rgba(150,180,255,.06)}
.btn[aria-pressed="true"]{border-color:rgba(255,179,107,.45);background:rgba(255,179,107,.08);color:var(--warm)}
.btn[aria-pressed="true"] span{color:var(--warm)}
.preset{min-width:60px}
.preset svg{width:22px;height:18px}
.preset.on{border-color:rgba(143,211,255,.4);background:rgba(143,211,255,.07);color:var(--ice)}
.preset.on span{color:var(--ice)}
.trail{flex-direction:column;align-items:stretch;justify-content:center;gap:6px;min-width:120px}
.trail label{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.trail output{color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--ice) 0 var(--p,50%),rgba(150,180,255,.18) var(--p,50%) 100%)}
input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:rgba(150,180,255,.18)}
input[type=range]::-moz-range-progress{height:2px;background:var(--ice)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;background:#e8f4ff;box-shadow:0 0 0 3px rgba(143,211,255,.25),0 0 12px rgba(143,211,255,.6)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#e8f4ff;box-shadow:0 0 0 3px rgba(143,211,255,.25)}

.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-10px);opacity:0;padding:9px 14px;border-radius:999px;border:1px solid var(--line-2);background:rgba(7,9,20,.86);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text);pointer-events:none;transition:opacity .3s,transform .4s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .dock{flex-wrap:wrap;justify-content:center;width:calc(100vw - 20px);bottom:10px;padding:4px}
  .grp{padding:3px 6px}
  .grp+.grp::before{display:none}
  .glabel{display:none}
  .trail{min-width:0;flex:1 1 150px}
}
@media (max-width:620px){
  .top{padding:12px 12px;flex-direction:column;gap:10px}
  .brand svg{width:30px;height:30px}
  .brand h1{font-size:16px;letter-spacing:.5em}
  .brand p{font-size:9px;margin-top:5px}
  .hud{min-width:0;width:100%;padding:8px 10px}
  .hud dl{grid-template-columns:repeat(4,auto);column-gap:10px;row-gap:2px}
  .hud dt{font-size:8.5px;letter-spacing:.12em}
  .hud dd{font-size:11px;text-align:left}
  .hud .spark,.hud .opt{display:none}
  .mass{width:40px;height:46px}
  .btn{min-width:44px;height:46px;padding:4px 4px}
  .preset{min-width:52px}
  .btn span{font-size:8.5px;letter-spacing:.08em}
  .hint{font-size:9px;letter-spacing:.08em;white-space:normal;text-align:center;width:calc(100vw - 40px);border-radius:12px}
  .trail{flex-direction:row;align-items:center;gap:12px;flex-basis:100%;padding:2px 12px 6px}
  .trail label{flex:none;gap:10px;min-width:92px}
  .trail input{flex:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.001ms!important}
}
</style>
</head>
<body>
<canvas id="space" aria-label="N-body gravity simulation. Drag to fling a body; scroll to zoom; right-drag to pan." role="img"></canvas>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="rgba(143,211,255,.55)" stroke-width="1" transform="rotate(-24 20 20)"/>
      <ellipse cx="20" cy="20" rx="11" ry="17" fill="none" stroke="rgba(255,179,107,.35)" stroke-width="1" transform="rotate(-24 20 20)"/>
      <circle cx="20" cy="20" r="4.2" fill="#ffd9a8"/>
      <circle cx="20" cy="20" r="7" fill="rgba(255,122,46,.25)"/>
      <circle cx="35.2" cy="13.3" r="1.8" fill="#8fd3ff"/>
    </svg>
    <div>
      <h1>ORBITAL</h1>
      <p>N-body gravity playground</p>
    </div>
  </div>
  <section class="hud" aria-label="Simulation readout">
    <dl>
      <dt>Bodies</dt><dd><span id="hBodies">0</span> <small id="hDust" class="opt"></small></dd>
      <dt>Energy</dt><dd id="hEnergy">0</dd>
      <dt>Speed</dt><dd><span class="state" id="hState"></span><span id="hSpeed">×1.00</span></dd>
      <dt>Zoom</dt><dd id="hZoom">1.00×</dd>
      <dt class="opt">Sim time</dt><dd class="opt" id="hTime">0.0</dd>
      <dt class="opt">ΔE drift</dt><dd class="opt" id="hDrift">0.000%</dd>
    </dl>
    <canvas class="spark" id="spark" aria-hidden="true"></canvas>
  </section>
</header>

<p class="hint" id="hint"><b>Drag</b> to fling a body · <b>tap</b> to drop it into orbit · <b>scroll / pinch</b> to zoom · <b>right-drag / two fingers</b> to pan</p>

<nav class="dock" id="dock" aria-label="Simulation controls">
  <div class="grp" role="radiogroup" aria-label="Mass of new bodies">
    <span class="glabel" aria-hidden="true">Mass</span>
    <button type="button" class="mass" role="radio" aria-checked="false" data-m="5" title="Pebble — mass 5" aria-label="Pebble, mass 5" style="--c:#7fc8ff"><i style="width:5px;height:5px"></i><span>5</span></button>
    <button type="button" class="mass" role="radio" aria-checked="false" data-m="40" title="Moon — mass 40" aria-label="Moon, mass 40" style="--c:#b7ddff"><i style="width:7px;height:7px"></i><span>40</span></button>
    <button type="button" class="mass" role="radio" aria-checked="true" data-m="250" title="Planet — mass 250" aria-label="Planet, mass 250" style="--c:#eef4ff"><i style="width:10px;height:10px"></i><span>250</span></button>
    <button type="button" class="mass" role="radio" aria-checked="false" data-m="1200" title="Star — mass 1200" aria-label="Star, mass 1200" style="--c:#ffd08a"><i style="width:13px;height:13px"></i><span>1.2k</span></button>
    <button type="button" class="mass" role="radio" aria-checked="false" data-m="5000" title="Giant — mass 5000" aria-label="Giant star, mass 5000" style="--c:#ff8a3d"><i style="width:17px;height:17px"></i><span>5k</span></button>
  </div>
  <div class="grp">
    <span class="glabel" aria-hidden="true">Scenes</span>
    <button type="button" class="btn preset" data-p="binary" aria-label="Binary star preset"><svg viewBox="0 0 22 18" aria-hidden="true"><circle cx="7" cy="9" r="3"/><circle cx="15" cy="9" r="3"/><ellipse cx="11" cy="9" rx="9.5" ry="6" stroke-dasharray="1.5 2.5"/></svg><span>Binary</span></button>
    <button type="button" class="btn preset" data-p="solar" aria-label="Solar system preset"><svg viewBox="0 0 22 18" aria-hidden="true"><circle cx="11" cy="9" r="2.6"/><circle cx="11" cy="9" r="5.5" stroke-dasharray="1.5 2"/><circle cx="11" cy="9" r="8.4" stroke-dasharray="1.5 2.5"/><circle cx="19.4" cy="9" r="1.2" fill="currentColor"/></svg><span>Solar</span></button>
    <button type="button" class="btn preset" data-p="eight" aria-label="Figure-eight three-body preset"><svg viewBox="0 0 22 18" aria-hidden="true"><path d="M11 9C8 4 3 4 3 9s5 5 8 0 8-5 8 0-5 5-8 0Z"/><circle cx="11" cy="9" r="1.4" fill="currentColor"/><circle cx="4.6" cy="6.4" r="1.2" fill="currentColor"/><circle cx="17.4" cy="11.6" r="1.2" fill="currentColor"/></svg><span>Figure-8</span></button>
    <button type="button" class="btn preset" data-p="galaxy" aria-label="Galaxy collision preset"><svg viewBox="0 0 22 18" aria-hidden="true"><path d="M6 9c0-3 3-4 4-2M6 9c0 3-3 4-4 2"/><circle cx="6" cy="9" r="1.2" fill="currentColor"/><path d="M16 9c0-3 3-4 4-2M16 9c0 3-3 4-4 2"/><circle cx="16" cy="9" r="1.2" fill="currentColor"/></svg><span>Galaxies</span></button>
  </div>
  <div class="grp">
    <span class="glabel" aria-hidden="true">Time</span>
    <button type="button" class="btn" id="bPause" aria-pressed="false" aria-label="Pause (Space)"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M6 4v10M12 4v10"/></svg><span>Pause</span></button>
    <button type="button" class="btn" id="bSlow" aria-pressed="false" aria-label="Slow motion (S)"><svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5"/><path d="M9 5v4l2.5 2"/></svg><span>Slow-mo</span></button>
    <button type="button" class="btn" id="bFollow" aria-pressed="false" aria-label="Follow the heaviest body (F)"><svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="2.5"/><path d="M9 1.5v3M9 13.5v3M1.5 9h3M13.5 9h3"/></svg><span>Follow</span></button>
    <button type="button" class="btn" id="bClear" aria-label="Clear all bodies (C)"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 5h11M7 5V3.5h4V5M5 5l.8 9.5h6.4L13 5"/></svg><span>Clear</span></button>
  </div>
  <div class="grp trail">
    <label for="trailIn"><span>Trail</span><output id="trailOut" for="trailIn">60%</output></label>
    <input type="range" id="trailIn" min="0" max="100" value="60" aria-label="Trail length">
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  /* ================= constants ================= */
  const G = 1;
  const DT = 0.25;          // fixed integrator step (sim time units)
  const TPS = 40;           // sim time units per real second at speed ×1
  const MAXT = 720;         // max trail samples per body
  const TMAX = 1400;        // max massless dust particles
  const MAXB = 220;         // max massive bodies
  const cv = document.getElementById('space');
  const ctx = cv.getContext('2d', { alpha: false });
  const rmq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  let reduce = rmq.matches;

  /* ================= state ================= */
  let W = 0, H = 0, dpr = 1;
  let eps2 = 16;
  const bodies = [];
  const tx = new Float32Array(TMAX), ty = new Float32Array(TMAX), tvx = new Float32Array(TMAX), tvy = new Float32Array(TMAX), tax = new Float32Array(TMAX), tay = new Float32Array(TMAX);
  const tcol = new Uint8Array(TMAX);
  let tN = 0;
  let simT = 0, acc = 0, sampleAcc = 0;
  let paused = false, slow = false, follow = false;
  let speedBase = reduce ? 0.4 : 1;
  let trailFrac = 0.6;
  let newMass = 250;
  let preset = 'galaxy';
  const cam = { x: 0, y: 0, z: 1, tx: 0, ty: 0, tz: 1 };
  let nextId = 1;
  let interacted = false;

  /* ================= colour by mass ================= */
  const STOPS = [
    [0.00, [127, 200, 255]],
    [0.30, [183, 221, 255]],
    [0.50, [238, 244, 255]],
    [0.70, [255, 226, 170]],
    [0.84, [255, 176, 96]],
    [1.00, [255, 118, 46]]
  ];
  function massT(m) { return Math.max(0, Math.min(1, Math.log10(Math.max(1, m)) / Math.log10(8000))); }
  function massColor(m) {
    const t = massT(m);
    for (let i = 1; i < STOPS.length; i++) {
      if (t <= STOPS[i][0]) {
        const a = STOPS[i - 1], b = STOPS[i];
        const f = (t - a[0]) / (b[0] - a[0]);
        return [a[1][0] + (b[1][0] - a[1][0]) * f, a[1][1] + (b[1][1] - a[1][1]) * f, a[1][2] + (b[1][2] - a[1][2]) * f];
      }
    }
    return STOPS[STOPS.length - 1][1].slice();
  }
  const radiusOf = m => 1.25 * Math.cbrt(m) + 1.2;

  function makeBody(x, y, vx, vy, m, tint) {
    const c = massColor(m);
    if (tint) { c[0] = c[0] * 0.4 + tint[0] * 0.6; c[1] = c[1] * 0.4 + tint[1] * 0.6; c[2] = c[2] * 0.4 + tint[2] * 0.6; }
    return { id: nextId++, x, y, vx, vy, ax: 0, ay: 0, nax: 0, nay: 0, m, r: radiusOf(m), c, trail: new Float32Array(MAXT * 2), th: 0, tn: 0, born: simT };
  }
  function addBody(b) { if (bodies.length >= MAXB) { say('Body limit reached'); return false; } bodies.push(b); refreshAcc(); return true; }

  /* ================= physics ================= */
  function computeAcc() {
    const n = bodies.length;
    for (let i = 0; i < n; i++) { bodies[i].nax = 0; bodies[i].nay = 0; }
    for (let i = 0; i < n; i++) {
      const a = bodies[i];
      for (let j = i + 1; j < n; j++) {
        const c = bodies[j];
        const dx = c.x - a.x, dy = c.y - a.y;
        const d2 = dx * dx + dy * dy + eps2;
        const inv = G / (d2 * Math.sqrt(d2));
        a.nax += c.m * dx * inv; a.nay += c.m * dy * inv;
        c.nax -= a.m * dx * inv; c.nay -= a.m * dy * inv;
      }
    }
  }
  function computeDustAcc() {
    const n = bodies.length;
    for (let k = 0; k < tN; k++) {
      let ax = 0, ay = 0;
      const x = tx[k], y = ty[k];
      for (let i = 0; i < n; i++) {
        const b = bodies[i];
        if (b.m < 20) continue;
        const dx = b.x - x, dy = b.y - y;
        const d2 = dx * dx + dy * dy + eps2;
        const inv = G * b.m / (d2 * Math.sqrt(d2));
        ax += dx * inv; ay += dy * inv;
      }
      tax[k] = ax; tay[k] = ay;
    }
  }
  function refreshAcc() {
    computeAcc();
    for (const b of bodies) { b.ax = b.nax; b.ay = b.nay; }
    computeDustAcc();
  }
  // one velocity-Verlet step
  function step(dt) {
    const n = bodies.length, h2 = 0.5 * dt * dt;
    for (let i = 0; i < n; i++) { const b = bodies[i]; b.x += b.vx * dt + b.ax * h2; b.y += b.vy * dt + b.ay * h2; }
    for (let k = 0; k < tN; k++) { tx[k] += tvx[k] * dt + tax[k] * h2; ty[k] += tvy[k] * dt + tay[k] * h2; }
    computeAcc();
    for (let i = 0; i < n; i++) {
      const b = bodies[i];
      b.vx += 0.5 * (b.ax + b.nax) * dt; b.vy += 0.5 * (b.ay + b.nay) * dt;
      b.ax = b.nax; b.ay = b.nay;
    }
    // dust: store old acc, compute new, kick
    const n2 = tN;
    for (let k = 0; k < n2; k++) { tvx[k] += 0.5 * tax[k] * dt; tvy[k] += 0.5 * tay[k] * dt; }
    computeDustAcc();
    for (let k = 0; k < n2; k++) { tvx[k] += 0.5 * tax[k] * dt; tvy[k] += 0.5 * tay[k] * dt; }
    simT += dt;
    collide();
  }
  function collide() {
    let merged = false;
    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        let a = bodies[i], c = bodies[j];
        const dx = c.x - a.x, dy = c.y - a.y;
        const rr = (a.r + c.r) * 0.82;
        if (dx * dx + dy * dy < rr * rr) {
          let keep = a, gone = c, gi = j;
          if (c.m > a.m) { keep = c; gone = a; gi = i; }
          const M = keep.m + gone.m;
          const rvx = gone.vx - keep.vx, rvy = gone.vy - keep.vy;
          const mu = keep.m * gone.m / M;
          const impact = 0.5 * mu * (rvx * rvx + rvy * rvy);
          const w = gone.m / M;
          const fx = keep.x + (gone.x - keep.x) * (keep.r / (keep.r + gone.r));
          const fy = keep.y + (gone.y - keep.y) * (keep.r / (keep.r + gone.r));

  function predict() {
    const v = aimVelocity();
    const key = aim.wx.toFixed(1) + ',' + aim.wy.toFixed(1) + ',' + v[0].toFixed(3) + ',' + v[1].toFixed(3) + ',' + bodies.length + ',' + newMass + ',' + (paused ? simT : Math.round(simT));
    if (key === predKey) return;
    predKey = key;
    const n = bodies.length;
    const moving = n <= 40;
    for (let i = 0; i < n; i++) { const b = bodies[i]; px[i] = b.x; py[i] = b.y; pvx[i] = b.vx; pvy[i] = b.vy; pm[i] = b.m; pr[i] = b.r; }
    px[n] = aim.wx; py[n] = aim.wy; pvx[n] = v[0]; pvy[n] = v[1]; pm[n] = newMass; pr[n] = radiusOf(newMass);
    const N = n + 1;
    const accs = () => {
      for (let i = 0; i < N; i++) { pax[i] = 0; pay[i] = 0; }
      for (let i = 0; i < N; i++) {
        if (!moving && i !== n) continue;
        for (let j = 0; j < N; j++) {
          if (i === j) continue;
          const dx = px[j] - px[i], dy = py[j] - py[i];
          const d2 = dx * dx + dy * dy + eps2;
          const inv = G * pm[j] / (d2 * Math.sqrt(d2));
          pax[i] += dx * inv; pay[i] += dy * inv;
        }
      }
    };
    accs();
    predN = 0; predHit = false;
    pred[0] = px[n]; pred[1] = py[n]; predN = 1;
    const h2 = 0.5 * PDT * PDT;
    for (let s = 1; s <= PSTEPS; s++) {
      for (let i = 0; i < N; i++) { if (!moving && i !== n) continue; px[i] += pvx[i] * PDT + pax[i] * h2; py[i] += pvy[i] * PDT + pay[i] * h2; pvx[i] += 0.5 * pax[i] * PDT; pvy[i] += 0.5 * pay[i] * PDT; }
      accs();
      for (let i = 0; i < N; i++) { if (!moving && i !== n) continue; pvx[i] += 0.5 * pax[i] * PDT; pvy[i] += 0.5 * pay[i] * PDT; }
      let hit = false;
      for (let j = 0; j < n; j++) {
        const dx = px[j] - px[n], dy = py[j] - py[n];
        const rr = (pr[j] + pr[n]) * 0.82;
        if (dx * dx + dy * dy < rr * rr) { hit = true; break; }
      }
      if (s % 4 === 0 || hit) { pred[predN * 2] = px[n]; pred[predN * 2 + 1] = py[n]; predN++; }
      if (hit) { predHit = true; break; }
    }
  }
  function drawAim() {
    if (!aim.on) return;
    predict();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    const c = massColor(newMass);
    // predicted path: fading dots
    for (let i = 1; i < predN; i++) {
      const sx = toSX(pred[i * 2]), sy = toSY(pred[i * 2 + 1]);
      const a = 0.85 * (1 - i / (PSTEPS / 4 + 2));
      ctx.fillStyle = rgba(c, a);
      ctx.beginPath(); ctx.arc(sx, sy, i % 5 === 0 ? 1.6 : 1.05, 0, Math.PI * 2); ctx.fill();
    }
    if (predHit && predN > 1) {
      const sx = toSX(pred[(predN - 1) * 2]), sy = toSY(pred[(predN - 1) * 2 + 1]);
      ctx.strokeStyle = 'rgba(255,140,90,.95)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(sx - 5, sy - 5); ctx.lineTo(sx + 5, sy + 5); ctx.moveTo(sx + 5, sy - 5); ctx.lineTo(sx - 5, sy + 5); ctx.stroke();
      ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2); ctx.stroke();
    }
    // aiming line (dotted) with arrow
    const x0 = toSX(aim.wx), y0 = toSY(aim.wy);
    const dx = aim.sx1 - aim.sx0, dy = aim.sy1 - aim.sy0;
    const len = Math.hypot(dx, dy);
    ctx.strokeStyle = 'rgba(223,230,245,.8)'; ctx.lineWidth = 1.2;
    ctx.setLineDash([2, 5]);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + dx, y0 + dy); ctx.stroke();
    ctx.setLineDash([]);
    if (len > 8) {
      const ux = dx / len, uy = dy / len;
      const hx = x0 + dx, hy = y0 + dy;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - ux * 9 - uy * 5, hy - uy * 9 + ux * 5); ctx.moveTo(hx, hy); ctx.lineTo(hx - ux * 9 + uy * 5, hy - uy * 9 - ux * 5); ctx.stroke();
      const v = aimVelocity();
      ctx.font = '10.5px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillStyle = 'rgba(223,230,245,.85)';
      ctx.fillText('v ' + Math.hypot(v[0], v[1]).toFixed(2), hx + 12, hy - 10);
    }
    // ghost body
    const sr = Math.max(2, radiusOf(newMass) * cam.z);
    ctx.strokeStyle = rgba(c, 0.9); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(x0, y0, sr, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = rgba(c, 0.25);
    ctx.fill();
  }

  /* ================= input ================= */
  const pointers = new Map();
  let pan = null, pinch = null;
  function worldAt(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    const [sx, sy] = worldAt(e);
    pointers.set(e.pointerId, { x: sx, y: sy });
    Sound.wake();
    if (pointers.size === 2) {
      // two fingers: cancel aim, start pinch/pan
      aim.on = false;
      const ps = [...pointers.values()];
      const mx = (ps[0].x + ps[1].x) / 2, my = (ps[0].y + ps[1].y) / 2;
      pinch = { d: Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y), z: cam.z, wx: toWX(mx), wy: toWY(my) };
      follow = false; syncButtons();
      return;
    }
    if (e.button === 2 || e.button === 1 || (e.button === 0 && e.shiftKey)) {
      pan = { id: e.pointerId, sx, sy, cx: cam.x, cy: cam.y };
      cv.classList.add('panning');
      follow = false; syncButtons();
      return;
    }
    if (e.button === 0) {
      aim.on = true; aim.id = e.pointerId; aim.moved = false;
      aim.sx0 = aim.sx1 = sx; aim.sy0 = aim.sy1 = sy;
      aim.wx = toWX(sx); aim.wy = toWY(sy);
      predKey = '';
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const [sx, sy] = worldAt(e);
    pointers.set(e.pointerId, { x: sx, y: sy });
    if (pinch && pointers.size >= 2) {
      const ps = [...pointers.values()];
      const mx = (ps[0].x + ps[1].x) / 2, my = (ps[0].y + ps[1].y) / 2;
      const d = Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y);
      const z = clampZ(pinch.z * d / Math.max(1, pinch.d));
      cam.z = cam.tz = z;
      cam.x = cam.tx = pinch.wx - (mx - W / 2) / z;
      cam.y = cam.ty = pinch.wy - (my - H / 2) / z;
      return;
    }
    if (pan && pan.id === e.pointerId) {
      cam.x = cam.tx = pan.cx - (sx - pan.sx) / cam.z;
      cam.y = cam.ty = pan.cy - (sy - pan.sy) / cam.z;
      return;
    }
    if (aim.on && aim.id === e.pointerId) {
      aim.sx1 = sx; aim.sy1 = sy;
      if (Math.hypot(sx - aim.sx0, sy - aim.sy0) > 6) aim.moved = true;
    }
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pinch) { if (pointers.size < 2) pinch = null; return; }
    if (pan && pan.id === e.pointerId) { pan = null; cv.classList.remove('panning'); return; }
    if (aim.on && aim.id === e.pointerId) {
      aim.on = false;
      if (e.type === 'pointercancel') return;
      launch();
    }
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  function clampZ(z) { return Math.max(0.08, Math.min(6, z)); }
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const [sx, sy] = worldAt(e);
    const wx = toWX(sx), wy = toWY(sy);
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    const z = clampZ(cam.z * Math.exp(-dy * 0.0015));
    cam.z = cam.tz = z;
    if (!follow) {
      cam.x = cam.tx = wx - (sx - W / 2) / z;
      cam.y = cam.ty = wy - (sy - H / 2) / z;
    }
  }, { passive: false });

  function launch() {
    let vx, vy;
    if (aim.moved) {
      [vx, vy] = aimVelocity();
    } else {
      // a tap drops the body into a circular orbit around the strongest attractor
      let best = null, bestF = 0;
      for (const b of bodies) {
        const d2 = (b.x - aim.wx) ** 2 + (b.y - aim.wy) ** 2 + eps2;
        const f = b.m / d2;
        if (f > bestF) { bestF = f; best = b; }
      }
      vx = 0; vy = 0;
      if (best) {
        const dx = aim.wx - best.x, dy = aim.wy - best.y;
        const d = Math.hypot(dx, dy);
        if (d < best.r + radiusOf(newMass)) { say('Too close — it would merge'); return; }
        const v = Math.sqrt(G * (best.m + newMass) / d);
        // spin the same way as the attractor's existing companions
        let L = 0;
        for (const b of bodies) if (b !== best) L += (b.x - best.x) * (b.vy - best.vy) - (b.y - best.y) * (b.vx - best.vx);
        const dir = L < 0 ? -1 : 1;
        vx = best.vx - dy / d * v * dir;
        vy = best.vy + dx / d * v * dir;
      }
    }
    const b = makeBody(aim.wx, aim.wy, vx, vy, newMass);
    if (addBody(b)) { Sound.launch(newMass); dismissHint(); }
  }

  /* ================= controls ================= */
  const $ = id => document.getElementById(id);
  const bPause = $('bPause'), bSlow = $('bSlow'), bFollow = $('bFollow');
  const trailIn = $('trailIn'), trailOut = $('trailOut');
  function syncButtons() {
    bPause.setAttribute('aria-pressed', String(paused));
    bPause.querySelector('span').textContent = paused ? 'Play' : 'Pause';
    bPause.querySelector('svg').innerHTML = paused ? '<path d="M6 4l8 5-8 5Z"/>' : '<path d="M6 4v10M12 4v10"/>';
    bSlow.setAttribute('aria-pressed', String(slow));
    bFollow.setAttribute('aria-pressed', String(follow));
    $('hState').classList.toggle('paused', paused);
  }
  function setTrail(f) {
    trailFrac = Math.max(0, Math.min(1, f));
    trailIn.value = String(Math.round(trailFrac * 100));
    trailOut.textContent = Math.round(trailFrac * 100) + '%';
    trailIn.style.setProperty('--p', Math.round(trailFrac * 100) + '%');
  }
  trailIn.addEventListener('input', () => setTrail(trailIn.value / 100));
  bPause.addEventListener('click', () => { paused = !paused; syncButtons(); });
  bSlow.addEventListener('click', () => { slow = !slow; syncButtons(); });
  bFollow.addEventListener('click', () => { follow = !follow; syncButtons(); say(follow ? 'Following the heaviest body' : 'Free camera'); });
  $('bClear').addEventListener('click', () => { clearAll(); say('Cleared — drag to add bodies'); });
  document.querySelectorAll('.preset').forEach(b => b.addEventListener('click', () => { loadPreset(b.dataset.p); Sound.wake(); say(b.querySelector('span').textContent); }));
  const massBtns = [...document.querySelectorAll('.mass')];
  function setMass(btn) {
    massBtns.forEach(b => { const on = b === btn; b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; });
    newMass = +btn.dataset.m;
  }
  massBtns.forEach((b, i) => {
    b.addEventListener('click', () => setMass(b));
    b.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        const d = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1;
        const nb = massBtns[(i + d + massBtns.length) % massBtns.length];
        setMass(nb); nb.focus();
      }
    });
  });
  setMass(massBtns[2]);
  document.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT')) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (k === ' ' && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); paused = !paused; syncButtons(); }
    else if (k === 's' || k === 'S') { slow = !slow; syncButtons(); }
    else if (k === 'f' || k === 'F') { follow = !follow; syncButtons(); }
    else if (k === 'c' || k === 'C') clearAll();
    else if (k === '1') loadPreset('binary');
    else if (k === '2') loadPreset('solar');
    else if (k === '3') loadPreset('eight');
    else if (k === '4') loadPreset('galaxy');
    else if (k === '[') setTrail(trailFrac - 0.1);
    else if (k === ']') setTrail(trailFrac + 0.1);
    else if (k === '=' || k === '+') cam.tz = clampZ(cam.tz * 1.25);
    else if (k === '-' || k === '_') cam.tz = clampZ(cam.tz / 1.25);
    else if (k === 'ArrowLeft') { cam.tx -= 60 / cam.z; follow = false; syncButtons(); }
    else if (k === 'ArrowRight') { cam.tx += 60 / cam.z; follow = false; syncButtons(); }
    else if (k === 'ArrowUp') { cam.ty -= 60 / cam.z; follow = false; syncButtons(); }
    else if (k === 'ArrowDown') { cam.ty += 60 / cam.z; follow = false; syncButtons(); }
  });
  const hint = $('hint');
  function dismissHint() { if (!interacted) { interacted = true; hint.classList.add('gone'); } }
  const toastEl = $('toast');
  let toastT = 0;
  function say(m) { toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 1600); }

  /* ================= sound (optional, tiny) ================= */
  const Sound = (() => {
    let ac = null, out = null;
    let muted = true;
    return {
      wake() {},
      setMuted(v) {
        muted = v;
        if (!v && !ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC(); out = ac.createGain(); out.gain.value = 0.5; out.connect(ac.destination);
        }
        if (ac && !v && ac.state === 'suspended') ac.resume();
      },
      get muted() { return muted; },
      boom(s) {
        if (muted || !ac) return;
        const now = ac.currentTime;
        const o = ac.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(120 + s * 60, now); o.frequency.exponentialRampToValueAtTime(34, now + 0.9);
        const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.35 * (0.4 + s), now + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
        o.connect(g); g.connect(out); o.start(now); o.stop(now + 1.2);
      },
      launch(m) {
        if (muted || !ac) return;
        const now = ac.currentTime;
        const f = 900 / Math.cbrt(m / 5);
        const o = ac.createOscillator(); o.type = 'triangle';
        o.frequency.setValueAtTime(f, now); o.frequency.exponentialRampToValueAtTime(f * 1.9, now + 0.12);
        const g = ac.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.12, now + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
        o.connect(g); g.connect(out); o.start(now); o.stop(now + 0.3);
      }
    };
  })();
  // sound toggle lives in the HUD
  (function addSoundToggle() {
    const grp = document.querySelector('.dock .grp:nth-child(3)');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn'; b.id = 'bSound';
    b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', 'Sound effects (M)');
    b.innerHTML = '<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M3 7h3l4-3v10l-4-3H3Z"/><path class="w" d="M13 6.5c1 1.4 1 3.6 0 5M12.5 3.5c2.6 2.6 2.6 8.4 0 11" opacity=".35"/></svg><span>Sound</span>';
    grp.appendChild(b);
    const sync = () => { b.setAttribute('aria-pressed', String(!Sound.muted)); b.querySelector('.w').setAttribute('opacity', Sound.muted ? '.35' : '1'); };
    b.addEventListener('click', () => { Sound.setMuted(!Sound.muted); sync(); say(Sound.muted ? 'Sound off' : 'Sound on'); });
    document.addEventListener('keydown', e => { if ((e.key === 'm' || e.key === 'M') && !(e.target && e.target.tagName === 'INPUT')) { Sound.setMuted(!Sound.muted); sync(); } });
  })();

  /* ================= HUD ================= */
  const hBodies = $('hBodies'), hDust = $('hDust'), hEnergy = $('hEnergy'), hSpeed = $('hSpeed'), hZoom = $('hZoom'), hTime = $('hTime'), hDrift = $('hDrift');
  const spark = $('spark'), sctx = spark.getContext('2d');
  const EH = new Float32Array(90); let ehN = 0, E0 = null, lastCount = -1;
  function resetDrift() { ehN = 0; E0 = null; lastCount = -1; }
  function fmtE(e) {
    if (!isFinite(e) || e === 0) return '0';
    const s = e.toExponential(3).replace('e+', 'e');
    return s.replace('-', '−');
  }
  let hudT = 0;
  function hud(now) {
    if (now - hudT < 180) return;
    hudT = now;
    hBodies.textContent = String(bodies.length).padStart(3, '0');
    hDust.textContent = tN ? '+ ' + tN + ' dust' : '';
    const E = energy();
    hEnergy.textContent = fmtE(E);
    const sp = paused ? 0 : speedBase * (slow ? 0.25 : 1);
    hSpeed.textContent = paused ? 'paused' : '×' + sp.toFixed(2);
    hZoom.textContent = cam.z.toFixed(2) + '×';
    hTime.textContent = simT.toFixed(1);
    if (bodies.length !== lastCount) { E0 = E; lastCount = bodies.length; ehN = 0; }
    const drift = E0 ? (E - E0) / Math.abs(E0) : 0;
    hDrift.textContent = (drift >= 0 ? '+' : '−') + Math.abs(drift * 100).toFixed(3) + '%';
    if (ehN < EH.length) EH[ehN++] = drift; else { EH.copyWithin(0, 1); EH[EH.length - 1] = drift; }
    // sparkline
    const w = spark.clientWidth, h = spark.clientHeight;
    if (!w) return;
    const sd = Math.min(2, dpr);
    if (spark.width !== Math.round(w * sd)) { spark.width = Math.round(w * sd); spark.height = Math.round(h * sd); }
    sctx.setTransform(sd, 0, 0, sd, 0, 0);
    sctx.clearRect(0, 0, w, h);
    sctx.strokeStyle = 'rgba(150,180,255,.18)'; sctx.lineWidth = 1;
    sctx.beginPath(); sctx.moveTo(0, h / 2 + 3); sctx.lineTo(w, h / 2 + 3); sctx.stroke();
    if (ehN > 1) {
      let mx = 1e-6;
      for (let i = 0; i < ehN; i++) mx = Math.max(mx, Math.abs(EH[i]));
      sctx.strokeStyle = '#8fd3ff'; sctx.lineWidth = 1.2;
      sctx.beginPath();
      for (let i = 0; i < ehN; i++) {
        const x = i / (EH.length - 1) * w, y = h / 2 + 3 - (EH[i] / mx) * (h / 2 - 5);
        if (i) sctx.lineTo(x, y); else sctx.moveTo(x, y);
      }
      sctx.stroke();
    }
  }

  /* ================= loop ================= */
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    document.documentElement.style.setProperty('--dockH', dockH() + 'px');
  }
  window.addEventListener('resize', resize);

  let last = performance.now(), raf = 0, running = false;
  function sampleTrails() {
    for (const b of bodies) {
      b.trail[b.th * 2] = b.x; b.trail[b.th * 2 + 1] = b.y;
      b.th = (b.th + 1) % MAXT;
      if (b.tn < MAXT) b.tn++;
    }
  }
  function advance(simDt) {
    acc += simDt;
    let steps = 0;
    const cap = bodies.length > 120 ? 6 : 14;
    while (acc >= DT && steps < cap) {
      step(DT); acc -= DT; steps++;
      sampleAcc += DT;
      if (sampleAcc >= 1) { sampleAcc -= 1; sampleTrails(); }
    }
    if (steps >= cap) acc = 0;
  }
  function frame(now) {
    if (!running) return;
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) advance(dt * TPS * speedBase * (slow ? 0.25 : 1));
    // camera
    if (follow && bodies.length) {
      let hb = bodies[0];
      for (const b of bodies) if (b.m > hb.m) hb = b;
      cam.tx = hb.x; cam.ty = hb.y;
    }
    const k = reduce ? 1 : Math.min(1, dt * 6);
    cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k;
    cam.z += (cam.tz - cam.z) * Math.min(1, dt * 8);
    drawBackdrop(now);
    drawTrails();
    drawDust();
    drawBodies(now);
    drawFlashes(paused ? 0 : dt * (slow ? 0.35 : 1));
    drawAim();
    hud(now);
  }
  function start() { if (running) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { running = false; cancelAnimationFrame(raf); }
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });
  const onMQ = () => { reduce = rmq.matches; speedBase = reduce ? 0.4 : 1; };
  if (rmq.addEventListener) rmq.addEventListener('change', onMQ); else if (rmq.addListener) rmq.addListener(onMQ);

  /* ================= boot ================= */
  resize();
  buildNebula();
  loadPreset('galaxy', true);
  // pre-roll so the first frame already has trails and a living disk
  for (let i = 0; i < 200; i++) { step(DT); sampleAcc += DT; if (sampleAcc >= 1) { sampleAcc -= 1; sampleTrails(); } }
  syncButtons();
  start();
})();
</script>
</body>
</html>
