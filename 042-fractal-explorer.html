<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinite Coastline — Mandelbrot &amp; Julia Explorer</title>
<meta name="description" content="Explore the Mandelbrot set and its Julia sets: smooth colouring, progressive multi-threaded rendering, animated zoom, a live Julia lens under the cursor, famous bookmarks, cyclic palettes and PNG export.">
<meta name="theme-color" content="#050506">
<style>
:root{
  --gold:#d8b76e;
  --gold2:#f4e2b0;
  --goldl:rgba(216,183,110,.34);
  --goldf:rgba(216,183,110,.12);
  --panel:rgba(6,6,8,.84);
  --thin:"Helvetica Neue","Segoe UI","Avenir Next",Cantarell,"URW Gothic","Nimbus Sans",Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Ubuntu Mono","DejaVu Sans Mono",monospace;
  --serif:"Didot","Bodoni 72","Iowan Old Style",Palatino,P052,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--gold);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--thin);font-weight:300;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#frac{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:zoom-in;touch-action:none;outline:none}
#frac.grab{cursor:grabbing}
#frac:focus-visible{outline:1px solid var(--gold);outline-offset:-6px}
.veil{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 48% 30% at 0% 0%,rgba(0,0,0,.82),rgba(0,0,0,.45) 55%,rgba(0,0,0,0) 100%),
  radial-gradient(ellipse 50% 40% at 100% 0%,rgba(0,0,0,.5),rgba(0,0,0,0) 70%),
  radial-gradient(ellipse 60% 45% at 0% 100%,rgba(0,0,0,.55),rgba(0,0,0,0) 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%,rgba(0,0,0,.55),rgba(0,0,0,0) 70%)}

/* ---- brand ---- */
.brand{position:fixed;left:30px;top:26px;pointer-events:none;z-index:3}
.brand h1{margin:0;font:200 25px/1.1 var(--thin);letter-spacing:.44em;text-transform:uppercase;color:var(--gold2);text-shadow:0 1px 16px #000,0 0 2px rgba(0,0,0,.8)}
.brand h1 span{display:block;font:italic 400 13px/1 var(--serif);letter-spacing:.12em;text-transform:none;color:var(--gold);margin-bottom:10px}
.brand .rule{display:block;width:200px;height:1px;margin:14px 0 0;background:linear-gradient(90deg,var(--gold),rgba(216,183,110,0))}
.brand p{margin:12px 0 0;font:300 11px/1 var(--thin);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 10px #000}

/* ---- panels ---- */
.panel{background:linear-gradient(160deg,rgba(16,13,9,.86),var(--panel));border:1px solid var(--goldl);box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(244,226,176,.06);position:relative}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--gold);pointer-events:none}
.panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.ptitle{margin:0 0 10px;font:400 9.5px/1 var(--thin);letter-spacing:.38em;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.ptitle i{font-style:normal;color:var(--gold2);letter-spacing:.2em}

.hud{position:fixed;right:24px;top:22px;width:278px;padding:16px 18px 14px;z-index:3}
.hud dl{margin:0;display:grid;grid-template-columns:74px 1fr;row-gap:8px;align-items:baseline}
.hud dt{font:400 9.5px/1 var(--thin);letter-spacing:.3em;text-transform:uppercase;color:rgba(216,183,110,.7)}
.hud dd{margin:0;font:300 13px/1.2 var(--mono);color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.prog{margin-top:12px;height:1px;background:var(--goldf);position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transform-origin:0 50%;transform:scaleX(0);transition:transform .15s linear}
.pstat{margin:8px 0 0;font:300 10.5px/1.3 var(--thin);letter-spacing:.14em;color:rgba(216,183,110,.75);display:flex;justify-content:space-between}

/* ---- bookmarks ---- */
.marks{position:fixed;left:24px;bottom:24px;width:268px;padding:16px 14px 10px;z-index:3}
.marks ul{list-style:none;margin:0;padding:0}
.mk{width:100%;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:7px 6px;margin:0;border:0;border-top:1px solid rgba(216,183,110,.1);background:none;text-align:left;cursor:pointer;transition:background .25s}
.marks li:first-child .mk{border-top:0}
.mk canvas{width:64px;height:40px;display:block;border:1px solid rgba(216,183,110,.28);background:#0b0a08;transition:border-color .25s}
.mk b{display:block;font:300 13.5px/1.2 var(--thin);letter-spacing:.06em;color:var(--gold2)}
.mk small{display:block;margin-top:4px;font:300 10px/1.2 var(--mono);color:rgba(216,183,110,.66);white-space:nowrap}
.mk:hover{background:rgba(216,183,110,.07)}
.mk:hover canvas{border-color:var(--gold)}
.mk:focus-visible{outline:1px solid var(--gold);outline-offset:1px}
.mk kbd{float:right;font:300 9px/1 var(--mono);color:rgba(216,183,110,.55);border:1px solid rgba(216,183,110,.3);padding:2px 4px;margin-top:1px}

/* ---- toolbar ---- */
.tools{position:fixed;right:24px;bottom:24px;display:flex;align-items:center;gap:6px;padding:10px;z-index:3}
.tb{width:40px;height:40px;display:grid;place-items:center;border:1px solid transparent;background:none;cursor:pointer;color:var(--gold);transition:background .2s,border-color .2s,color .2s;position:relative}
.tb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:rgba(216,183,110,.08);border-color:var(--goldl);color:var(--gold2)}
.tb:focus-visible{outline:1px solid var(--gold2);outline-offset:2px}
.tb[aria-pressed="true"]{border-color:var(--gold);background:rgba(216,183,110,.12);color:var(--gold2)}
.tb .jl{font:200 17px/1 var(--serif);font-style:italic}
.sep{width:1px;height:26px;background:var(--goldl);margin:0 4px}
.pals{display:flex;gap:7px;padding:0 4px}
.sw{width:24px;height:24px;border-radius:50%;border:1px solid rgba(216,183,110,.35);cursor:pointer;padding:0;transition:transform .2s,box-shadow .2s}
.sw:hover{transform:scale(1.12)}
.sw[aria-checked="true"]{box-shadow:0 0 0 2px #050506,0 0 0 3px var(--gold2)}
.sw:focus-visible{outline:1px solid var(--gold2);outline-offset:4px}
.sw.aurum{background:conic-gradient(#000,#123a8c,#c8922e,#fffbef,#000)}
.sw.abyss{background:conic-gradient(#01061a,#08306b,#0fb5d4,#dffcff,#01061a)}
.sw.magma{background:conic-gradient(#000004,#721f81,#f1605d,#fcfdbf,#000004)}
.sw.pastel{background:conic-gradient(#fbd3e0,#d9c6ff,#bfe3ff,#c6f5e0,#fff0bd,#fbd3e0)}
.tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translate(-50%,4px);padding:6px 9px;font:300 10px/1 var(--thin);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;color:var(--gold2);background:rgba(6,6,8,.9);border:1px solid var(--goldl);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.tb:hover .tip,.tb:focus-visible .tip{opacity:1;transform:translate(-50%,0)}
.palname{min-width:58px;font:300 10px/1 var(--thin);letter-spacing:.24em;text-transform:uppercase;color:var(--gold2)}

/* ---- julia lens ---- */
.lens{position:fixed;left:0;top:0;width:184px;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s;will-change:transform}
.lens.on{opacity:1}
.lens .ring{width:184px;height:184px;border-radius:50%;overflow:hidden;border:1px solid var(--gold);box-shadow:0 0 0 4px rgba(0,0,0,.55),0 0 0 5px var(--goldl),0 18px 40px rgba(0,0,0,.6);background:#000}
.lens canvas{width:100%;height:100%;display:block}
.lens p{margin:10px auto 0;width:max-content;max-width:100%;padding:7px 10px 6px;text-align:center;font:300 10px/1.35 var(--mono);color:var(--gold2);background:rgba(6,6,8,.8);border:1px solid var(--goldl)}
.lens p b{display:block;font:400 9px/1 var(--thin);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}

.hint{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);margin:0;padding:10px 18px;z-index:3;font:300 11px/1.4 var(--thin);letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);background:rgba(6,6,8,.72);border:1px solid var(--goldl);white-space:nowrap;transition:opacity .8s;pointer-events:none}
.hint.gone{opacity:0}
.hint em{font-style:normal;color:var(--gold)}
.toast{position:fixed;left:50%;top:26px;transform:translate(-50%,-8px);margin:0;padding:9px 16px;z-index:5;font:300 11px/1 var(--thin);letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);background:rgba(6,6,8,.85);border:1px solid var(--goldl);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:1100px){
  .marks{width:236px}
  .mk{grid-template-columns:52px 1fr}
  .mk canvas{width:52px;height:34px}
}
@media (max-width:760px){
  .brand{left:16px;top:14px}
  .brand h1{font-size:16px;letter-spacing:.34em}
  .brand h1 span{font-size:11px;margin-bottom:6px}
  .brand .rule{width:130px;margin-top:9px}
  .brand p{display:none}
  .hud{left:12px;right:12px;top:auto;bottom:172px;width:auto;padding:9px 12px 8px}
  .hud .ptitle{display:none}
  .hud dl{grid-template-columns:repeat(4,auto);column-gap:10px;row-gap:5px}
  #hCdt,#hC{display:none}
  .hud dt{font-size:8px;letter-spacing:.2em;grid-row:1}
  .hud dd{font-size:11px;grid-row:2}
  .prog{margin-top:8px}
  .pstat{display:none}
  .marks{left:0;right:0;bottom:74px;width:auto;padding:0 12px;background:none;border:0;box-shadow:none}
  .marks::before,.marks::after,.marks .ptitle{display:none}
  .marks ul{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
  .marks ul::-webkit-scrollbar{display:none}
  .marks li{flex:none}
  .mk{grid-template-columns:40px auto;gap:8px;padding:6px 10px 6px 6px;border:1px solid var(--goldl)!important;background:rgba(6,6,8,.75)}
  .mk canvas{width:40px;height:26px}
  .mk b{font-size:12px}
  .mk small,.mk kbd{display:none}
  .tools{left:12px;right:12px;bottom:12px;justify-content:space-between;padding:6px 8px;gap:2px}
  .palname,.tip{display:none}
  .sep{margin:0 1px}
  .pals{gap:6px;padding:0 2px}
  .sw{width:22px;height:22px}
  .tb{width:36px;height:38px}
  .lens{width:112px}
  .lens .ring{width:112px;height:112px}
  .lens p{font-size:9px;margin-top:6px;padding:5px 7px}
  .lens p b{letter-spacing:.18em;margin:0}
  #lensC{display:none}
  .hint{bottom:236px;font-size:9.5px;letter-spacing:.12em;padding:8px 12px;white-space:normal;width:calc(100vw - 32px);text-align:center}
}
@media (max-width:380px){
  .sw{width:19px;height:19px}
  .pals{gap:4px}
  .tb{width:32px}
}
@media (prefers-reduced-motion:reduce){
  .lens,.hint,.toast,.prog i{transition:none}
}
</style>
</head>
<body>
<main>
  <canvas id="frac" tabindex="0" role="img" aria-label="Rendered view of the Mandelbrot set. Click to zoom in, right-click to zoom out, drag to pan, scroll to zoom, arrow keys to pan, plus and minus keys to zoom."></canvas>
  <div class="veil" aria-hidden="true"></div>

  <header class="brand">
    <h1><span>an explorer of the</span>Infinite Coastline</h1>
    <i class="rule"></i>
    <p>Mandelbrot &amp; Julia Explorer</p>
  </header>

  <section class="hud panel" aria-label="View readout">
    <p class="ptitle">Position <i id="modeLbl">Mandelbrot</i></p>
    <dl>
      <dt>Real</dt><dd id="hRe">−0.600000</dd>

    <ul>
      <li><button type="button" class="mk" data-mark="0"><canvas width="64" height="40" aria-hidden="true"></canvas><span><kbd>1</kbd><b>Seahorse Valley</b><small>−0.7436 + 0.1318 i</small></span></button></li>
      <li><button type="button" class="mk" data-mark="1"><canvas width="64" height="40" aria-hidden="true"></canvas><span><kbd>2</kbd><b>Elephant Valley</b><small>+0.2855 + 0.0116 i</small></span></button></li>
      <li><button type="button" class="mk" data-mark="2"><canvas width="64" height="40" aria-hidden="true"></canvas><span><kbd>3</kbd><b>Triple Spiral Valley</b><small>−0.0810 + 0.6575 i</small></span></button></li>
      <li><button type="button" class="mk" data-mark="3"><canvas width="64" height="40" aria-hidden="true"></canvas><span><kbd>4</kbd><b>Mini-brot</b><small>−1.7549 + 0.0000 i</small></span></button></li>
      <li><button type="button" class="mk" data-mark="4"><canvas width="64" height="40" aria-hidden="true"></canvas><span><kbd>5</kbd><b>Whole set</b><small>home view</small></span></button></li>
    </ul>
  </nav>

  <div class="tools panel" role="toolbar" aria-label="Explorer controls">
    <button type="button" class="tb" id="bOut" aria-label="Zoom out"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="6"/><path d="M13,13 L18,18 M5.5,8.5 H11.5"/></svg><span class="tip">Zoom out</span></button>
    <button type="button" class="tb" id="bIn" aria-label="Zoom in"><svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="6"/><path d="M13,13 L18,18 M5.5,8.5 H11.5 M8.5,5.5 V11.5"/></svg><span class="tip">Zoom in</span></button>
    <button type="button" class="tb" id="bHome" aria-label="Reset to whole set"><svg viewBox="0 0 20 20"><path d="M3,10 A7,7 0 1 0 5.2,4.9 M3,3.5 V7.5 H7"/></svg><span class="tip">Reset</span></button>
    <span class="sep" aria-hidden="true"></span>
    <div class="pals" role="radiogroup" aria-label="Palette">
      <button type="button" class="sw aurum" role="radio" aria-checked="true" data-pal="aurum" aria-label="Aurum palette"></button>
      <button type="button" class="sw abyss" role="radio" aria-checked="false" data-pal="abyss" aria-label="Abyss palette"></button>
      <button type="button" class="sw magma" role="radio" aria-checked="false" data-pal="magma" aria-label="Magma palette"></button>
      <button type="button" class="sw pastel" role="radio" aria-checked="false" data-pal="pastel" aria-label="Pastel Dream palette"></button>
    </div>
    <span class="palname" id="palName" aria-hidden="true">Aurum</span>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="tb" id="bCycle" aria-pressed="false" aria-label="Palette cycling"><svg viewBox="0 0 20 20"><path d="M16,7 A6.5,6.5 0 0 0 4.2,6 M4,13 A6.5,6.5 0 0 0 15.8,14 M16.2,3 V7.2 H12 M3.8,17 V12.8 H8"/></svg><span class="tip">Cycle colours</span></button>
    <button type="button" class="tb" id="bJulia" aria-pressed="false" aria-label="Toggle Julia view (J)"><span class="jl">J</span><span class="tip">Julia view</span></button>
    <button type="button" class="tb" id="bSave" aria-label="Download PNG"><svg viewBox="0 0 20 20"><path d="M10,3 V13 M6,9.5 L10,13.5 L14,9.5 M4,16.5 H16"/></svg><span class="tip">Save PNG</span></button>
  </div>

  <div class="lens" id="lens" aria-hidden="true">
    <div class="ring"><canvas id="lensCv" width="160" height="160"></canvas></div>
    <p><b id="lensTitle">Julia set · press J</b><span id="lensC">c = 0</span></p>
  </div>

  <p class="hint" id="hint"><em>Click</em> dive · <em>Right-click</em> rise · <em>Drag</em> pan · <em>Wheel</em> zoom · <em>J</em> Julia</p>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <p class="sr" id="live" aria-live="polite"></p>
</main>

/* ======================================================================

   ====================================================================== */
function computeTile(j) {
  var step = j.step, cols = Math.ceil(j.w / step), rows = Math.ceil(j.h / step);
  var out = new Float32Array(cols * rows);
  var maxIter = j.maxIter, s = j.s, julia = j.julia, jr = j.jr, ji = j.ji;
  var halfW = j.W / 2, halfH = j.H / 2, cx = j.cx, cy = j.cy;
  var B2 = 65536, LN2 = Math.LN2, EPS = 1e-15;
  var k = 0;
  for (var r = 0; r < rows; r++) {
    var py = j.y0 + r * step + (step - 1) * .5;
    var ci0 = cy - (py - halfH) * s;
    for (var c = 0; c < cols; c++, k++) {
      var px = j.x0 + c * step + (step - 1) * .5;
      var cr0 = cx + (px - halfW) * s;
      var zr, zi, cr, ci;
      if (julia) { zr = cr0; zi = ci0; cr = jr; ci = ji; }
      else {
        zr = 0; zi = 0; cr = cr0; ci = ci0;
        var xq = cr - .25, q = xq * xq + ci * ci;
        if (q * (q + xq) <= .25 * ci * ci || (cr + 1) * (cr + 1) + ci * ci <= .0625) { out[k] = -1; continue; }
      }
      var zr2 = zr * zr, zi2 = zi * zi, n = 0, pr = zr, pi = zi, per = 0, lim = 8;
      while (n < maxIter && zr2 + zi2 <= B2) {
        zi = 2 * zr * zi + ci; zr = zr2 - zi2 + cr;
        zr2 = zr * zr; zi2 = zi * zi; n++;
        if (Math.abs(zr - pr) < EPS && Math.abs(zi - pi) < EPS) { n = maxIter; break; }
        if (++per === lim) { per = 0; lim += lim; pr = zr; pi = zi; }
      }
      if (n >= maxIter) out[k] = -1;
      else { var lz = Math.log(zr2 + zi2) * .5; out[k] = n + 1 - Math.log(lz / LN2) / LN2; }
    }
  }
  return { gen: j.gen, x0: j.x0, y0: j.y0, w: j.w, h: j.h, step: step, cols: cols, rows: rows, data: out };
}

    var dy = e.deltaY * (e.deltaMode === 1 ? 32 : e.deltaMode === 2 ? 400 : 1);
    zoomAbout(p[0], p[1], Math.exp(clamp(dy, -300, 300) * .0017));
    settle(220); dropHint();
  }, { passive: false });

  /* ------------------------------------------------------------ keyboard */
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
    if (typing) return;
    var k = e.key;
    var onBtn = t && t.tagName === 'BUTTON';
    if (k === 'j' || k === 'J') { setMode(mode === 'm' ? 'j' : 'm'); }
    else if (k === 'm' || k === 'M') { if (mode === 'j') setMode('m'); }
    else if (k === '+' || k === '=') { animateTo({ cx: view.cx, cy: view.cy, s: view.s / 2.5 }, 600); }
    else if (k === '-' || k === '_') { animateTo({ cx: view.cx, cy: view.cy, s: view.s * 2.5 }, 600); }
    else if (k === 'h' || k === 'H' || k === '0') { animateTo(homeView(), 1000); }
    else if (k === 'c' || k === 'C') toggleCycle();
    else if (k >= '1' && k <= '5') goMark(+k - 1);
    else if (k === '[' || k === ']') { detail = clamp(detail * (k === ']' ? 1.5 : 1 / 1.5), .25, 8); toast('Detail × ' + detail.toFixed(2) + ' · ' + autoIter() + ' iterations'); startRender(); }
    else if (!onBtn && (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown')) {
      e.preventDefault();
      var step = Math.min(CW, CH) * .15 * view.s;
      animateTo({ cx: view.cx + (k === 'ArrowLeft' ? -step : k === 'ArrowRight' ? step : 0), cy: view.cy + (k === 'ArrowUp' ? step : k === 'ArrowDown' ? -step : 0), s: view.s }, 300);
    }
    else if (!onBtn && k === 'Enter' && t === cv) { animateTo({ cx: view.cx, cy: view.cy, s: view.s / 3 }, 700); }
    else return;
    dropHint();
  });
  $('bIn').addEventListener('click', function () { animateTo({ cx: view.cx, cy: view.cy, s: view.s / 3 }, 700); dropHint(); });
  $('bOut').addEventListener('click', function () { animateTo({ cx: view.cx, cy: view.cy, s: view.s * 3 }, 700); dropHint(); });
  $('bHome').addEventListener('click', function () { if (mode === 'j') setMode('m', true); animateTo(homeView(), 1100); });

  /* ------------------------------------------------------------ frame loop */
  var last = performance.now(), running = false, raf = 0, hudT = 0;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    var dt = Math.min(.1, (now - last) / 1000); last = now;
    if (anim) {
      var p = Math.min(1, (now - anim.t0) / anim.dur);
      var e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      var f = anim.from, to = anim.to;
      view.s = f.s * Math.pow(to.s / f.s, e);
      view.cx = f.cx + (to.cx - f.cx) * e;
      view.cy = f.cy + (to.cy - f.cy) * e;
      drawSnapshot();
      if (p >= 1) { anim = null; startRender(); }
      hudT = 0;
    } else if (dirty) { dirty = false; drawSnapshot(); hudT = 0; }
    if (!useWorkers) mainSlice();
    if (cycling && !reduced) {
      cycleOff = (cycleOff + dt * .045) % 1;
      if (!rendering && !anim && !interacting) recolorAll();
      colourLens();
    }
    /* lens: follow the mouse, or dock on touch screens */
    lensDock = !lastMouse && mode === 'm';
    if (lensWant || lensDock) {
      var lw = lens.offsetWidth || 184, lh = (lens.offsetHeight || 230);
      if (lensDock) {
        if (W < 760) { lensTX = W - lw - 12; lensTY = 84; } else { lensTX = W - lw - 26; lensTY = 236; }
        var cc = [view.cx, view.cy];
        if (!hoverC || hoverC[0] !== cc[0] || hoverC[1] !== cc[1]) { hoverC = cc; lensPending = true; }
        if (lensTitle.textContent !== 'Julia at centre') lensTitle.textContent = 'Julia at centre';
      } else if (lastMouse) {
        lensTX = lastMouse[0] + 28; lensTY = lastMouse[1] + 28;
        if (lensTX + lw > W - 8) lensTX = lastMouse[0] - lw - 28;
        if (lensTY + lh > H - 8) lensTY = lastMouse[1] - lh - 28;
        if (lensTitle.textContent !== 'Julia set · press J') lensTitle.textContent = 'Julia set · press J';
      }
      lensTX = clamp(lensTX, 8, Math.max(8, W - lw - 8)); lensTY = clamp(lensTY, 8, Math.max(8, H - lh - 8));
      if (!lensPlaced) { lensPlaced = true; lensX = lensTX; lensY = lensTY; }
      var k = reduced ? 1 : Math.min(1, dt * 12);
      lensX += (lensTX - lensX) * k; lensY += (lensTY - lensY) * k;
      lens.style.transform = 'translate(' + lensX.toFixed(1) + 'px,' + lensY.toFixed(1) + 'px)';
      if (lensPending && hoverC && !dragging) { lensPending = false; renderLens(hoverC); }
      if (!lens.classList.contains('on')) lens.classList.add('on');
    } else if (lens.classList.contains('on')) lens.classList.remove('on');
    hudT -= dt;
    if (hudT <= 0) { hudT = .12; updHud(); }
  }
  function start() { if (running) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { running = false; cancelAnimationFrame(raf); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });
  if (mq) { var onMq = function () { reduced = mq.matches; }; if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq); }

  var resizeT = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      var wasHome = zoomLevel() < 1.5;
      lastMouse = null; lensWant = false; lensPlaced = false;
      size();
      if (wasHome && mode === 'm') { var hv = homeView(); view.cx = hv.cx; view.cy = hv.cy; view.s = hv.s; }
      anim = null; interacting = false;
      startRender();
    }, 80);
  });

  $('hThreads').textContent = useWorkers ? workers.length + ' threads' : 'main thread';
  size();
  var hv0 = homeView(); view.cx = hv0.cx; view.cy = hv0.cy; view.s = hv0.s;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);
  startRender();
  start();
})();
</script>
</body>
</html>
