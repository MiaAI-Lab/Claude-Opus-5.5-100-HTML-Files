<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HELIOS/OS v2.3 — Phosphor Terminal</title>
<meta name="description" content="HELIOS/OS v2.3: a retro CRT terminal simulation with a BIOS boot, a working shell, three phosphor themes, glyph rain, ASCII weather and a playable snake game.">
<meta name="theme-color" content="#031a07">
<style>
:root{
  --fg:#33ff66; --fg-rgb:51,255,102; --bg:#031a07; --bg-hi:#073012; --bg-lo:#010c03; --hot:#dcffe5;
  --mono:"SF Mono","IBM Plex Mono",Menlo,Consolas,"Cascadia Mono","DejaVu Sans Mono","Liberation Mono","Nimbus Mono PS",monospace;
  --fs:clamp(13px, 0.5rem + 0.62vw, 17.5px);
  --lh:1.38;
  --bezel:clamp(8px, 1.9vw, 28px);
  --status-h:calc(var(--fs) * 1.95);
  --pad-x:clamp(16px, 3vw, 50px);
  --shadow:0 0 1px rgba(var(--fg-rgb),.9), 0 0 6px rgba(var(--fg-rgb),.5), 0 0 17px rgba(var(--fg-rgb),.22);
}
html[data-theme="amber"]{ --fg:#ffb000; --fg-rgb:255,176,0; --bg:#1a0f00; --bg-hi:#2c1a02; --bg-lo:#0c0600; --hot:#fff1cc; }
html[data-theme="ice"]{ --fg:#9fe7ff; --fg-rgb:159,231,255; --bg:#02111a; --bg-hi:#07243a; --bg-lo:#01070c; --hot:#f2fcff; }

*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; height:100%; overflow:hidden; background:#0a0b09; }
body{
  height:100vh; height:100dvh; height:var(--app-h, 100dvh);
  display:grid; grid-template-rows:minmax(0,1fr) auto;
  font-family:var(--mono); color:var(--fg);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }

/* ------------------------------------------------ the monitor housing */
.monitor{
  position:relative; min-height:0;
  padding:var(--bezel) var(--bezel) calc(var(--bezel) * .55);
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255,255,255,.05), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    linear-gradient(#1d1f1a, #121310 70%, #0e0f0c);
}
.screen{
  position:relative; height:100%; overflow:hidden; isolation:isolate;
  border-radius:30px / 26px;
  background:#000;
  box-shadow:
    0 0 0 1px #000,
    0 0 0 6px #161814,
    0 0 0 7px #262822,
    0 0 70px 6px rgba(var(--fg-rgb),.09),
    0 14px 40px rgba(0,0,0,.6);
  transition:box-shadow .6s ease;
}
.screen.snake{ touch-action:none; }

/* the lit phosphor surface */
.crt{
  position:absolute; inset:0; border-radius:inherit; overflow:hidden;
  background:radial-gradient(120% 95% at 50% 46%, var(--bg-hi) 0%, var(--bg) 52%, var(--bg-lo) 100%);
  transform-origin:50% 50%;
  transition:background .5s ease;
}
.crt.off{ transform:scale(0,0); }
.crt.pon{ animation:pon .82s cubic-bezier(.25,.8,.25,1) both; }
.crt.poff{ animation:poff .62s cubic-bezier(.6,0,.8,.4) both; }
.crt.degauss{ animation:degauss .72s ease-out; }
.crt.glitch{ animation:glitch .24s steps(4) 1; }
@keyframes pon{
  0%{ transform:scale(.02,.004); filter:brightness(5); }
  32%{ transform:scale(1,.006); filter:brightness(4); }
  68%{ transform:scale(1,1.035); filter:brightness(1.6); }
  100%{ transform:none; filter:none; }
}
@keyframes poff{
  0%{ transform:none; filter:none; }
  48%{ transform:scale(1,.005); filter:brightness(4); }
  78%{ transform:scale(.004,.005); filter:brightness(7); }
  100%{ transform:scale(0,0); filter:brightness(7); }
}
@keyframes degauss{
  0%{ transform:none; filter:none; }
  12%{ transform:scale(1.012) skewX(-1.2deg) translateX(-4px); filter:hue-rotate(110deg) saturate(2.4) brightness(1.3); }
  28%{ transform:scale(.996) skewX(.9deg) translateX(3px); filter:hue-rotate(-80deg) saturate(1.8); }
  46%{ transform:skewX(-.5deg) translateX(-2px); filter:hue-rotate(40deg) saturate(1.3); }
  66%{ transform:skewX(.2deg) translateX(1px); filter:hue-rotate(-12deg); }
  100%{ transform:none; filter:none; }
}
@keyframes glitch{
  0%{ transform:translateX(0); }
  25%{ transform:translateX(5px) skewX(-2deg); }
  50%{ transform:translateX(-3px) skewX(1deg); }
  75%{ transform:translateX(2px); }
  100%{ transform:none; }
}

/* ------------------------------------------------ terminal text */
.term{
  position:absolute; inset:0 0 var(--status-h) 0; z-index:1;
  overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
  padding:clamp(16px, 2.6vw, 38px) var(--pad-x) 14px;
  font-size:var(--fs); line-height:var(--lh);
  color:var(--fg); text-shadow:var(--shadow);
  scrollbar-width:thin; scrollbar-color:rgba(var(--fg-rgb),.35) transparent;
  cursor:text;
}
.term::-webkit-scrollbar{ width:8px; }
.term::-webkit-scrollbar-thumb{ background:rgba(var(--fg-rgb),.3); border-radius:4px; }
.term ::selection{ background:var(--fg); color:var(--bg); text-shadow:none; }
#out{ min-height:0; }
.l{ white-space:pre-wrap; overflow-wrap:anywhere; min-height:calc(var(--lh) * 1em); }
.l.logo{ line-height:1.04; min-height:0; white-space:pre; overflow:visible; }
.l.art{ white-space:pre; overflow:hidden; text-overflow:clip; }
.banner .l{ animation:lineIn .38s ease-out both; }
.banner.still .l{ animation:none; }
@keyframes lineIn{ from{ opacity:0; filter:brightness(3); transform:translateX(-6px); } to{ opacity:1; filter:none; transform:none; } }

.hot{ color:var(--hot); text-shadow:0 0 2px var(--fg), 0 0 9px rgba(var(--fg-rgb),.75), 0 0 26px rgba(var(--fg-rgb),.4); }
.dim{ color:rgba(var(--fg-rgb),.58); text-shadow:0 0 5px rgba(var(--fg-rgb),.25); }
.faint{ color:rgba(var(--fg-rgb),.28); text-shadow:none; }
.b{ font-weight:700; }
.u{ text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
.inv{ background:var(--fg); color:var(--bg); text-shadow:none; box-shadow:0 0 12px rgba(var(--fg-rgb),.55); }
.err{ color:var(--hot); font-weight:700; }
.blink{ animation:blink 1s steps(1) infinite; }
.em{ color:var(--fg); text-shadow:0 0 3px var(--fg), 0 0 14px rgba(var(--fg-rgb),.6); }

.prompt-line{ position:relative; white-space:pre-wrap; overflow-wrap:anywhere; min-height:calc(var(--lh) * 1em); }
.ps1{ font-weight:700; }
.ps1 .path{ font-weight:400; }
.caret{
  display:inline-block; min-width:1ch; background:var(--fg); color:var(--bg); text-shadow:none;
  box-shadow:0 0 10px rgba(var(--fg-rgb),.75), 0 0 2px var(--fg);
  animation:blink 1.06s steps(1) infinite;
}
.caret.solid{ animation:none; }
.prompt-line:not(.focused) .caret{ background:transparent; color:var(--fg); box-shadow:inset 0 0 0 1px var(--fg), 0 0 8px rgba(var(--fg-rgb),.4); animation:none; }
@keyframes blink{ 0%,55%{ opacity:1; } 56%,100%{ opacity:0; } }
#cmd{
  position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; border:0;
  opacity:0; background:transparent; color:transparent; caret-color:transparent;
  font-size:16px; outline:none; cursor:text;
}
.probe{ position:absolute; left:-9999px; top:0; visibility:hidden; white-space:pre; }

.game{ line-height:1.2; white-space:pre; min-height:0; }
.game .hd{ color:var(--hot); text-shadow:0 0 3px var(--fg), 0 0 14px rgba(var(--fg-rgb),.85); }
.game .fd{ color:var(--hot); animation:blink .7s steps(1) infinite; font-style:normal; }
.game .gd{ color:rgba(var(--fg-rgb),.16); text-shadow:none; }
.game .wall{ color:rgba(var(--fg-rgb),.75); }
.game .msg{ background:var(--fg); color:var(--bg); text-shadow:none; }

/* ghost persistence after clear */
.ghost{
  position:absolute; inset:0 0 var(--status-h) 0; z-index:1; overflow:hidden; pointer-events:none;
  padding:clamp(16px, 2.6vw, 38px) var(--pad-x) 14px;
  font-size:var(--fs); line-height:var(--lh); color:var(--fg); text-shadow:var(--shadow);
  opacity:0;
}
.ghost > div{ will-change:transform; }
.ghost.fade{ animation:ghost 1.1s ease-out both; }
@keyframes ghost{ 0%{ opacity:.55; filter:blur(0); } 100%{ opacity:0; filter:blur(2px); } }

/* BIOS badge (top-right, like the vendor logo on an old POST screen) */
.bios-badge{
  position:absolute; z-index:1; top:clamp(16px, 2.6vw, 38px); right:var(--pad-x);
  width:clamp(120px, 13vw, 190px); height:auto; color:var(--fg);
  filter:drop-shadow(0 0 4px rgba(var(--fg-rgb),.7)) drop-shadow(0 0 16px rgba(var(--fg-rgb),.3));
  opacity:0; transition:opacity .3s ease; pointer-events:none;
}
.bios-badge.show{ opacity:1; }
.bios-badge .spin{ transform-origin:60px 46px; animation:spin 14s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* glyph-rain canvas */
.fx{ position:absolute; inset:0; z-index:2; width:100%; height:100%; pointer-events:none; opacity:0; transition:opacity .9s ease; }
.fx.on{ opacity:1; transition:opacity .25s ease; }

/* status line (tmux-like) */
.status{
  position:absolute; left:0; right:0; bottom:0; z-index:3; height:var(--status-h);
  display:flex; align-items:center; gap:1.4ch; padding:0 var(--pad-x);
  font-size:calc(var(--fs) * .8); letter-spacing:.05em; white-space:nowrap; overflow:hidden;
  background:rgba(var(--fg-rgb),.86); color:var(--bg);
  box-shadow:0 0 26px rgba(var(--fg-rgb),.38), 0 -1px 0 rgba(var(--fg-rgb),.5);
}
.status .tag{ font-weight:700; background:var(--bg); color:var(--fg); padding:.12em .7ch; text-shadow:0 0 6px rgba(var(--fg-rgb),.8); }
.status .fill{ flex:1; }
.sbtn{
  font:inherit; letter-spacing:inherit; color:inherit; background:transparent; border:0; padding:.2em .4ch; margin:0;
  cursor:pointer; border-radius:2px;
}
.sbtn:hover{ background:rgba(0,0,0,.14); }
.sbtn:focus-visible{ outline:2px solid var(--bg); outline-offset:-1px; }

/* ------------------------------------------------ glass effects */
.ov{ position:absolute; inset:0; pointer-events:none; border-radius:inherit; }
.grain{ position:absolute; inset:0; z-index:4; width:100%; height:100%; pointer-events:none; opacity:.045; mix-blend-mode:screen; }
.scan{
  z-index:5;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.3) 2px, rgba(0,0,0,.3) 3px);
}
.scan::after{
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(90deg, rgba(255,40,40,.035) 0 1px, rgba(40,255,40,.02) 1px 2px, rgba(40,40,255,.035) 2px 3px);
}
.roll{
  z-index:6; inset:auto 0 auto 0; top:0; height:20%;
  background:linear-gradient(180deg, rgba(var(--fg-rgb),0) 0%, rgba(var(--fg-rgb),.025) 55%, rgba(var(--fg-rgb),.055) 90%, rgba(var(--fg-rgb),.085) 96%, rgba(var(--fg-rgb),.02) 99%, rgba(var(--fg-rgb),0) 100%);
  animation:roll 8.5s linear infinite; border-radius:0;
}
@keyframes roll{ from{ transform:translateY(-100%); } to{ transform:translateY(520%); } }
.flicker{ z-index:7; background:#000; opacity:0; animation:flicker 5.3s steps(1) infinite; }
@keyframes flicker{
  0%{opacity:.02} 4%{opacity:.05} 8%{opacity:0} 12%{opacity:.035} 19%{opacity:.01} 23%{opacity:.06} 26%{opacity:.015}
  34%{opacity:.04} 41%{opacity:0} 47%{opacity:.03} 52%{opacity:.07} 54%{opacity:.01} 63%{opacity:.045} 71%{opacity:.02}
  77%{opacity:.055} 83%{opacity:.01} 90%{opacity:.04} 96%{opacity:.02}
}
.vignette{
  z-index:8;
  background:radial-gradient(ellipse 78% 74% at 50% 50%, rgba(0,0,0,0) 56%, rgba(0,0,0,.32) 78%, rgba(0,0,0,.78) 100%);
  box-shadow:inset 0 0 90px 18px rgba(0,0,0,.72), inset 0 0 8px 2px rgba(0,0,0,.95);
}
.glass{
  z-index:9;
  background:
    radial-gradient(55% 40% at 20% 6%, rgba(255,255,255,.075), rgba(255,255,255,0) 70%),
    radial-gradient(40% 22% at 84% 96%, rgba(255,255,255,.028), rgba(255,255,255,0) 70%),
    linear-gradient(168deg, rgba(255,255,255,.035) 0%, rgba(255,255,255,0) 32%);
}
.beam{
  position:absolute; z-index:10; left:4%; right:4%; top:50%; height:3px; margin-top:-1.5px; border-radius:3px;
  background:var(--hot); box-shadow:0 0 14px 3px rgba(var(--fg-rgb),.85), 0 0 50px 10px rgba(var(--fg-rgb),.4);
  opacity:0; pointer-events:none;
}
.beam.on{ animation:beam .8s ease-out both; }
.beam.dot{ animation:beamdot 1s ease-out both; }
@keyframes beam{
  0%{ opacity:1; transform:scaleX(.01); }
  30%{ opacity:1; transform:scaleX(1); }
  55%{ opacity:.7; transform:scaleX(1) scaleY(10); }
  100%{ opacity:0; transform:scaleX(1) scaleY(90); }
}
@keyframes beamdot{
  0%{ opacity:1; transform:scale(.004, 1.4); }
  60%{ opacity:.9; transform:scale(.004, 1.4); }
  100%{ opacity:0; transform:scale(.001, .6); }
}

/* ------------------------------------------------ bezel strip */
.strip{
  display:flex; align-items:center; gap:clamp(10px, 1.6vw, 22px);
  padding:calc(var(--bezel) * .35) var(--bezel) calc(var(--bezel) * .6 + env(safe-area-inset-bottom));
  background:linear-gradient(#10110e, #0b0c0a);
  border-top:1px solid rgba(255,255,255,.035);
  font-family:var(--mono); color:#9d9889;
  min-width:0;
}
.brand{ display:flex; align-items:center; gap:10px; flex:none; }
.led{
  width:9px; height:9px; border-radius:50%; background:#1a2a1c;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.6);
  transition:background .3s, box-shadow .3s;
}
.led.lit{ background:var(--fg); box-shadow:0 0 6px var(--fg), 0 0 14px rgba(var(--fg-rgb),.6), inset 0 -1px 1px rgba(0,0,0,.3); }
.brand-name{ font-size:12px; font-weight:700; letter-spacing:.34em; text-transform:uppercase; color:#b9b3a2; text-shadow:0 1px 0 #000, 0 -1px 0 rgba(255,255,255,.07); }
.brand-model{ font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#6c685c; }
.keys{ display:flex; gap:8px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; padding:4px 2px 6px; justify-content:center; }
.keys::-webkit-scrollbar{ display:none; }
.dials{ display:flex; align-items:center; gap:8px; flex:none; }
.dial-label{ font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:#6c685c; margin-right:2px; }
.key{
  flex:none; display:inline-flex; align-items:center; gap:7px;
  font:600 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
  color:#d4cebd; background:linear-gradient(#2d2f29, #1e201b 60%, #1a1b17);
  border:1px solid #060705; border-radius:5px; padding:9px 12px 8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09), inset 0 -2px 0 rgba(0,0,0,.25), 0 2px 0 #050604, 0 4px 8px rgba(0,0,0,.45);
  cursor:pointer; transition:transform .07s ease, box-shadow .07s ease, color .2s;
  touch-action:manipulation;
}
.key:hover{ color:#fff8e6; }
.key:active, .key.pressed{ transform:translateY(2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.2), 0 0 0 #050604, 0 1px 3px rgba(0,0,0,.5); }
.key:focus-visible, .brand:focus-visible{ outline:2px solid var(--fg); outline-offset:3px; }
.key svg{ width:12px; height:12px; }
.lamp{ position:relative; width:7px; height:7px; border-radius:50%; background:#141510; box-shadow:inset 0 1px 1px rgba(0,0,0,.7); }
.lamp::after{ content:""; position:absolute; inset:0; border-radius:50%; background:var(--c, var(--fg)); opacity:.26; transition:opacity .25s, box-shadow .25s; }
.key[aria-pressed="true"] .lamp::after{ opacity:1; box-shadow:0 0 6px var(--c, var(--fg)), 0 0 12px var(--c, var(--fg)); }

/* ------------------------------------------------ responsive */
@media (max-width: 980px){
  .brand-model{ display:none; }
}
@media (max-width: 720px){
  :root{ --fs:12px; --pad-x:12px; --bezel:8px; }
  .keys{ -webkit-mask-image:linear-gradient(90deg, #000 82%, transparent); mask-image:linear-gradient(90deg, #000 82%, transparent); padding-right:28px; }
  .tkey .tl{ display:none; }
  .tkey{ padding:9px 9px 8px; }
  .screen{ border-radius:18px / 16px; box-shadow:0 0 0 1px #000, 0 0 0 4px #161814, 0 0 40px 4px rgba(var(--fg-rgb),.09); }
  .strip{ gap:8px; padding:6px 8px calc(8px + env(safe-area-inset-bottom)); }
  .brand{ display:none; }
  .keys{ justify-content:flex-start; }
  .dial-label{ display:none; }
  .dials{ gap:6px; }
  .key{ padding:9px 10px 8px; letter-spacing:.1em; }
  .status .wide{ display:none; }
  .bios-badge{ display:none; }
  .vignette{ box-shadow:inset 0 0 50px 10px rgba(0,0,0,.7), inset 0 0 6px 2px rgba(0,0,0,.95); }
}
@media (max-width: 420px){
  .key .lbl-long{ display:none; }
}

@media (prefers-reduced-motion: reduce){
  .roll, .flicker{ animation:none; display:none; }
  .caret{ animation:none; }
  .crt.pon, .crt.poff, .crt.degauss, .crt.glitch{ animation-duration:.01s; }
  .banner .l{ animation:none; }
  .bios-badge .spin{ animation:none; }
  .beam{ display:none; }
}
</style>
</head>
<body>
<main class="monitor" id="monitor">
  <h1 class="sr">HELIOS/OS v2.3 — a simulated phosphor terminal</h1>
  <div class="screen" id="screen">
    <div class="crt off" id="crt">
      <svg class="bios-badge" id="biosBadge" viewBox="0 0 190 104" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="60" cy="46" r="17"/>
          <circle cx="60" cy="46" r="8" fill="currentColor" stroke="none"/>
          <g class="spin">
            <path d="M60 18v-12M60 74v12M32 46h-12M88 46h12M40.2 26.2l-8.5-8.5M79.8 65.8l8.5 8.5M40.2 65.8l-8.5 8.5M79.8 26.2l8.5-8.5"/>
          </g>
          <path d="M104 22h78M104 70h78" stroke-width="1.4"/>
        </g>
        <text x="104" y="42" fill="currentColor" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">HELIO</text>
        <text x="104" y="60" fill="currentColor" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5">GRAPH</text>
        <text x="104" y="88" fill="currentColor" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="9" letter-spacing="2.2">SOLAR COMPUTE</text>
      </svg>
      <div class="ghost" id="ghost" aria-hidden="true"></div>
      <div class="term" id="term">
        <div id="out" role="log" aria-live="polite" aria-label="Terminal output"></div>
        <div class="prompt-line" id="promptLine" hidden><span class="ps1" id="ps1"></span><span id="typed"></span><input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Terminal command input"></div>
        <span class="probe" id="probe" aria-hidden="true">0000000000</span>
      </div>
      <canvas class="fx" id="fx" aria-hidden="true"></canvas>
      <div class="status" id="status">
        <span class="tag">HELIOS/OS 2.3</span>
        <span class="wide">tty1</span>
        <span class="wide" id="stPath">operator@helios:~</span>
        <span class="fill"></span>
        <button type="button" class="sbtn" id="stTheme" aria-label="Cycle phosphor theme">[P1:GRN]</button>
        <button type="button" class="sbtn" id="stSound" aria-label="Toggle typing sounds" aria-pressed="false">[SND:OFF]</button>
        <span class="wide" id="stUp">up 0:00</span>
        <span id="stClock">--:--:--</span>
      </div>
    </div>
    <canvas class="grain" id="grain" aria-hidden="true"></canvas>
    <div class="ov scan" aria-hidden="true"></div>
    <div class="ov roll" aria-hidden="true"></div>
    <div class="ov flicker" aria-hidden="true"></div>
    <div class="ov vignette" aria-hidden="true"></div>
    <div class="ov glass" aria-hidden="true"></div>
    <div class="beam" id="beam" aria-hidden="true"></div>
  </div>
</main>
<footer class="strip">
  <div class="brand"><span class="led" id="led"></span><span class="brand-name">Heliograph</span><span class="brand-model">HX-14 · Monochrome Display</span></div>
  <nav class="keys" id="keys" aria-label="Quick commands">
    <button type="button" class="key" data-cmd="help">Help</button>
    <button type="button" class="key" data-cmd="ls -l">Ls</button>
    <button type="button" class="key" data-cmd="cat phosphor.txt">Poem</button>
    <button type="button" class="key" data-cmd="cat mission.log">Log</button>
    <button type="button" class="key" data-cmd="weather">Weather</button>
    <button type="button" class="key" data-cmd="snake">Snake</button>
    <button type="button" class="key" data-cmd="matrix">Matrix</button>
    <button type="button" class="key" data-cmd="clear">Clear</button>
  </nav>

/* ------------------------------------------------------------ helpers */

  return { cw, lh, cols: Math.max(24, Math.floor(iw / cw)), rows: Math.max(10, Math.floor(ih / lh)) };

/* ------------------------------------------------------------ audio (lazy, off by default) */
let actx = null, master = null, noiseBuf = null;
function audio(){

    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);

}

}
function trim(){ while (out.childElementCount > MAX_NODES) out.removeChild(out.firstElementChild); }
function newLine(cls, parent){
  const d = document.createElement('div');

function fillLine(el, line){

function scrollDown(){ term.scrollTop = term.scrollHeight; }

function emit(lines, cps){

async function pump(){

function play(j){
  return new Promise(done => {
    let li = 0, si = 0, ci = 0, lineEl = null, node = null, last = performance.now(), budget = 0;
    const frame = now => {
      budget += Math.max(0, now - last) / 1000 * j.cps; last = now;
      if (!isFinite(j.cps) || flushReq || reduced.matches || document.hidden) budget = Infinity;

        const L = j.lines[li];
        if (!lineEl){ lineEl = newLine(L.cls); si = 0; ci = 0; node = null; budget -= 1; }
        if (si >= L.segs.length){ li++; lineEl = null; continue; }

function complete(){

  const start = pos - word.length;
  const before = left.slice(0, start).trim().split(/\s+/).filter(Boolean);
  let cands = [];

  } else {
    const c0 = before[0].toLowerCase();
    const lists = { theme: ['green', 'amber', 'ice'], sound: ['on', 'off'], baud: ['1200', '2400', '9600', '19200', '57600', 'max'] };
    if (lists[c0]) cands = lists[c0].filter(x => x.startsWith(word));
    else {
      const sl = word.lastIndexOf('/');
      const dirPart = sl >= 0 ? word.slice(0, sl + 1) : '';
      const base = word.slice(sl + 1);
      const node = lookup(resolve(dirPart || '.'));
      if (node && node.type === 'dir'){
        cands = Object.keys(node.children)
          .filter(n => n.startsWith(base) && (base.startsWith('.') || !n.startsWith('.')))

    }
  }

  let ins;
  if (cands.length === 1) ins = cands[0] + (cands[0].endsWith('/') ? '' : ' ');

      const per = Math.max(1, Math.floor(measure().cols / w));
      const rows = [];
      for (let i = 0; i < cands.length; i += per) rows.push(cands.slice(i, i + per).map(c => c.padEnd(w, ' ')).join(''));
      printNow(rows.map(r => [S(r, 'dim')]));
      return;
    }
  }
  cmd.value = v.slice(0, start) + ins + v.slice(pos);
  const np = start + ins.length;
  cmd.setSelectionRange(np, np);
  renderInput();
}

      appendTo(bar, 'kernel ', 'dim'); appendTo(bar, '▕'); appendTo(bar, '█'.repeat(n), 'hot'); appendTo(bar, '░'.repeat(BW - n), 'faint'); appendTo(bar, '▏ ' + String(Math.round(k * 100)).padStart(3, ' ') + '%');
      if (k >= 1) res(); else requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  const svc = [
    ['ok', 'mounting /dev/hd0 on /'],
    ['ok', 'starting sysd · netd · cron · lpd'],
    ['ok', 'relay link: 3 hops, 212 ms'],
    ['ok', 'calibrating heliograph mirrors'],
    ['WARN', 'mirror #4 drift 0.3\' east'],
    ['ok', 'spooling mission log']
  ];
  for (const [s, t] of svc){
    await emit([[S('[', 'dim'), S(s === 'ok' ? ' ok ' : 'WARN', s === 'ok' ? 'hot' : 'inv'), S('] ', 'dim'), S(t)]], Infinity);
    await sleep(30 + Math.random() * 40);
  }
  await sleep(240);
  if (my !== bootToken) return;
  clearScreen(!fast);
  await login(my);
}
async function login(my){
  if (my == null) my = ++bootToken;
  state.mode = 'boot';
  await emit([[S('HELIOS/OS v2.3 "Aphelion" (helios) (tty1)', 'dim')], ''], Infinity);
  const ln = newLine('');
  appendTo(ln, 'helios login: ');
  await sleep(170);
  for (const ch of 'operator'){ appendTo(ln, ch); sfxKey('key'); await sleep(34 + Math.random() * 28); }
  const pw = newLine('');
  appendTo(pw, 'Password: ');
  await sleep(300);
  if (my !== bootToken) return;
  const prev = state.lastLogin;
  const now = new Date();
  store.set('lastLogin', now.getTime());
  await emit([[S('Last login: ', 'dim'), S(prev ? fmtDate(new Date(prev)) + ' on tty1' : 'never — welcome aboard, operator', 'dim')], ''], Infinity);
  state.lastLogin = now.getTime();
  showBanner();
  fast = false;
  await wait(reduced.matches ? 0 : 200);
  if (my !== bootToken) return;
  showPrompt();
}

/* ------------------------------------------------------------ weather */
async function weather(){
  const d = new Date();
  const r = mulberry(d.getFullYear() * 1000 + dayOfYear(d));
  const kinds = ['clear', 'partly', 'cloudy', 'rain', 'fog'];
  const pick = () => kinds[Math.floor(r() * kinds.length)];
  const now = pick();
  const temp = Math.round(8 + r() * 16), feels = temp - Math.round(1 + r() * 3);
  const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  const wind = `${dirs[Math.floor(r() * 8)]} ${Math.round(4 + r() * 22)} km/h`;
  const hum = Math.round(28 + r() * 55), vis = Math.round(4 + r() * 16);
  const { cols } = measure();
  const W = WX[now];
  const L = [
    [S(' HELIOS WEATHER SERVICE ', 'inv'), S(cols >= 60 ? '  Perihelion Dome 3 (fictional)' : '', 'dim')],
    [S(`${DAYS[d.getDay()]} ${d.getDate()} ${MONS[d.getMonth()]} · ${pad2(d.getHours())}:${pad2(d.getMinutes())} local · issued by relay-7`, 'dim')],
    ''
  ];
  const txt = [
    [S(W.name, 'hot b')],
    [S(`${temp > 0 ? '+' : ''}${temp} °C`, 'hot'), S(`  feels like ${feels > 0 ? '+' : ''}${feels} °C`, 'dim')],
    [S('wind       ', 'dim'), S(wind)],
    [S('humidity   ', 'dim'), S(hum + ' %')],
    [S('visibility ', 'dim'), S(vis + ' km')]
  ];
  if (cols >= 52){
    for (let i = 0; i < 5; i++) L.push({ cls: 'art', segs: [S(' ' + W.big[i].padEnd(21, ' '), 'em'), ...txt[i]] });
  } else {
    for (let i = 0; i < 5; i++) L.push({ cls: 'art', segs: [S(' ' + W.big[i], 'em')] });
    L.push('');
    for (const t of txt) L.push([S(' '), ...t]);
  }
  L.push('');
  const days = [1, 2, 3].map(k => { const dd = new Date(d.getTime() + k * 86400000); const kk = pick(); const hi = Math.round(9 + r() * 15); return { name: DAYS[dd.getDay()].toUpperCase(), k: kk, hi, lo: hi - Math.round(4 + r() * 6) }; });
  const cw = cols >= 52 ? 16 : 14;
  L.push({ cls: 'art', segs: [S(' ' + days.map(x => x.name.padEnd(cw, ' ')).join(''), 'b')] });
  for (let i = 0; i < 3; i++) L.push({ cls: 'art', segs: [S(' ' + days.map(x => WX[x.k].small[i].padEnd(cw, ' ')).join(''), 'em')] });
  const sgn = v => v > 0 ? '+' + v : String(v);
  L.push({ cls: 'art', segs: [S(' ' + days.map(x => `${sgn(x.hi)}/${sgn(x.lo)} °C`.padEnd(cw, ' ')).join(''), 'hot')] });
  L.push({ cls: 'art', segs: [S(' ' + days.map(x => WX[x.k].name.toLowerCase().slice(0, cw - 2).padEnd(cw, ' ')).join(''), 'dim')] });
  L.push('');
  L.push([S(' mirror advisory: ', 'dim'), S(now === 'fog' ? 'heliograph range reduced — use radio.' : now === 'clear' ? 'excellent flash conditions.' : 'intermittent flash conditions.')]);
  await print(L);
}

/* ------------------------------------------------------------ matrix glyph rain */
const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ZΞΣΔΛΠΨΩ=+*<>:¦|';
let matrixStop = null;
function runMatrix(){
  return new Promise(resolve => {
    state.mode = 'matrix';
    promptLine.hidden = true;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = crt.clientWidth, h = crt.clientHeight;
    fx.width = Math.round(w * dpr); fx.height = Math.round(h * dpr);
    const ctx = fx.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    const cs = getComputedStyle(root);
    const fg = cs.getPropertyValue('--fg').trim(), hot = cs.getPropertyValue('--hot').trim(), bgRGB = hexRGB(cs.getPropertyValue('--bg').trim());
    const fs = Math.max(13, Math.round(parseFloat(getComputedStyle(term).fontSize) * 1.08));
    const colW = Math.round(fs * .95);
    const n = Math.ceil(w / colW);
    const cols = [];
    for (let i = 0; i < n; i++) cols.push({ y: -Math.floor(Math.random() * 30), sp: 9 + Math.random() * 20, acc: 0, prev: null });
    ctx.font = `${fs}px ${cs.getPropertyValue('--mono')}`; ctx.textBaseline = 'top';
    const g = () => { const ch = GLYPHS[Math.floor(Math.random() * GLYPHS.length)]; return { ch, m: Math.random() < .5 }; };
    const draw = (gl, x, y) => {
      if (gl.m){ ctx.save(); ctx.translate(x + colW, y); ctx.scale(-1, 1); ctx.fillText(gl.ch, 0, 0); ctx.restore(); }
      else ctx.fillText(gl.ch, x, y);
    };
    requestAnimationFrame(() => fx.classList.add('on'));
    const t0 = performance.now(); let last = t0, ending = false, alive = true;
    const DUR = reduced.matches ? 1800 : 6500;
    const finish = () => {
      if (!alive) return; alive = false; matrixStop = null;
      fx.classList.remove('on');
      setTimeout(() => {
        ctx.clearRect(0, 0, w, h);
        print([[S('the rain stops. the signal remains.', 'dim')]]).then(() => { state.mode = 'busy'; resolve(); });
      }, reduced.matches ? 50 : 900);
    };
    matrixStop = finish;
    const frame = now => {
      if (!alive) return;
      const dt = Math.min(60, now - last); last = now;
      const fade = 1 - Math.pow(1 - .085, dt / 16.67);
      ctx.fillStyle = `rgba(${bgRGB},${fade})`; ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < n; i++){
        const c = cols[i]; const x = i * colW;
        c.acc += dt / 1000 * c.sp;
        while (c.acc >= 1){
          c.acc -= 1;
          if (c.prev){ ctx.fillStyle = fg; ctx.shadowBlur = 0; draw(c.prev, x, (c.y - 1) * fs); }
          if (c.y >= 0){
            const gl = g(); ctx.fillStyle = hot; ctx.shadowColor = fg; ctx.shadowBlur = 10; draw(gl, x, c.y * fs); ctx.shadowBlur = 0; c.prev = gl;
          }
          c.y++;
          if (c.y * fs > h + Math.random() * h * .6){ c.y = ending ? -99999 : -Math.floor(Math.random() * 12); c.prev = null; c.sp = 9 + Math.random() * 20; }
        }
      }
      for (let k = 0; k < 4; k++){
        const i = Math.floor(Math.random() * n), c = cols[i];
        if (c.y > 3){ ctx.fillStyle = fg; ctx.globalAlpha = .7; draw(g(), i * colW, Math.floor(Math.random() * (c.y - 1)) * fs); ctx.globalAlpha = 1; }
      }
      if (!ending && now - t0 > DUR){ ending = true; setTimeout(finish, 600); }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
}
function hexRGB(hex){
  const m = hex.replace('#', ''); const v = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
  return [0, 2, 4].map(i => parseInt(v.substr(i, 2), 16)).join(',');
}

/* ------------------------------------------------------------ snake */
let snake = null;
function runSnake(){
  return new Promise(resolve => {
    state.mode = 'snake';
    document.body.classList.add('snaking'); screen.classList.add('snake');
    $('#keys').hidden = true; $('#pad').hidden = false;
    const m = measure();
    const W = clamp(Math.floor((m.cols - 2) / 2), 10, 30);
    const H = clamp(m.rows - 6, 8, 18);
    let best = +store.get('snakeBest', 0) || 0;
    const head = newLine('');
    const board = newLine('game');
    const foot = newLine('dim');
    foot.textContent = coarse.matches ? 'swipe or use the pad to steer · pause · quit' : 'arrows / WASD steer · P pause · Q or Esc quit';
    let body = [], dir = { x: 1, y: 0 }, q = [], food = null, score = 0, paused = false, dead = false, acc = 0, last = performance.now(), alive = true;
    const cy = Math.floor(H / 2);
    for (let i = 0; i < 4; i++) body.push({ x: Math.floor(W / 2) - i, y: cy });
    const placeFood = () => {
      let p, tries = 0;
      do { p = { x: Math.floor(Math.random() * W), y: Math.floor(Math.random() * H) }; tries++; } while (body.some(b => b.x === p.x && b.y === p.y) && tries < 500);
      return p;
    };
    food = placeFood();
    const renderHead = () => {
      head.textContent = '';
      appendTo(head, ' SNAKE ', 'inv'); appendTo(head, '  score ', 'dim'); appendTo(head, String(score).padStart(3, '0'), 'hot b');
      appendTo(head, '  best ', 'dim'); appendTo(head, String(Math.max(best, score)).padStart(3, '0'));
      if (paused) appendTo(head, '  PAUSED', 'hot blink');
    };
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const draw = (msg) => {
      const grid = [];
      const occ = new Map();
      body.forEach((b, i) => occ.set(b.x + ',' + b.y, i));
      let html = '<span class="wall">┌' + '─'.repeat(W * 2) + '┐</span>\n';
      for (let y = 0; y < H; y++){
        let row = '<span class="wall">│</span>';
        if (msg && y === Math.floor(H / 2)){
          const t = (' ' + msg + ' ');
          const padL = Math.max(0, Math.floor((W * 2 - t.length) / 2));
          row += ' '.repeat(padL) + '<span class="msg">' + esc(t) + '</span>' + ' '.repeat(Math.max(0, W * 2 - padL - t.length));
        } else {
          for (let x = 0; x < W; x++){
            const k = x + ',' + y;
            if (occ.has(k)){
              const i = occ.get(k), n = body.length;
              row += i === 0 ? '<b class="hd">██</b>' : i >= n - 1 ? '░░' : i >= n - 3 ? '▒▒' : '▓▓';
            } else if (food.x === x && food.y === y) row += '<i class="fd">&lt;&gt;</i>';
            else row += '<span class="gd">· </span>';
          }
        }
        row += '<span class="wall">│</span>';
        grid.push(row);
      }
      html += grid.join('\n') + '\n<span class="wall">└' + '─'.repeat(W * 2) + '┘</span>';
      board.innerHTML = html;
      renderHead();
      scrollDown();
    };
    const turn = (dx, dy) => {
      const lastDir = q.length ? q[q.length - 1] : dir;
      if (dx === -lastDir.x && dy === -lastDir.y) return;
      if (dx === lastDir.x && dy === lastDir.y) return;
      if (q.length < 3) q.push({ x: dx, y: dy });
    };
    const step = () => {
      if (q.length) dir = q.shift();
      const h = { x: body[0].x + dir.x, y: body[0].y + dir.y };
      const willEat = h.x === food.x && h.y === food.y;
      const bodyHit = body.slice(0, willEat ? body.length : body.length - 1).some(b => b.x === h.x && b.y === h.y);
      if (h.x < 0 || h.y < 0 || h.x >= W || h.y >= H || bodyHit){ die(); return; }
      body.unshift(h);
      if (willEat){ score++; beep(1320, .05, 'square', .05); food = placeFood(); } else body.pop();
    };
    const die = () => {
      dead = true; beep(140, .35, 'sawtooth', .06);
      if (score > best){ best = score; store.set('snakeBest', best); }
      draw('GAME OVER · ' + score);
      setTimeout(() => finish(), reduced.matches ? 400 : 1300);
    };
    const finish = () => {
      if (!alive) return; alive = false; snake = null;
      document.body.classList.remove('snaking'); screen.classList.remove('snake');
      $('#keys').hidden = false; $('#pad').hidden = true;
      if (!dead) draw('QUIT · ' + score);
      if (score > best){ best = score; store.set('snakeBest', best); }
      print([[S('snake: ', 'dim'), S(score + ' pellet' + (score === 1 ? '' : 's'), 'hot'), S(' · best ' + best, 'dim')]]).then(() => { state.mode = 'busy'; resolve(); });
    };
    const loop = now => {
      if (!alive) return;
      const dt = Math.min(120, now - last); last = now;
      if (!paused && !dead){
        acc += dt;
        const iv = Math.max(62, 138 - score * 4);
        let changed = false;
        while (acc >= iv && !dead){ acc -= iv; step(); changed = true; }
        if (changed && !dead) draw();
      }
      requestAnimationFrame(loop);
    };
    snake = {
      key(e){
        const k = e.key.toLowerCase();
        const map = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
        if (map[k]){ e.preventDefault(); if (!paused) turn(...map[k]); }
        else if (k === 'p' || k === ' '){ e.preventDefault(); this.pause(); }
        else if (k === 'q' || k === 'escape'){ e.preventDefault(); this.quit(); }
        else if (dead){ finish(); }
      },
      dir(name){ const m2 = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }; if (m2[name] && !paused) turn(...m2[name]); },
      pause(){ if (dead) return; paused = !paused; draw(paused ? 'PAUSED' : null); },
      quit(){ if (!dead) finish(); }
    };
    draw();
    requestAnimationFrame(loop);
  });
}

/* ------------------------------------------------------------ auto-typed quick keys */
async function autoType(text){
  if (state.mode === 'boot'){ hurry(); return; }
  if (state.mode !== 'shell') return;
  state.mode = 'typing';
  cmd.value = ''; renderInput();
  for (const ch of text){ cmd.value += ch; cmd.setSelectionRange(cmd.value.length, cmd.value.length); renderInput(); poke(); sfxKey('key'); await wait(reduced.matches ? 0 : 34 + Math.random() * 38); }
  await wait(reduced.matches ? 0 : 140);
  state.mode = 'shell'; sfxKey('enter');
  submit();
}
document.querySelectorAll('#keys .key').forEach(b => b.addEventListener('click', () => autoType(b.dataset.cmd)));
document.querySelectorAll('#pad .key').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!snake) return;
  const d = b.dataset.dir;
  if (d === 'pause') snake.pause(); else if (d === 'quit') snake.quit(); else snake.dir(d);
}));
document.querySelectorAll('#pad .key').forEach(b => b.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && snake){ e.preventDefault(); e.stopPropagation(); const d = b.dataset.dir; if (d === 'pause') snake.pause(); else if (d === 'quit') snake.quit(); else snake.dir(d); }
}));
document.querySelectorAll('.tkey').forEach(b => b.addEventListener('click', () => { if (state.theme !== b.dataset.theme) applyTheme(b.dataset.theme, true); }));
$('#sndKey').addEventListener('click', () => setSound(!state.sound));
$('#stSound').addEventListener('click', e => { e.stopPropagation(); setSound(!state.sound); });
$('#stTheme').addEventListener('click', e => {
  e.stopPropagation();
  const order = ['green', 'amber', 'ice'];
  applyTheme(order[(order.indexOf(state.theme) + 1) % 3], true);
});

/* ------------------------------------------------------------ global keys + pointer */
document.addEventListener('keydown', e => {
  if (e === handledEvt) return;
  if (state.mode === 'boot' || state.mode === 'login'){ if (!e.metaKey && !e.altKey && e.key !== 'Tab') hurry(); return; }
  if (state.mode === 'matrix'){ if (e.key !== 'Tab'){ e.preventDefault(); if (matrixStop) matrixStop(); } return; }
  if (state.mode === 'snake'){ if (snake && e.key !== 'Tab') snake.key(e); return; }
  if (state.mode === 'busy'){
    if (e.key === 'Enter' || e.key === 'Escape' || (e.ctrlKey && e.key.toLowerCase() === 'c')){ e.preventDefault(); flushReq = true; }
    return;
  }
  if (state.mode === 'shell' && document.activeElement !== cmd && !e.ctrlKey && !e.metaKey && !e.altKey){
    const t = e.target;
    if (t && t.closest && t.closest('button') && (e.key === ' ' || e.key === 'Enter' || e.key === 'Tab')) return;
    if (e.key.length === 1 || e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Backspace'){ focusInput(); }
  }
});
let swipe = null;
screen.addEventListener('pointerdown', e => { if (state.mode === 'snake') swipe = { x: e.clientX, y: e.clientY }; });
screen.addEventListener('pointerup', e => {
  if (state.mode === 'snake' && swipe && snake){
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 22){ Math.abs(dx) > Math.abs(dy) ? snake.dir(dx > 0 ? 'right' : 'left') : snake.dir(dy > 0 ? 'down' : 'up'); }
    swipe = null;
  }
});
screen.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (state.mode === 'boot' || state.mode === 'login'){ hurry(); return; }
  if (state.mode === 'matrix'){ if (matrixStop) matrixStop(); return; }
  if (state.mode === 'busy'){ flushReq = true; return; }
  if (state.mode === 'shell'){
    const sel = window.getSelection && window.getSelection();
    if (sel && !sel.isCollapsed && sel.toString().length) return;
    state.userTapped = true;
    focusInput();
  }
});

/* ------------------------------------------------------------ ambient: grain, clock, glitches */
const gctx = grainC.getContext('2d');
let gimg = null, gFrame = 0;
function sizeGrain(){
  const w = Math.max(64, Math.round(screen.clientWidth / 3)), h = Math.max(48, Math.round(screen.clientHeight / 3));
  grainC.width = w; grainC.height = h; gimg = gctx.createImageData(w, h);
}
function grain(){
  if (!gimg) sizeGrain();
  const d = gimg.data;
  for (let i = 0; i < d.length; i += 4){ const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  gctx.putImageData(gimg, 0, 0);
}
function ambient(){
  if (!document.hidden && !reduced.matches && (gFrame++ & 1) === 0) grain();
  requestAnimationFrame(ambient);
}
function tick(){
  const d = new Date();
  $('#stClock').textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  $('#stUp').textContent = 'up ' + uptimeStr();
}
function glitchLater(){
  setTimeout(() => {
    if (!document.hidden && !reduced.matches && state.mode !== 'boot' && !crt.classList.contains('degauss')){
      crt.classList.remove('glitch'); void crt.offsetWidth; crt.classList.add('glitch');
      setTimeout(() => crt.classList.remove('glitch'), 260);
    }
    glitchLater();
  }, 11000 + Math.random() * 16000);
}

/* ------------------------------------------------------------ viewport + resize */
let rzT = 0, lastCols = 0;
function fitViewport(){
  const vv = window.visualViewport;
  root.style.setProperty('--app-h', Math.round(vv ? vv.height : window.innerHeight) + 'px');
  if (vv && vv.offsetTop) window.scrollTo(0, 0);
}
function onResize(){
  fitViewport();
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    sizeGrain(); if (reduced.matches) grain();
    const { cols } = measure();
    if (cols !== lastCols){ lastCols = cols; if (bannerEl) renderBanner(false); }
    scrollDown();
  }, 90);
}
window.addEventListener('resize', onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
crt.addEventListener('animationend', e => { if (e.target === crt) crt.classList.remove('pon', 'degauss', 'glitch'); });

/* ------------------------------------------------------------ start */
applyTheme(state.theme, false);
state.sound = false; /* typing sounds are always off until the operator turns them on */
fitViewport(); sizeGrain(); grain();
lastCols = measure().cols;
tick(); setInterval(tick, 1000);
requestAnimationFrame(ambient);
glitchLater();
boot(false);
})();
