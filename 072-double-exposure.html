<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somewhere Inside — A Double Exposure</title>
<meta name="description" content="Somewhere Inside: a double-exposure artwork in which a human profile holds a whole landscape, with mountains, ocean or city at dusk, drifting fog, birds and fragments of original poetry.">
<meta name="theme-color" content="#ece8e1">
<style>
:root{
  --mist-a:#f2efe9; --mist-b:#d9d4cc; --ink:#2a2230; --ink2:rgba(42,34,48,.62); --ink3:rgba(42,34,48,.38);
  --accent:#7e2553;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,"P052","URW Palladio L",Georgia,serif;
  --caps:"Optima","Candara","Gill Sans","Gill Sans MT","URW Classico","Trebuchet MS",sans-serif;
}
body[data-scene="ocean"]{--accent:#2f5d7c}
body[data-scene="city"]{--accent:#b4436c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:linear-gradient(180deg,var(--mist-a),var(--mist-b));color:var(--ink);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:4px;border-radius:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}

#art{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.grain{position:fixed;inset:-60%;width:220%;height:220%;pointer-events:none;background-image:var(--grain,none);background-size:180px 180px;opacity:.36;mix-blend-mode:overlay;animation:grain 1.1s steps(9) infinite}
@keyframes grain{
  0%{transform:translate(0,0)}11%{transform:translate(-3%,2%)}22%{transform:translate(2%,-4%)}33%{transform:translate(-5%,-1%)}44%{transform:translate(4%,3%)}
  55%{transform:translate(-1%,5%)}66%{transform:translate(3%,-2%)}77%{transform:translate(-4%,4%)}88%{transform:translate(1%,-5%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 50%,rgba(0,0,0,0) 55%,rgba(60,48,56,.18) 100%)}

.copy{position:fixed;z-index:2;right:clamp(28px,6vw,110px);top:50%;transform:translateY(-50%);width:min(390px,30vw);pointer-events:none}
.copy > *{pointer-events:auto}
.kicker{font-family:var(--caps);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink2)}
h1{font-weight:400;font-style:italic;font-size:clamp(40px,4.6vw,68px);line-height:.98;letter-spacing:-.01em;margin-top:14px}
h1 span{display:block;padding-left:1.1em}
.rule{display:block;width:56px;height:1px;background:var(--accent);margin:28px 0 24px;transition:background-color 1.2s}
.frag{position:relative;min-height:3.6em;font-style:italic;font-size:clamp(20px,1.75vw,26px);line-height:1.42;color:var(--ink)}
.frag p{position:absolute;inset:0 0 auto 0;opacity:0;filter:blur(6px);transform:translateY(8px);transition:opacity 1.6s ease,filter 1.6s ease,transform 1.6s ease}
.frag p.on{opacity:1;filter:blur(0);transform:none}
.count{margin-top:10px;font-family:var(--caps);font-size:11px;letter-spacing:.22em;color:var(--ink3)}
.scenes{display:flex;gap:4px;margin-top:34px;flex-wrap:wrap}
.scenes button{position:relative;padding:8px 12px 10px;font-family:var(--caps);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);transition:color .4s}
.scenes button::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.3,.8,.2,1),background-color 1.2s}
.scenes button:hover{color:var(--ink)}
.scenes button[aria-pressed="true"]{color:var(--ink)}
.scenes button[aria-pressed="true"]::after{transform:scaleX(1)}
.scenes button b{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0;margin-right:6px;text-transform:none;color:var(--ink3)}
.hint{margin-top:14px;font-size:14px;font-style:italic;color:var(--ink3)}
.sig{position:fixed;right:clamp(28px,6vw,110px);bottom:24px;z-index:2;font-family:var(--caps);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink3);pointer-events:none}
.sig i{font-family:var(--serif);font-style:italic;letter-spacing:.02em;text-transform:none;font-size:13px;color:var(--ink2)}

@media (max-width:820px){
  .copy{right:auto;left:0;top:0;transform:none;width:100%;padding:clamp(26px,6.4vh,60px) 24px 0;text-align:center}
  h1{font-size:44px;margin-top:10px}
  h1 span{display:inline;padding-left:0}
  .rule{margin:18px auto 16px}
  .frag{min-height:3em;font-size:19px}
  .scenes{justify-content:center;margin-top:12px}
  .scenes button{padding:8px 8px 10px;font-size:11px;letter-spacing:.14em}
  .scenes button b{display:none}
  .hint{display:none}
  .count{display:none}
  .sig{left:0;right:0;text-align:center;bottom:14px;color:rgba(242,239,233,.6)}
  .sig i{color:rgba(242,239,233,.75)}
}
@media (max-height:640px) and (max-width:820px){ .frag{min-height:3.4em;font-size:17px} h1{font-size:36px} }
@media (prefers-reduced-motion:reduce){
  .grain{animation:none}
  .frag p{transition:opacity .8s ease}
}
</style>
</head>
<body data-scene="mountains">
<canvas id="art" role="img" aria-label="A human profile in silhouette. Inside it lies a landscape at dusk; outside is pale mist. Click to travel to the next landscape."></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" id="grain" aria-hidden="true"></div>

<main class="copy">
  <p class="kicker">A double exposure</p>
  <h1>Somewhere <span>Inside</span></h1>
  <span class="rule" aria-hidden="true"></span>
  <div class="frag" id="frag" aria-live="polite"></div>
  <p class="count" id="count">i / iv</p>
  <nav class="scenes" aria-label="Landscape">
    <button type="button" data-s="mountains" aria-pressed="true"><b>i.</b>Mountains</button>
    <button type="button" data-s="ocean" aria-pressed="false"><b>ii.</b>Ocean</button>
    <button type="button" data-s="city" aria-pressed="false"><b>iii.</b>City</button>
  </nav>
  <p class="hint">Move to drift. Click the portrait to go further in.</p>
</main>
<p class="sig">Plate 72 · <i>ink, dusk and fog</i></p>

<script>
(() => {
'use strict';
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;
if (mq.addEventListener) mq.addEventListener('change', e => { reduced = e.matches; });

/* ---------- seeded random ---------- */
function rng(seed){ let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

/* ---------- film grain tile ---------- */
(function(){
  const c = mk(180, 180), g = c.getContext('2d'), d = g.createImageData(180, 180);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 150; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
  document.getElementById('grain').style.setProperty('--grain', 'url(data:' + c.toDataURL().slice(5) + ')');
})();

/* =====================================================================
   The profile: a single path in a 1000 x 1000 box, facing right
   ===================================================================== */
const SIL = new Path2D('M0 1000L0 930C60 880 180 840 270 812C330 792 362 770 372 735C380 706 378 684 370 664C354 654 334 650 314 644C262 650 212 616 206 560C200 502 236 458 286 452C300 450 312 452 322 458C326 356 396 250 500 218C592 190 690 212 740 272C772 310 780 360 776 402C774 420 770 432 772 444C774 452 766 460 768 470C780 500 808 532 822 556C828 566 822 576 808 578C798 580 790 582 790 590C792 600 800 606 800 614C800 620 792 624 788 628C796 634 798 644 792 652C786 660 780 664 782 674C786 690 790 704 784 716C776 734 752 742 728 746C700 750 680 758 672 776C664 800 668 830 690 860C720 900 800 930 900 950C950 960 1000 975 1000 1000Z');

/* =====================================================================
   Canvas + layout
   ===================================================================== */
const cv = document.getElementById('art'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 900, OX = 0, OY = 0, Q = 1, mobile = false;
function layout(){
  DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  mobile = W <= 820;
  if (mobile) {
    S = Math.min(W * 1.5, H * .72);
    OX = W / 2 - 514 * S / 1000; OY = H - S + S * .015;
  } else {
    S = Math.min(H * 1.08, W * .64);
    OX = Math.max(-S * .08, W * .05 - (S - H) * .05); OY = H - S + S * .02;
    const faceRight = OX + 830 * S / 1000, copyLeft = W - Math.min(390, W * .3) - Math.max(28, Math.min(110, W * .06)) - 30;
    if (faceRight > copyLeft) OX -= faceRight - copyLeft;
  }
  Q = S / 1000 * DPR;
  buildAll();
}

/* ---------- shared helpers ---------- */
const ridgeFn = u => 1 - Math.abs(Math.sin(u));
function ridge(seed, base, amp, f, sharp){
  const r = rng(seed), p = [r() * 9, r() * 9, r() * 9, r() * 9], pts = [];
  for (let x = -160; x <= 1160; x += 6) {
    const u = x * f;
    const y = base - amp * (.55 * Math.pow(ridgeFn(u + p[0]), sharp) + .3 * ridgeFn(u * 2.3 + p[1]) + .15 * Math.sin(u * 5.1 + p[2]) * .5 + .08 * (r() - .5));
    pts.push([x, y]);
  }
  return pts;
}
function ridgePath(pts, bottom){ const p = new Path2D(); p.moveTo(pts[0][0], bottom); pts.forEach(q => p.lineTo(q[0], q[1])); p.lineTo(pts[pts.length - 1][0], bottom); p.closePath(); return p; }
function pine(p, x, y, h){
  const w = h * .36;
  for (let k = 0; k < 3; k++) { const top = y - h + k * h * .24, bw = w * (.55 + k * .25), by = y - h * .3 + k * h * .16; p.moveTo(x, top); p.lineTo(x + bw, by); p.lineTo(x - bw, by); p.closePath(); }
  p.rect(x - h * .03, y - h * .32, h * .06, h * .32);
}
function forest(seed, x0, x1, y, hmin, hmax, dens){
  const r = rng(seed), p = new Path2D();
  for (let x = x0; x < x1; x += dens * (.5 + r())) pine(p, x, y + r() * 6, hmin + r() * (hmax - hmin));
  p.rect(x0, y + 2, x1 - x0, 60);
  return p;
}
function softSprite(w, h, blobs, col, seed){
  const c = mk(w, h), g = c.getContext('2d'), r = rng(seed);
  for (let i = 0; i < blobs; i++) {
    const x = r() * w, y = h * (.35 + r() * .3), rad = h * (.25 + r() * .35);
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(' + col + ',.55)'); gr.addColorStop(1, 'rgba(' + col + ',0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  /* feather every edge so the sprite never shows a seam */
  g.globalCompositeOperation = 'destination-in';
  const fx = g.createLinearGradient(0, 0, w, 0);
  fx.addColorStop(0, 'rgba(0,0,0,0)'); fx.addColorStop(.18, 'rgba(0,0,0,1)'); fx.addColorStop(.82, 'rgba(0,0,0,1)'); fx.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = fx; g.fillRect(0, 0, w, h);
  const fy = g.createLinearGradient(0, 0, 0, h);
  fy.addColorStop(0, 'rgba(0,0,0,0)'); fy.addColorStop(.3, 'rgba(0,0,0,1)'); fy.addColorStop(.7, 'rgba(0,0,0,1)'); fy.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = fy; g.fillRect(0, 0, w, h);
  return c;
}
/* shimmering reflection: slices are laid into an opaque scratch canvas first, so overlaps never darken */
function shimmer(m, t, amp, speed, freq){
  const rq = m.refl, wc = m.water, wg = wc.getContext('2d'), sh = 5;
  wg.setTransform(1, 0, 0, 1, 0, 0); wg.clearRect(0, 0, wc.width, wc.height);
  for (let y = 0; y < m.reflH; y += sh) {
    const off = reduced ? 0 : Math.sin(t * speed + y * freq) * (amp + y * .02);
    wg.drawImage(rq, 0, Math.round(y * Q), rq.width, Math.ceil(sh * Q) + 1, Math.round(off * Q), Math.round(y * Q), rq.width, Math.ceil(sh * Q) + 1);
  }
  return wc;
}
function skyGrad(stops){ const g = ctx.createLinearGradient(0, 150, 0, 1000); stops.forEach(s => g.addColorStop(s[0], s[1])); return g; }

/* =====================================================================
   Scenes (all in box units; ctx already carries the box transform)
   ===================================================================== */
const scenes = {};

/* ---------- I. Mountains ---------- */
scenes.mountains = {
  build(){
    const m = this;
    m.far = ridgePath(ridge(11, 560, 120, .011, 1.6), 760);
    m.mid = ridgePath(ridge(29, 600, 95, .016, 1.8), 760);
    m.near = ridgePath(ridge(47, 634, 46, .022, 1.2), 760);
    m.trees = forest(5, -160, 1160, 652, 16, 40, 11);
    const fg = new Path2D(), r = rng(71);
    for (let x = -60; x < 250; x += 26 + r() * 22) pine(fg, x, 1010, 150 + r() * 130);
    for (let x = 800; x < 1080; x += 26 + r() * 22) pine(fg, x, 1010, 140 + r() * 140);
    m.fg = fg;
    const sr = rng(3); m.stars = [];
    for (let i = 0; i < 70; i++) m.stars.push([sr() * 1000, 180 + sr() * 260, sr() * 1.3 + .4, sr() * 6]);
    /* static reflection of the ridges + treeline, flipped about the waterline */
    const RW = 1320, RH = 360; m.refl = mk(RW * Q, RH * Q);
    const g = m.refl.getContext('2d'); g.setTransform(Q, 0, 0, -Q, 160 * Q, 652 * Q);
    g.fillStyle = '#7a3e62'; g.globalAlpha = .75; g.fill(m.far);
    g.fillStyle = '#4a2452'; g.globalAlpha = .9; g.fill(m.mid);
    g.fillStyle = '#28173a'; g.globalAlpha = 1; g.fill(m.near); g.fill(m.trees);
    m.reflH = RH; m.water = mk(RW * Q, RH * Q);
    m.fog = softSprite(900 * Q, 120 * Q, 26, '255,226,222', 9);
    const gr = rng(12); m.glints = [];
    for (let i = 0; i < 22; i++) m.glints.push([Math.pow(i / 21, 1.5) * 230 + 10, (gr() - .5) * 18, 8 + gr() * 26, gr() * 6]);
  },
  draw(a, t, px, py){
    const m = this;
    ctx.globalAlpha = a;
    ctx.fillStyle = skyGrad([[0, '#1d2b53'], [.36, '#4a2a5e'], [.55, '#7e2553'], [.64, '#c65a6c'], [.72, '#ff9e7d'], [1, '#ffb892']]);
    ctx.fillRect(-200, 0, 1400, 1000);
    ctx.fillStyle = '#fff';
    for (const s of m.stars) { ctx.globalAlpha = a * (.35 + .35 * Math.sin(t * 1.3 + s[3])); ctx.fillRect(s[0] + px * .1, s[1] + py * .1, s[2], s[2]); }
    /* moon */
    const mx = 560 + px * .15, my = 398 + py * .12;
    let gr = ctx.createRadialGradient(mx, my, 20, mx, my, 170);
    gr.addColorStop(0, 'rgba(255,230,214,.55)'); gr.addColorStop(1, 'rgba(255,230,214,0)');
    ctx.globalAlpha = a; ctx.fillStyle = gr; ctx.fillRect(mx - 170, my - 170, 340, 340);
    ctx.fillStyle = '#fff3e6'; ctx.beginPath(); ctx.arc(mx, my, 32, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(200,170,180,.35)'; ctx.beginPath(); ctx.arc(mx - 9, my - 6, 8, 0, 6.283); ctx.arc(mx + 10, my + 9, 5, 0, 6.283); ctx.fill();
    /* ranges */
    ctx.save(); ctx.translate(px * .25, py * .15); ctx.fillStyle = '#9c4a6a'; ctx.globalAlpha = a * .8; ctx.fill(m.far); ctx.restore();
    ctx.save(); ctx.translate(px * .45, py * .25); ctx.fillStyle = '#5a2a5e'; ctx.globalAlpha = a; ctx.fill(m.mid); ctx.restore();
    const fx = ((t * 9) % 900);
    ctx.globalAlpha = a * .55; ctx.drawImage(m.fog, -fx + px * .5, 560, 900, 120); ctx.drawImage(m.fog, 900 - fx + px * .5, 560, 900, 120);
    ctx.save(); ctx.translate(px * .7, py * .35); ctx.globalAlpha = a; ctx.fillStyle = '#2e1a40'; ctx.fill(m.near); ctx.fillStyle = '#1a1030'; ctx.fill(m.trees); ctx.restore();
    /* lake */
    const wy = 652 + py * .35;
    gr = ctx.createLinearGradient(0, wy, 0, 1000);
    gr.addColorStop(0, '#d9767e'); gr.addColorStop(.18, '#8a3f66'); gr.addColorStop(.55, '#3a2150'); gr.addColorStop(1, '#1b1636');
    ctx.globalAlpha = a; ctx.fillStyle = gr; ctx.fillRect(-200, wy, 1400, 1000 - wy + 20);
    ctx.globalAlpha = a * .62;
    ctx.drawImage(shimmer(m, t, .6, 1.4, .13), -160 + px * .7, wy, 1320, m.reflH);
    /* moon on the water: loose, flickering glints */
    ctx.fillStyle = '#ffe9d8';
    for (const g2 of m.glints) {
      const flick = .5 + .5 * Math.sin(t * 2.6 + g2[3] * 2.1);
      const w = g2[2] * (.45 + .75 * flick) * (1 + g2[0] / 160);
      ctx.globalAlpha = a * (.62 - g2[0] / 420) * (.3 + .7 * flick);
      ctx.beginPath(); ctx.ellipse(mx + px * .55 + g2[1] * (1 + g2[0] / 120) + Math.sin(t * 1.3 + g2[3]) * 3, wy + 6 + g2[0], w / 2, 1 + g2[0] / 120, 0, 0, 6.283); ctx.fill();
    }
    /* a small boat drifting on the moon's path */
    const bx = 606 + px * .8 + Math.sin(t * .11) * 18, by = wy + 58 + Math.sin(t * 1.3) * 1.2;
    ctx.strokeStyle = '#ffe3d2'; ctx.lineWidth = .8;
    for (let i = 0; i < 3; i++) { const f = ((reduced ? .4 : t * .35) + i / 3) % 1; ctx.globalAlpha = a * (1 - f) * .45; ctx.beginPath(); ctx.ellipse(bx, by + 3, 16 + f * 40, 2 + f * 3, 0, 0, 6.283); ctx.stroke(); }
    ctx.globalAlpha = a; ctx.fillStyle = '#140c22';
    ctx.beginPath(); ctx.moveTo(bx - 17, by - 3); ctx.quadraticCurveTo(bx, by + 5, bx + 17, by - 3); ctx.lineTo(bx + 13, by + 1.5); ctx.quadraticCurveTo(bx, by + 5.5, bx - 13, by + 1.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + 2, by - 11, 2.6, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx - 1.5, by - 8.5); ctx.lineTo(bx + 5.5, by - 8.5); ctx.lineTo(bx + 4.5, by - 2); ctx.lineTo(bx - 2.5, by - 2); ctx.closePath(); ctx.fill();
    const oar = Math.sin(t * 1.1) * .25;
    ctx.strokeStyle = '#140c22'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx + 1, by - 5); ctx.lineTo(bx - 14 + oar * 10, by + 4 + oar * 4); ctx.stroke();
    ctx.globalAlpha = a * .5; ctx.drawImage(m.fog, fx * .7 - 400 + px * .8, 690, 1000, 110);
    ctx.save(); ctx.translate(px * 1.2, py * .5); ctx.globalAlpha = a; ctx.fillStyle = '#100a1c'; ctx.fill(m.fg); ctx.restore();
  }
};

/* ---------- II. Ocean ---------- */
scenes.ocean = {
  build(){
    const m = this, r = rng(17);
    m.stars = [];
    for (let i = 0; i < 50; i++) m.stars.push([r() * 1000, 190 + r() * 200, r() * 1.2 + .4, r() * 6]);
    const cliff = new Path2D();
    cliff.moveTo(610, 700); cliff.lineTo(612, 598); cliff.bezierCurveTo(640, 585, 660, 572, 690, 566); cliff.lineTo(750, 560); cliff.bezierCurveTo(800, 556, 850, 548, 900, 552);
    cliff.bezierCurveTo(960, 556, 1040, 540, 1160, 548); cliff.lineTo(1160, 700); cliff.closePath();
    m.cliff = cliff;
    const rocks = new Path2D();
    rocks.moveTo(-60, 1010); rocks.lineTo(-60, 860); rocks.bezierCurveTo(10, 830, 60, 846, 110, 880); rocks.bezierCurveTo(150, 900, 190, 930, 230, 1010); rocks.closePath();
    rocks.moveTo(820, 1010); rocks.bezierCurveTo(860, 930, 920, 900, 980, 905); rocks.lineTo(1080, 915); rocks.lineTo(1080, 1010); rocks.closePath();
    m.rocks = rocks;
    m.cloud = softSprite(700 * Q, 60 * Q, 18, '232,204,230', 23);
    m.waves = [];
    for (let i = 0; i < 8; i++) m.waves.push({ y: 606 + Math.pow(i / 7, 1.7) * 360, amp: 2 + i * 2.6, f: .03 - i * .0022, sp: .4 + i * .22, ph: r() * 6, col: i });
  },
  draw(a, t, px, py){
    const m = this;
    ctx.globalAlpha = a;
    ctx.fillStyle = skyGrad([[0, '#0f2240'], [.34, '#2c4a78'], [.5, '#6a6f9c'], [.58, '#d99a93'], [.64, '#f6bf9a'], [1, '#f6bf9a']]);
    ctx.fillRect(-200, 0, 1400, 1000);
    ctx.fillStyle = '#fff';
    for (const s of m.stars) { ctx.globalAlpha = a * (.3 + .3 * Math.sin(t * 1.1 + s[3])); ctx.fillRect(s[0] + px * .1, s[1] + py * .1, s[2], s[2]); }
    const cx = ((t * 6) % 700);
    ctx.globalAlpha = a * .6; ctx.drawImage(m.cloud, -cx + px * .2, 440, 700, 60); ctx.drawImage(m.cloud, 700 - cx + px * .2, 440, 700, 60);
    ctx.globalAlpha = a * .4; ctx.drawImage(m.cloud, cx * .6 - 300 + px * .15, 360, 900, 50);
    /* rising moon */
    const mx = 470 + px * .15, my = 522 + py * .1;
    let gr = ctx.createRadialGradient(mx, my, 20, mx, my, 190);
    gr.addColorStop(0, 'rgba(255,238,200,.6)'); gr.addColorStop(1, 'rgba(255,238,200,0)');
    ctx.globalAlpha = a; ctx.fillStyle = gr; ctx.fillRect(mx - 190, my - 190, 380, 380);
    ctx.fillStyle = '#fff4dc'; ctx.beginPath(); ctx.arc(mx, my, 40, 0, 6.283); ctx.fill();
    /* sea base */
    const hy = 600 + py * .2;
    gr = ctx.createLinearGradient(0, hy, 0, 1000);
    gr.addColorStop(0, '#8d7fa6'); gr.addColorStop(.08, '#465c8e'); gr.addColorStop(.45, '#1f2f5a'); gr.addColorStop(1, '#0c1330');
    ctx.fillStyle = gr; ctx.fillRect(-200, hy, 1400, 1000 - hy + 20);
    /* headland + lighthouse */
    ctx.save(); ctx.translate(px * .45, py * .2);
    ctx.fillStyle = '#1b2244'; ctx.fill(m.cliff);
    const lx = 722, ly = 476;
    ctx.fillStyle = '#20284c';
    ctx.beginPath(); ctx.moveTo(lx - 10, 562); ctx.lineTo(lx - 6.5, 488); ctx.lineTo(lx + 6.5, 488); ctx.lineTo(lx + 10, 562); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(lx - 8.6, 520, 17.2, 7); ctx.fillRect(lx - 7.6, 500, 15.2, 6);
    ctx.fillStyle = '#20284c'; ctx.fillRect(lx - 9, 484, 18, 4); ctx.beginPath(); ctx.moveTo(lx - 7, 470); ctx.lineTo(lx, 461); ctx.lineTo(lx + 7, 470); ctx.closePath(); ctx.fill();
    const ang = reduced ? 1.2 : t * 1.05, face = Math.sin(ang), dir = Math.cos(ang);
    ctx.fillStyle = '#ffe7a8'; ctx.fillRect(lx - 5, 471, 10, 13);
    gr = ctx.createRadialGradient(lx, ly, 2, lx, ly, 40 + Math.max(0, face) * 60);
    gr.addColorStop(0, 'rgba(255,236,180,' + (.55 + Math.max(0, face) * .4).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(255,236,180,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = gr; ctx.fillRect(lx - 110, ly - 110, 220, 220);
    const L = 620 * Math.abs(dir) + 40, spread = 16 + Math.max(0, face) * 50;
    const bx = lx + Math.sign(dir) * L, bg = ctx.createLinearGradient(lx, ly, bx, ly);
    bg.addColorStop(0, 'rgba(255,236,190,' + (.34 * a).toFixed(3) + ')'); bg.addColorStop(1, 'rgba(255,236,190,0)');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(lx, ly - 3); ctx.lineTo(bx, ly - spread); ctx.lineTo(bx, ly + spread * .7); ctx.lineTo(lx, ly + 3); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
    /* waves, back to front */
    const cols = ['#40548a', '#374b7e', '#2e4072', '#263665', '#1f2d58', '#19244a', '#131c3d', '#0e1532'];
    for (const w of m.waves) {
      const y0 = w.y + py * (.2 + w.col * .06), sp = reduced ? .1 : w.sp;
      ctx.globalAlpha = a; ctx.fillStyle = cols[w.col];
      ctx.beginPath(); ctx.moveTo(-200, 1010);
      for (let x = -200; x <= 1200; x += 12) {
        const xx = x + px * (.3 + w.col * .1);
        const y = y0 - w.amp * (Math.sin(x * w.f + t * sp + w.ph) * .6 + Math.sin(x * w.f * 2.3 - t * sp * 1.3 + w.ph * 2) * .4);
        ctx.lineTo(xx, y);
      }
      ctx.lineTo(1200, 1010); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(214,220,255,' + (.12 + w.col * .025).toFixed(3) + ')'; ctx.lineWidth = .8 + w.col * .18;
      ctx.beginPath();
      for (let x = -200; x <= 1200; x += 12) {
        const xx = x + px * (.3 + w.col * .1);
        const y = y0 - w.amp * (Math.sin(x * w.f + t * sp + w.ph) * .6 + Math.sin(x * w.f * 2.3 - t * sp * 1.3 + w.ph * 2) * .4);
        if (x === -200) ctx.moveTo(xx, y); else ctx.lineTo(xx, y);
      }
      ctx.stroke();
    }
    /* moon glitter, laid over the swell */
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#ffe9c4';
    for (let i = 0; i < 30; i++) {
      const yy = hy + 5 + i * 6 + i * i * .22, flick = .5 + .5 * Math.sin(t * 3.4 + i * 2.3);
      const w = (5 + i * 2.4) * (.45 + .75 * flick);
      ctx.globalAlpha = a * (.55 - i * .016) * (.25 + .75 * flick);
      ctx.beginPath(); ctx.ellipse(mx + px * .5 + Math.sin(t * 1.7 + i * .8) * (2 + i * .4), yy, w / 2, .8 + i * .05, 0, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.save(); ctx.translate(px * 1.1, py * .45); ctx.globalAlpha = a; ctx.fillStyle = '#0a0f26'; ctx.fill(m.rocks);
    ctx.strokeStyle = 'rgba(230,236,255,.35)'; ctx.lineWidth = 1.4;
    for (let i = 0; i < 3; i++) { const f = (t * .5 + i * .33) % 1; ctx.globalAlpha = a * (1 - f) * .6; ctx.beginPath(); ctx.ellipse(110 + i * 20, 890 + f * 10, 60 + f * 50, 6 + f * 4, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke(); }
    ctx.restore();
  }
};

/* ---------- III. City ---------- */
scenes.city = {
  build(){
    const m = this;
    const sky = (seed, base, hmin, hmax, wmin, wmax, lit, dim) => {
      const r = rng(seed), body = new Path2D(), wins = [];
      for (let x = -170; x < 1170;) {
        const w = wmin + r() * (wmax - wmin), h = hmin + r() * (hmax - hmin);
        body.rect(x, base - h, w, h + 200);
        if (r() < .25) { body.rect(x + w * .3, base - h - 14 - r() * 20, w * .4, 30); }
        if (r() < .18) { body.moveTo(x + w / 2, base - h - 40 - r() * 30); body.lineTo(x + w / 2 + 1, base - h); body.lineTo(x + w / 2 - 1, base - h); body.closePath(); }
        for (let yy = base - h + 6; yy < base - 4; yy += 7) for (let xx = x + 3; xx < x + w - 4; xx += 5.5) if (r() < lit) wins.push([xx, yy, r() < .8 ? 0 : 1, r()]);
        x += w + r() * 5;
      }
      return { body, wins, dim };
    };
    m.far = sky(101, 646, 40, 130, 14, 34, .08, .35);
    m.mid = sky(202, 652, 60, 190, 18, 44, .16, .7);
    m.near = sky(303, 660, 30, 110, 26, 60, .2, 1);
    const r = rng(9); m.stars = [];
    for (let i = 0; i < 40; i++) m.stars.push([r() * 1000, 190 + r() * 180, r() + .4, r() * 6]);
    /* reflection: streaks of window light */
    const RW = 1320, RH = 340; m.refl = mk(RW * Q, RH * Q);
    const g = m.refl.getContext('2d'); g.setTransform(Q, 0, 0, Q, 170 * Q, 0);
    [m.mid, m.near].forEach((L, li) => { L.wins.forEach(w => { if ((w[3] * 7 | 0) % 2) return; g.fillStyle = w[2] ? 'rgba(170,215,255,.5)' : 'rgba(255,205,130,.55)'; g.fillRect(w[0], (L === m.near ? 660 : 652) - w[1] + 8, 2.6, 10 + li * 16 + w[3] * 18); }); });
    g.fillStyle = 'rgba(255,150,110,.25)'; g.fillRect(-170, 0, 1320, 14);
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'destination-in';
    const fade = g.createLinearGradient(0, 0, 0, RH * Q); fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(1, 'rgba(0,0,0,.05)');
    g.fillStyle = fade; g.fillRect(0, 0, RW * Q, RH * Q);
    m.reflH = RH; m.water = mk(RW * Q, RH * Q);
    m.haze = softSprite(1000 * Q, 90 * Q, 30, '255,150,120', 44);
    m.bridge = new Path2D();
    m.bridge.rect(-170, 718, 1340, 7);
    for (let x = -120; x < 1150; x += 120) { m.bridge.moveTo(x, 725); m.bridge.quadraticCurveTo(x + 60, 690, x + 120, 725); m.bridge.lineTo(x + 116, 725); m.bridge.quadraticCurveTo(x + 60, 697, x + 4, 725); m.bridge.closePath(); m.bridge.rect(x - 4, 725, 8, 60); }
    const fg = new Path2D(), fr = rng(5);
    fg.moveTo(-80, 1010); fg.lineTo(-80, 880); fg.bezierCurveTo(40, 870, 150, 900, 260, 1010); fg.closePath();
    for (let x = -40; x < 200; x += 30 + fr() * 20) { const h = 60 + fr() * 70; fg.moveTo(x, 900); fg.arc(x, 900 - h * .5, h * .38, 0, 6.283); }
    fg.moveTo(840, 1010); fg.bezierCurveTo(900, 930, 980, 915, 1080, 920); fg.lineTo(1080, 1010); fg.closePath();
    m.fg = fg;
  },
  draw(a, t, px, py){
    const m = this;
    ctx.globalAlpha = a;
    ctx.fillStyle = skyGrad([[0, '#0b0a24'], [.26, '#241640'], [.38, '#3b1d5a'], [.45, '#8b3b6e'], [.52, '#ff8a5c'], [1, '#ffa070']]);
    ctx.fillRect(-200, 0, 1400, 1000);
    ctx.fillStyle = '#fff';
    for (const s of m.stars) { ctx.globalAlpha = a * (.25 + .3 * Math.sin(t * 1.6 + s[3])); ctx.fillRect(s[0] + px * .1, s[1] + py * .1, s[2], s[2]); }
    /* crescent */
    const mx = 470 + px * .14, my = 330 + py * .1;
    let gr = ctx.createRadialGradient(mx, my, 10, mx, my, 110);
    gr.addColorStop(0, 'rgba(255,220,230,.35)'); gr.addColorStop(1, 'rgba(255,220,230,0)');
    ctx.globalAlpha = a; ctx.fillStyle = gr; ctx.fillRect(mx - 110, my - 110, 220, 220);
    ctx.fillStyle = '#ffeef0'; ctx.beginPath(); ctx.arc(mx, my, 22, 0, 6.283); ctx.arc(mx + 9, my - 6, 20, 0, 6.283, true); ctx.fill('evenodd');
    const drawLayer = (L, col, base, dx, dy, winA) => {
      ctx.save(); ctx.translate(dx, dy);
      ctx.globalAlpha = a; ctx.fillStyle = col; ctx.fill(L.body);
      for (let i = 0; i < L.wins.length; i++) {
        const w = L.wins[i];
        const on = w[3] > .06 || Math.sin(t * .7 + i) > 0;
        if (!on) continue;
        const tw = w[3] < .12 ? .5 + .5 * Math.sin(t * 4 + i * 3) : 1;
        ctx.globalAlpha = a * L.dim * winA * tw;
        ctx.fillStyle = w[2] ? '#a9d8ff' : '#ffd28a';
        ctx.fillRect(w[0], w[1], 2.4, 3.2);
      }
      ctx.restore();
    };
    ctx.globalAlpha = a * .8; ctx.drawImage(m.haze, px * .2 - 20, 560, 1040, 110);
    drawLayer(m.far, '#6d3a6e', 646, px * .25, py * .15, .8);
    /* radio mast */
    ctx.save(); ctx.translate(px * .45, py * .25);
    ctx.strokeStyle = '#2d1a44'; ctx.lineWidth = 1.4; ctx.globalAlpha = a;
    ctx.beginPath(); ctx.moveTo(606, 560); ctx.lineTo(612, 392); ctx.lineTo(618, 560); ctx.moveTo(608, 500); ctx.lineTo(616, 470); ctx.moveTo(609, 450); ctx.lineTo(615, 430); ctx.stroke();
    const blink = reduced ? 1 : (Math.sin(t * 3) > .2 ? 1 : .15);
    gr = ctx.createRadialGradient(612, 390, 0, 612, 390, 18); gr.addColorStop(0, 'rgba(255,60,60,' + (.8 * blink).toFixed(2) + ')'); gr.addColorStop(1, 'rgba(255,60,60,0)');
    ctx.fillStyle = gr; ctx.fillRect(594, 372, 36, 36);
    ctx.restore();
    drawLayer(m.mid, '#3a1f4f', 652, px * .45, py * .25, 1);
    drawLayer(m.near, '#1b1030', 660, px * .7, py * .35, 1);
    /* river */
    const wy = 664 + py * .35;
    gr = ctx.createLinearGradient(0, wy, 0, 1000);
    gr.addColorStop(0, '#6a2f5c'); gr.addColorStop(.2, '#2c1742'); gr.addColorStop(1, '#0f0a20');
    ctx.globalAlpha = a; ctx.fillStyle = gr; ctx.fillRect(-200, wy, 1400, 1000 - wy + 20);
    ctx.globalAlpha = a * .9;
    ctx.drawImage(shimmer(m, t, .5, 1.9, .16), -170 + px * .7, wy, 1320, m.reflH);
    /* bridge + night train */
    ctx.save(); ctx.translate(px * .85, py * .4);
    ctx.globalAlpha = a; ctx.fillStyle = '#140b26'; ctx.fill(m.bridge);
    const tx = reduced ? 300 : ((t * 60) % 1700) - 350;
    for (let i = 0; i < 7; i++) {
      ctx.fillStyle = '#1b1030'; ctx.fillRect(tx + i * 30, 707, 28, 11);
      ctx.fillStyle = '#ffd98f'; ctx.globalAlpha = a * .9;
      for (let j = 0; j < 4; j++) ctx.fillRect(tx + i * 30 + 3 + j * 6.4, 710, 4, 3.5);
      ctx.globalAlpha = a;
    }
    ctx.restore();
    ctx.globalAlpha = a * .45; ctx.drawImage(m.haze, -px * .3 - 60, 740, 1120, 90);
    ctx.save(); ctx.translate(px * 1.2, py * .5); ctx.globalAlpha = a; ctx.fillStyle = '#0b0718'; ctx.fill(m.fg); ctx.restore();
  }
};

function buildAll(){ Object.values(scenes).forEach(s => s.build()); outerFog = softSprite(1200, 260, 30, '255,255,255', 91); }
let outerFog = null;

/* =====================================================================
   Birds: ink marks that cross in and out of the portrait
   ===================================================================== */
const birds = [];
for (let i = 0; i < 7; i++) birds.push({ x: 0, y: 0, v: 0, s: 1, ph: Math.random() * 6, f: 5 + Math.random() * 3, alive: false, wait: i * 2.2 });
function spawnBird(b){
  const fromLeft = Math.random() < .75;
  b.s = (mobile ? .7 : 1) * (.7 + Math.random() * .7);
  b.y = OY + S * (.26 + Math.random() * .28);
  b.x = fromLeft ? OX + S * (.35 + Math.random() * .3) : W + 30;
  b.v = (fromLeft ? 1 : -1) * (28 + Math.random() * 26) * (mobile ? .8 : 1);
  b.dy = -4 - Math.random() * 8; b.alive = true;
}
function drawBirds(dt, t){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.strokeStyle = '#2a2230'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const b of birds) {
    if (!b.alive) { b.wait -= dt; if (b.wait <= 0) spawnBird(b); continue; }
    if (!reduced) { b.x += b.v * dt; b.y += b.dy * dt + Math.sin(t * .8 + b.ph) * .15; }
    if (b.x > W + 40 || b.x < -40 || b.y < -40) { b.alive = false; b.wait = 3 + Math.random() * 6; continue; }
    const flap = Math.sin(t * b.f + b.ph), w = 9 * b.s, dir = Math.sign(b.v);
    ctx.lineWidth = 1.5 * b.s + .3;
    ctx.beginPath();
    ctx.moveTo(b.x - w * dir * .1 - w, b.y - flap * w * .55);
    ctx.quadraticCurveTo(b.x - w * .45, b.y - w * .35 - flap * w * .2, b.x, b.y + w * .08);
    ctx.quadraticCurveTo(b.x + w * .45, b.y - w * .35 - flap * w * .2, b.x + w - w * dir * .1, b.y - flap * w * .55);
    ctx.stroke();
  }
}

/* =====================================================================
   Frame
   ===================================================================== */
const ORDER = ['mountains', 'ocean', 'city'];
let cur = 'mountains', prev = null, mix = 1;
let px = 0, py = 0, tpx = 0, tpy = 0, T = 0, last = 0, raf = 0;
function render(dt){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#f2efe9'); bg.addColorStop(1, '#d9d4cc');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(OX + S * .55, OY + S * .45, 0, OX + S * .55, OY + S * .45, S * .75);
  glow.addColorStop(0, 'rgba(255,250,244,.85)'); glow.addColorStop(1, 'rgba(255,250,244,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  /* outside fog wisps */
  const fx = (T * 14) % (W + 1200);
  ctx.globalAlpha = .55; ctx.drawImage(outerFog, fx - 1200, H * .18, 1200, 260); ctx.drawImage(outerFog, W - fx * .7, H * .6, 1300, 240);
  ctx.globalAlpha = 1;
  /* soft print shadow of the portrait */
  const k = S / 1000;
  ctx.setTransform(DPR * k, 0, 0, DPR * k, DPR * (OX + 10), DPR * (OY + 12));
  ctx.fillStyle = 'rgba(60,46,58,.08)'; ctx.fill(SIL);
  /* the inside */
  ctx.setTransform(DPR * k, 0, 0, DPR * k, DPR * OX, DPR * OY);
  ctx.save(); ctx.clip(SIL);
  const e = mix < .5 ? 2 * mix * mix : 1 - Math.pow(-2 * mix + 2, 2) / 2;
  if (prev) scenes[prev].draw(1, T, px, py);
  scenes[cur].draw(prev ? e : 1, T, px, py);
  ctx.globalAlpha = 1;
  /* inner edge: ink-soft vignette hugging the silhouette */
  for (const [w, al] of [[90, .06], [54, .08], [26, .1], [9, .14]]) { ctx.lineWidth = w; ctx.strokeStyle = 'rgba(20,12,28,' + al + ')'; ctx.stroke(SIL); }
  const lg = ctx.createLinearGradient(0, 870, 0, 1000); lg.addColorStop(0, 'rgba(242,239,233,0)'); lg.addColorStop(1, 'rgba(236,231,224,.42)');
  ctx.fillStyle = lg; ctx.fillRect(-100, 870, 1300, 150);
  ctx.restore();
  /* a fine ink contour */
  ctx.lineWidth = 1.1 / k; ctx.strokeStyle = 'rgba(42,34,48,.3)'; ctx.stroke(SIL);
  drawBirds(dt, T);
}
function frame(now){
  const dt = last ? Math.min(.05, (now - last) / 1000) : .016; last = now; T += dt;
  if (!reduced) { const idleX = Math.sin(T * .13) * 6, idleY = Math.sin(T * .09) * 3; px += (tpx + idleX - px) * Math.min(1, dt * 2.2); py += (tpy + idleY - py) * Math.min(1, dt * 2.2); }
  if (mix < 1) { mix = Math.min(1, mix + dt / (reduced ? .6 : 1.7)); if (mix >= 1) prev = null; }
  render(dt);
  raf = requestAnimationFrame(frame);
}
function start(){ if (!raf) { last = 0; raf = requestAnimationFrame(frame); } }
function stop(){ if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });

/* =====================================================================
   Words
   ===================================================================== */
const WORDS = {
  mountains: ['I carry a range of mountains<br>where my worries used to be.', 'Somewhere inside,<br>the lake keeps a second moon.', 'Every pine is a word<br>I never said out loud.', 'The fog knows the way home<br>better than I do.'],
  ocean: ['There is a lighthouse in me<br>that no one has to tend.', 'The tide goes out<br>only as far as I let it.', 'Salt on the tongue<br>of an old, good memory.', 'Each wave says the same thing,<br>more gently than the last.'],
  city: ['A city stays awake<br>at the back of my head.', 'Every lit window is a thought<br>someone forgot to close.', 'I have streets in me<br>that have no names yet.', 'The last train home<br>runs on time only in dreams.']
};
const ROMAN = ['i', 'ii', 'iii', 'iv'];
const fragEl = document.getElementById('frag'), countEl = document.getElementById('count');
let fi = 0, fragTimer = 0;
function showFrag(){
  const list = WORDS[cur], p = document.createElement('p');
  p.innerHTML = list[fi % list.length];
  fragEl.appendChild(p);
  requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add('on')));
  [...fragEl.children].forEach(c => { if (c !== p) { c.classList.remove('on'); setTimeout(() => c.remove(), 1700); } });
  countEl.textContent = ROMAN[fi % list.length] + ' / iv';
}
function nextFrag(){ fi++; showFrag(); }
function restartTimer(){ clearInterval(fragTimer); fragTimer = setInterval(nextFrag, 6800); }

/* =====================================================================
   Scene switching
   ===================================================================== */
const btns = [...document.querySelectorAll('.scenes button')];
function setScene(name){
  if (name === cur && !prev) return;
  prev = cur; cur = name; mix = 0;
  document.body.dataset.scene = name;
  btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.s === name ? 'true' : 'false'));
  fi = 0; showFrag(); restartTimer();
}
btns.forEach(b => b.addEventListener('click', () => setScene(b.dataset.s)));
cv.addEventListener('click', () => setScene(ORDER[(ORDER.indexOf(cur) + 1) % 3]));
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') setScene(ORDER[(ORDER.indexOf(cur) + 1) % 3]);
  else if (e.key === 'ArrowLeft') setScene(ORDER[(ORDER.indexOf(cur) + 2) % 3]);
  else if (e.key === '1' || e.key === '2' || e.key === '3') setScene(ORDER[+e.key - 1]);
});
window.addEventListener('pointermove', e => {
  if (reduced) return;
  tpx = (e.clientX / W - .5) * -46; tpy = (e.clientY / H - .5) * -22;
}, { passive: true });
let rt = 0;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 80); });

layout();
showFrag(); restartTimer();
start();
})();
</script>
